function lb(k,n,p){return n>0&&k>=0&&k<=n?k*Math.log(p)+(n-k)*Math.log(1-p):0}
function terms(m,v,G,Gm){const out=[],warn=[];for(const e of m.els){if(e.t!=='rate')continue;const c=v[e.k];if(c==null||c==='')continue;let k=+c,g=G;

 else if(e.t==='pct'){const n=v[e.k+'_n'],k=v[e.k+'_k'];if(n==null||n===''||k==null||k==='')continue;if(+k>+n)continue;l+=lb(+k,+n,e.p[i]/100)}

 if(sm.notes.length)o+=`<p class="note">示唆メモ：${sm.notes.map(esc).join(' / ')}</p>`;{const W=terms(m,st.v,G,gMine(st)).warn;if(st.total!==''&&+st.start>+st.total)W.unshift(m.at?'打ち始め通常回転数が通常回転数より大きいです（通常時の項目は自分の分を計算から外します）':'打ち始め回転数が総回転数より大きいです');if(m.at&&st.ttotal!==''&&+st.tstart>+st.ttotal)W.unshift('打ち始め総回転数が総回転数より大きいので、機械割の実測を出しません');if(m.at)for(const k of['xbig','xreg'])if(st.v[k]!=null&&st.v[k+'_s']!=null&&+st.v[k+'_s']>+st.v[k])W.push('打ち始め'+k.slice(1).toUpperCase()+'が現在の回数より大きいです（記録のみ）');if(W.length)o=`<div class="warn">${W.map(esc).join('<br>')}</div>`+o}$('out').innerHTML=o;
 const rows=[];const near=(arr,val)=>{if(val==null||!isFinite(val))return-1;let b=0;arr.forEach((x,i)=>{if(Math.abs(x-val)<Math.abs(arr[b]-val))b=i});return b};
 const TT=new Map(terms(m,st.v,G,gMine(st)).out.map(x=>[x[0].k,x]));for(const e of m.els){if(e.t==='rate'){const t=TT.get(e.k),me=t&&t[1]>0?t[2]/t[1]:null;rows.push([e.l,e.d.map(x=>'1/'+x),me?'1/'+r1(me):'-',near(e.d,me)])}
  else if(e.t==='pct'){const n=st.v[e.k+'_n']||0,k=st.v[e.k+'_k']||0,me=n?k/n*100:null;rows.push([e.l,e.p.map(x=>x+'%'),me!=null?r1(me)+'%':'-',near(e.p,me)])}
  else{const cs=e.c.map((c,j)=>st.v[e.k+'_'+j]||0),t=cs.reduce((a,b)=>a+b,0);e.c.forEach((c,j)=>{const col=e.p.map(r=>r[j]),me=t?cs[j]/t*100:null;rows.push([e.l+' '+c,col.map(x=>x+'%'),me!=null?r1(me)+'%':'-',near(col,me)])})}}
 const TG=m.at&&st.ttotal!==''?(+st.ttotal-(+st.tstart||0)):null,PG=TG!=null?(TG>0?TG:0):G;const pm=(PG>0&&mo.diff!=null)?(3*PG+mo.diff)/(3*PG)*100:null;
 rows.push(['機械割',m.payout.map(x=>x+'%'),pm!=null?r1(pm)+'%':'-',near(m.payout,pm)]);
 $('tbl').innerHTML=`<table><tr><th>項目</th>${S.map(s=>`<th>設${s}</th>`).join('')}<th>実測</th></tr>${rows.map(r=>`<tr><td style="text-align:left">${esc(r[0])}</td>${r[1].map((x,i)=>`<td class="${i===r[3]?'hit':''}">${x}</td>`).join('')}<td class="me">${r[2]}</td></tr>`).join('')}</table>
 <p class="note">機械割の実測は（投入3枚×計算G数＋合算差枚）÷投入の概算（合算差枚が出るときのみ）。${m.at?'AT機は総回転数を入れると（総回転数−打ち始め総回転数）で計算。':''}</p>`}

window.saveH=()=>{read();const m=M[mid],sm=summary(m,st),fp=fingerprint(mid,st);const h=hist();
 if(h.some(e=>e.fp===fp)&&!confirm('同じ内容のデータがあります。保存しますか？'))return;
 const mo=money(st,stores());
 h.unshift({id:genId(),mid,machine:m.name,store:st.store,memo:st.memo,date:st.date,saved:new Date().toISOString(),fp,
  st:JSON.parse(JSON.stringify(st)),G:useG(st),lend:mo.lend,rate:mo.rate,diff:mo.diff,yen:mo.yen,p:sm.p,avg:sm.avg,hi:sm.hi,hints:hintText(m,st.checks),exported:false});putHist(h);renderH();banner();alert('保存しました')};

window.exportCSV=async all=>{const h=hist(),list=all?h:h.filter(e=>!e.exported);if(!list.length){alert('書き出すデータがありません');return}
 const name=`slot_settei_${today()}.csv`,blob=new Blob([buildCSV(list)],{type:'text/csv'});let ok=false;

 if(!ok){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
 const ids=new Set(list.map(e=>e.id));putHist(h.map(e=>ids.has(e.id)?{...e,exported:true}:e));banner();if(mid&&!$('mach').classList.contains('hidden'))renderH();else home()};

// ===== 同期用の純粋関数（nodeでテスト可） =====
function storeKey(x){return 'n:'+String(x.name||'').trim()}
function entryKey(x){return x.id}
function strip(x){const{updatedAt,...r}=x;return JSON.stringify(r)}
// 旧リスト(tombstone含む)と新しい表示リストから、変更分にupdatedAtを付け、消えた物をtombstone化
function applyChanges(raw,next,key,now){const old=new Map(raw.map(x=>[key(x),x])),out=[],seen=new Set();
 for(const x of next){const k=key(x);seen.add(k);const o=old.get(k);if(o&&!o.deleted&&strip(o)===strip({...x,deleted:undefined}))out.push(o);else{const y={...x,updatedAt:now};delete y.deleted;if(!y.id)y.id=(o&&o.id)||genId();out.push(y)}}
 for(const[k,o]of old)if(!seen.has(k))out.push(o.deleted?o:{id:o.id,name:o.name,deleted:true,updatedAt:now});return out}
function mergeList(a,b,key){const m=new Map();for(const x of[...(a||[]),...(b||[])]){const k=key(x);const o=m.get(k);if(!o||String(x.updatedAt||'')>String(o.updatedAt||''))m.set(k,x)}return[...m.values()]}
function mergeData(l,r){r=r||{};const ent=mergeList(l.entries,r.entries,entryKey).sort((x,y)=>String(y.saved||y.updatedAt||'').localeCompare(String(x.saved||x.updatedAt||'')));
 return{version:1,stores:mergeList(l.stores,r.stores,storeKey),entries:ent,updatedAt:new Date().toISOString()}}
function sameData(a,b){const n=d=>JSON.stringify({s:[...(d.stores||[])].sort((x,y)=>storeKey(x)<storeKey(y)?-1:1),e:[...(d.entries||[])].sort((x,y)=>x.id<y.id?-1:1)});return n(a)===n(b||{})}
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b64){const s=atob(b64.replace(/\s/g,''));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b)}
// ===== CSV（UI外：nodeでテスト可） =====
function csvCols(ext){const c=[];for(const[k,m]of Object.entries(M)){if(!!m.ext!==!!ext)continue;for(const e of m.els){if(e.t==='rate')c.push([k,'v',e.k,m.name+':'+e.l]);else if(e.t==='pct'){c.push([k,'v',e.k+'_n',m.name+':'+e.l+'(母数)']);c.push([k,'v',e.k+'_k',m.name+':'+e.l+'(当選)'])}else e.c.forEach((x,j)=>c.push([k,'v',e.k+'_'+j,m.name+':'+e.l+' '+x]))}
 m.hints.forEach((g,gi)=>g[1].forEach((x,hi)=>c.push([k,'c',gi+'_'+hi,m.name+':示唆 '+g[0].replace(/（.*）/,'')+' '+x[0]+'('+x[1]+')'])))}return c}
const q=x=>{x=String(x??'');return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
function buildCSV(list){const base=csvCols(false),xc=csvCols(true),cols=base,sc=[];for(const[k,m]of Object.entries(M))for(const e of m.els)if(e.sk)sc.push([k,'v',e.k+'_s',m.name+':打ち始め'+e.l]);for(const[k,m]of Object.entries(M))if(m.at)for(const[x,l]of[['xbig','BIG'],['xbig_s','打ち始めBIG'],['xreg','REG'],['xreg_s','打ち始めREG']])sc.push([k,'v',x,m.name+':'+l+'(記録)']);const head=['id','fingerprint','日付','店舗','機種','台番号/メモ','打ち始めG','総回転数','自分G','計算G数','計算G方式',...cols.map(c=>c[3]),'投資(円)','投資(枚)','回収(枚)','回収(円)','貸出枚数/1000円','換金額(円/枚)','合算差枚','合算収支(円)','期待設定','設定4以上%',...S.map(s=>'設定'+s+'%'),'示唆','保存日時',...xc.map(c=>c[3]),...sc.map(c=>c[3]),'打ち始め総回転数','総回転数(AT込)'];
 const lines=[head.map(q).join(',')];for(const e of list){const s=e.st;const r1=x=>x==null?'':Math.round(x*10)/10;
  lines.push([e.id,e.fp||fingerprint(e.mid,s),e.date,e.store,e.machine,e.memo,s.start,s.total,s.total!==''?Math.max(0,(+s.total||0)-(+s.start||0)):'',e.G,s.gmode==='mine'?'自分の分だけ':'履歴全体',
   ...cols.map(c=>c[0]!==e.mid?'':c[1]==='v'?(s.v[c[2]]??''):(s.checks[c[2]]||0)),s.invYen,s.invMai,s.retMai,s.retYen,e.lend??'',e.rate??'',r1(e.diff),r1(e.yen),
   e.avg!=null?e.avg.toFixed(2):'',e.hi!=null?(e.hi*100).toFixed(1):'',...S.map((x,i)=>e.p?(e.p[i]*100).toFixed(1):''),e.hints,e.saved||'',...[...xc,...sc].map(c=>c[0]!==e.mid?'':c[1]==='v'?(s.v[c[2]]??''):(s.checks[c[2]]||0)),s.tstart??'',s.ttotal??''].map(q).join(','))}
 return '\ufeff'+lines.join('\r\n')}
if(typeof module!=='undefined')Object.assign(module.exports,{buildCSV,applyChanges,mergeList,mergeData,sameData,b64enc,b64dec,storeKey,entryKey});
