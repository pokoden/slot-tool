function terms(m,v,G,Gm){const out=[],warn=[];for(const e of m.els){if(e.t!=='rate')continue;const c=v[e.k];if(c==null||c==='')continue;let k=+c,g=G;
 if(e.sk){k=c-(+v[e.k+'_s']||0);if(k<0){warn.push(e.l+'：打ち始め'+e.l+'が現在の回数より大きいので計算から外しました');continue}}
 if(!(g>0)){continue}out.push([e,k,g])}return{out,warn}}
function likelihood(m,v,G,Gm){const T=terms(m,v,G,Gm).out;return S.map((s,i)=>{let l=0;for(const[e,k,g]of T)l+=lb(k,g,1/e.d[i]);for(const e of m.els){

 else if(e.t==='pct'){const n=v[e.k+'_n'],k=v[e.k+'_k'];if(n==null||n===''||k==null||k==='')continue;if(+k>+n)continue;l+=lb(+k,+n,e.p[i]/100)}
 else{const tot=e.p[i].reduce((a,b)=>a+b,0);e.c.forEach((c,j)=>{const x=v[e.k+'_'+j]||0;if(x)l+=x*Math.log(e.p[i][j]/tot)})}}return l})}
function allowed(m,checks){let a=new Set(S),notes=[];m.hints.forEach((g,gi)=>g[1].forEach((h,hi)=>{const n=+checks[gi+'_'+hi]||0;if(n>0){if(h[2])a=new Set([...a].filter(s=>h[2].includes(s)));else notes.push(h[0]+'：'+h[1]+'×'+n)}}));return{a,notes}}
function post(m,v,G,checks,Gm){const L=likelihood(m,v,G,Gm),{a,notes}=allowed(m,checks||{});
 if(!a.size)return{p:null,notes};const mx=Math.max(...L.filter((x,i)=>a.has(S[i])));
 const w=L.map((x,i)=>a.has(S[i])?Math.exp(x-mx):0),z=w.reduce((x,y)=>x+y);return{p:w.map(x=>x/z),notes}}
function useG(st){const tot=+st.total||0,start=+st.start||0;return Math.max(0,tot-start)}
function gMine(st){if(st.total===''||st.total==null)return null;const g=(+st.total||0)-(+st.start||0);return g>0?g:null}
function summary(m,st){const r=post(m,st.v,useG(st),st.checks,gMine(st));if(!r.p)return{p:null,avg:null,hi:null,notes:r.notes};
 const avg=r.p.reduce((a,x,i)=>a+x*S[i],0);return{p:r.p,avg,hi:r.p[3]+r.p[4]+r.p[5],notes:r.notes}}

function exOf(s){return s&&+s.ex>0?+s.ex:(s&&+s.rate>0?Math.round(100/s.rate*1000)/1000:null)}
function money(st,stores){const N=x=>x===''||x==null?0:+x||0;const s=(stores||[]).find(x=>x.name===(st.store||'').trim())||null;
 const lend=s&&+s.lend>0?+s.lend:null,ex=exOf(s),rate=ex?100/ex:null;
 // 回収−使用貯メダル−使用所持メダル（回収空欄＝0扱い→(所持後−所持前)+(貯後−貯前)と同じ）
 // 使った現金＝サンド投入現金−サンド残り現金（残り空欄＝投入そのまま）
 const E0=x=>x===''||x==null,iy=!E0(st.y0)||!E0(st.y1)?N(st.y0)-N(st.y1):N(st.invYen),usv=N(st.sv0)-N(st.sv1),uhb=N(st.hb0)-N(st.hb1),net=N(st.out)-usv-uhb,any=[st.invYen,st.y0,st.y1,st.sv0,st.sv1,st.hb0,st.hb1,st.out].some(x=>x!==''&&x!=null);

 const diff=!any||lent==null?null:net-lent;
 const yen=!any?null:(net!==0&&rate==null)?null:net*(rate||0)-iy;
 return{any,lend,ex,rate,lent,diff,yen,usv,uhb,iy}}
function migrate(st){if(!st)return st;if('unit' in st||'inv' in st){if(st.unit==='円'){st.invYen=st.invYen??st.inv??'';st.retYen=st.retYen??st.ret??''}else{st.invMai=st.invMai??st.inv??'';st.retMai=st.retMai??st.ret??''}delete st.unit;delete st.inv;delete st.ret}

 // 旧：最初の所持メダル/残った持ちメダル/回収枚数 → 新：所持メダル使用前/使用後/回収
 const E=x=>x===''||x==null;if(E(st.hb0)&&E(st.hb1)&&E(st.out)&&(!E(st.invMai)||!E(st.retMai)||!E(st.retOut))){st.hb0=st.invMai;if(!E(st.retOut)){st.out=st.retOut;st.hb1=''}else{st.hb1=st.retMai;st.out=''}st.invMai='';st.retMai='';st.retOut=''}
 for(const f of['sv0','sv1','hb0','hb1','out','y0','y1','tL'])if(st[f]==null)st[f]='';
 // r16：現金投資合計→サンド投入現金（残り空欄＝投入そのままなので結果は同じ）
 if(!E(st.invYen)&&E(st.y0)&&E(st.y1)){st.y0=st.invYen;st.invYen=''}
 const c={};for(const k in st.checks||{}){const n=st.checks[k]===true?1:+st.checks[k]||0;if(n)c[k]=n}st.checks=c;st.v=st.v||{};return st}
function genId(){let r;if(typeof crypto!=='undefined'&&crypto.randomUUID)r=crypto.randomUUID();else if(typeof crypto!=='undefined'&&crypto.getRandomValues){const b=crypto.getRandomValues(new Uint8Array(16));r=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}else r=Array.from({length:4},()=>Math.random().toString(36).slice(2,10)).join('');return Date.now().toString(36)+'-'+r}

function canon(mid,st){const n=x=>x===''||x==null?'':String(+x===+x&&String(x).trim()!==''?+x:String(x).trim());
 const v={};Object.keys(st.v||{}).sort().forEach(k=>{if(+st.v[k])v[k]=+st.v[k]});
 const c={};Object.keys(st.checks||{}).sort().forEach(k=>{if(+st.checks[k])c[k]=+st.checks[k]});
 return JSON.stringify([mid,n(st.date),n(st.store),n(st.memo),n(st.start),n(st.total),st.gmode||'all',n(st.invYen)+'|'+n(st.y0)+'|'+n(st.y1),n(st.invMai),n(st.retMai),n(st.retYen),v,c].concat(n(st.tstart)||n(st.ttotal)||n(st.retOut)?[n(st.tstart),n(st.ttotal)]:[]).concat(n(st.retOut)?[n(st.retOut)]:[]).concat([st.sv0,st.sv1,st.hb0,st.hb1,st.out].some(x=>n(x)!=='')?[[n(st.sv0),n(st.sv1),n(st.hb0),n(st.hb1),n(st.out)]]:[]))}
function fingerprint(mid,st){const s=canon(mid,st);let h1=0x811c9dc5,h2=0x01000193^s.length;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^c,2246822519)^(h2>>>13)}return(h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')}

function cardIdx(col,name){const nm=name.replace(/霧島/g,'霧嶋').replace(/滝沢/g,'滝澤').replace(/齋/g,'斎').replace(/和泉/g,'泉').replace(/鋼太郎/g,'鋼太朗').replace(/\s/g,'');

 let h=c.filter(x=>x[0]===nm);if(!h.length)h=c.filter(x=>x[0].includes(nm)||nm.includes(x[0]));if(h.length>1&&new Set(h.map(x=>x[1])).size===1)h=[h[0]];return h.length===1?h[0]:null}
function cardParse(t){let s=String(t).replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248)).replace(/[：]/g,':').replace(/[、，]/g,',').replace(/[×xX＊*]/g,'').replace(/　/g,' ').trim();const err=[],add={},det=[];if(!s)return{err:['空です']};
 const re=/(白|青|赤|銅|銀|金|虹)\s*:/g;let ms=[...s.matchAll(re)];if(!ms.length)return{err:['「青:」のような色の指定がありません']};if(s.slice(0,ms[0].index).trim())err.push('読めない：「'+s.slice(0,ms[0].index).trim()+'」');

function dedupeRaw(raw,now){const live=raw.filter(x=>!x.deleted),keep=new Set(dedupeLive(live));return raw.map(x=>x.deleted||keep.has(x)?x:{id:x.id,deleted:true,updatedAt:now})}
function storeKey(x){return 'n:'+String(x.name||'').trim()}
function entryKey(x){return x.id}
function strip(x){const{updatedAt,...r}=x;return JSON.stringify(r)}
// 旧リスト(tombstone含む)と新しい表示リストから、変更分にupdatedAtを付け、消えた物をtombstone化
function applyChanges(raw,next,key,now){const old=new Map(raw.map(x=>[key(x),x])),out=[],seen=new Set();
 for(const x of next){const k=key(x);seen.add(k);const o=old.get(k);if(o&&!o.deleted&&strip(o)===strip({...x,deleted:undefined}))out.push(o);else{const y={...x,updatedAt:now};delete y.deleted;if(!y.id)y.id=(o&&o.id)||genId();out.push(y)}}
 for(const[k,o]of old)if(!seen.has(k))out.push(o.deleted?o:{id:o.id,name:o.name,deleted:true,updatedAt:now});return out}
function mergeList(a,b,key){const m=new Map();for(const x of[...(a||[]),...(b||[])]){const k=key(x);const o=m.get(k);if(!o||String(x.updatedAt||'')>String(o.updatedAt||''))m.set(k,x)}return[...m.values()]}
function mergeData(l,r){r=r||{};const ent=mergeList(l.entries,r.entries,entryKey).sort((x,y)=>String(y.saved||y.updatedAt||'').localeCompare(String(x.saved||x.updatedAt||'')));
 return{version:1,stores:mergeList(l.stores,r.stores,storeKey),entries:ent,updatedAt:new Date().toISOString()}}
function sameData(a,b){const n=d=>JSON.stringify({s:[...(d.stores||[])].sort((x,y)=>storeKey(x)<storeKey(y)?-1:1),e:[...(d.entries||[])].sort((x,y)=>x.id<y.id?-1:1)});return n(a)===n(b||{})}
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b64){const s=atob(b64.replace(/\s/g,''));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b)}
// ===== CSV（UI外：nodeでテスト可） =====
function csvCols(ext){const c=[];for(const[k,m]of Object.entries(M)){if(!!m.ext!==!!ext)continue;for(const e of m.els){if(e.t==='rate')c.push([k,'v',e.k,m.name+':'+e.l]);else if(e.t==='pct'){c.push([k,'v',e.k+'_n',m.name+':'+e.l+'(母数)']);c.push([k,'v',e.k+'_k',m.name+':'+e.l+'(当選)'])}else e.c.forEach((x,j)=>c.push([k,'v',e.k+'_'+j,m.name+':'+e.l+' '+x]))}
 m.hints.forEach((g,gi)=>g[1].forEach((x,hi)=>c.push([k,'c',gi+'_'+hi,m.name+':示唆 '+g[0].replace(/（.*）/,'')+' '+x[0]+'('+x[1]+')'])))}return c}
const q=x=>{x=String(x??'');return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
function buildCSV(list){const base=csvCols(false),xc=csvCols(true),cols=base,sc=[];for(const[k,m]of Object.entries(M))for(const e of m.els)if(e.sk)sc.push([k,'v',e.k+'_s',m.name+':打ち始め'+e.l]);for(const[k,m]of Object.entries(M))if(m.at)for(const[x,l]of[['xbig','BIG'],['xbig_s','打ち始めBIG'],['xreg','REG'],['xreg_s','打ち始めREG']])sc.push([k,'v',x,m.name+':'+l+'(記録)']);const head=['id','fingerprint','日付','店舗','機種','台番号/メモ','打ち始めG','総回転数','自分G','計算G数','計算G方式',...cols.map(c=>c[3]),'投資(円)','投資(枚)','回収(枚)','回収(円)','貸出枚数/1000円','換金額(円/枚)','合算差枚','合算収支(円)','期待設定','設定4以上%',...S.map(s=>'設定'+s+'%'),'示唆','保存日時',...xc.map(c=>c[3]),...sc.map(c=>c[3]),'打ち始め総回転数','総回転数(AT込)','交換枚数/100円','貸出枚','換金単価(円/枚)','最初の所持メダル','残った持ちメダル','開始時刻','終了時刻','打った時間(h)','時給(円)','機械割%','回収枚数','貯メダル数使用前','貯メダル使用後','所持メダル使用前','所持メダル使用後','回収'];
 const lines=[head.map(q).join(',')];for(const e of list){const s=e.st;const r1=x=>x==null?'':Math.round(x*10)/10;
  lines.push([e.id,e.fp||fingerprint(e.mid,s),e.date,e.store,e.machine,e.memo,s.start,s.total,s.total!==''?Math.max(0,(+s.total||0)-(+s.start||0)):'',e.G,'自分の分だけ',
   ...cols.map(c=>c[0]!==e.mid?'':c[1]==='v'?(s.v[c[2]]??''):(s.checks[c[2]]||0)),s.invYen,s.invMai,s.retMai,s.retYen,e.lend??'',e.rate??'',r1(e.diff),r1(e.yen),
   e.avg!=null?e.avg.toFixed(2):'',e.hi!=null?(e.hi*100).toFixed(1):'',...S.map((x,i)=>e.p?(e.p[i]*100).toFixed(1):''),e.hints,e.saved||'',...[...xc,...sc].map(c=>c[0]!==e.mid?'':c[1]==='v'?(s.v[c[2]]??''):(s.checks[c[2]]||0)),s.tstart??'',s.ttotal??'',e.ex??'',r1(e.lent),e.rate!=null?Math.round(e.rate*1000)/1000:'',s.invMai??'',s.retMai??'',e.tS??'',e.tE??'',e.hours!=null?Math.round(e.hours*100)/100:'',e.hours>0&&e.yen!=null?Math.round(e.yen/e.hours):'',e.payout!=null?Math.round(e.payout*10)/10:'',s.retOut??'',s.sv0??'',s.sv1??'',s.hb0??'',s.hb1??'',s.out??''].map(q).join(','))}
 return '\ufeff'+lines.join('\r\n')}
if(typeof module!=='undefined')Object.assign(module.exports,{dedupeRaw,dedupeLive,buildCSV,applyChanges,mergeList,mergeData,sameData,b64enc,b64dec,storeKey,entryKey});
