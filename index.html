const S=[1,2,3,4,5,6];
// ===== 計算 =====
function lb(k,n,p){return n>0&&k>=0&&k<=n?k*Math.log(p)+(n-k)*Math.log(1-p):0}
function likelihood(m,v,G){return S.map((s,i)=>{let l=0;for(const e of m.els){
 if(e.t==='rate')l+=lb(v[e.k]||0,G,1/e.d[i]);
 else if(e.t==='pct')l+=lb(v[e.k+'_k']||0,v[e.k+'_n']||0,e.p[i]/100);
 else{const tot=e.p[i].reduce((a,b)=>a+b,0);e.c.forEach((c,j)=>{const x=v[e.k+'_'+j]||0;if(x)l+=x*Math.log(e.p[i][j]/tot)})}}return l})}
function allowed(m,checks){let a=new Set(S),notes=[];m.hints.forEach((g,gi)=>g[1].forEach((h,hi)=>{const n=+checks[gi+'_'+hi]||0;if(n>0){if(h[2])a=new Set([...a].filter(s=>h[2].includes(s)));else notes.push(h[0]+'：'+h[1]+'×'+n)}}));return{a,notes}}
function post(m,v,G,checks){const L=likelihood(m,v,G),{a,notes}=allowed(m,checks||{});
 if(!a.size)return{p:null,notes};const mx=Math.max(...L.filter((x,i)=>a.has(S[i])));
 const w=L.map((x,i)=>a.has(S[i])?Math.exp(x-mx):0),z=w.reduce((x,y)=>x+y);return{p:w.map(x=>x/z),notes}}
function useG(st){const tot=+st.total||0,start=+st.start||0;return st.gmode==='mine'?Math.max(0,tot-start):tot}
function summary(m,st){const r=post(m,st.v,useG(st),st.checks);if(!r.p)return{p:null,avg:null,hi:null,notes:r.notes};
 const avg=r.p.reduce((a,x,i)=>a+x*S[i],0);return{p:r.p,avg,hi:r.p[3]+r.p[4]+r.p[5],notes:r.notes}}

function money(st,stores){const N=x=>x===''||x==null?0:+x||0;const s=(stores||[]).find(x=>x.name===(st.store||'').trim())||null;
 const lend=s&&+s.lend>0?+s.lend:null,rate=s&&+s.rate>0?+s.rate:null;
 const iy=N(st.invYen),im=N(st.invMai),rm=N(st.retMai),ry=N(st.retYen),any=[st.invYen,st.invMai,st.retMai,st.retYen].some(x=>x!==''&&x!=null);
 const diff=!any?null:(iy>0&&lend==null)?null:rm-im-(iy>0?iy/1000*lend:0);
 const yen=!any?null:((im>0||rm>0)&&rate==null)?null:rm*(rate||0)+ry-iy-im*(rate||0);
 return{any,lend,rate,diff,yen}}
function migrate(st){if(!st)return st;if('unit' in st||'inv' in st){if(st.unit==='円'){st.invYen=st.invYen??st.inv??'';st.retYen=st.retYen??st.ret??''}else{st.invMai=st.invMai??st.inv??'';st.retMai=st.retMai??st.ret??''}delete st.unit;delete st.inv;delete st.ret}
 for(const f of['invYen','invMai','retMai','retYen'])if(st[f]==null)st[f]='';
 const c={};for(const k in st.checks||{}){const n=st.checks[k]===true?1:+st.checks[k]||0;if(n)c[k]=n}st.checks=c;st.v=st.v||{};return st}
function genId(){let r;if(typeof crypto!=='undefined'&&crypto.randomUUID)r=crypto.randomUUID();else if(typeof crypto!=='undefined'&&crypto.getRandomValues){const b=crypto.getRandomValues(new Uint8Array(16));r=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}else r=Array.from({length:4},()=>Math.random().toString(36).slice(2,10)).join('');return Date.now().toString(36)+'-'+r}
if(typeof module!=='undefined')module.exports={M,post,summary,useG,money,migrate,genId};
// ===== 内容フィンガープリント（id・保存時刻を除く全記録項目） =====
function canon(mid,st){const n=x=>x===''||x==null?'':String(+x===+x&&String(x).trim()!==''?+x:String(x).trim());
 const v={};Object.keys(st.v||{}).sort().forEach(k=>{if(+st.v[k])v[k]=+st.v[k]});
 const c={};Object.keys(st.checks||{}).sort().forEach(k=>{if(+st.checks[k])c[k]=+st.checks[k]});
 return JSON.stringify([mid,n(st.date),n(st.store),n(st.memo),n(st.start),n(st.total),st.gmode||'all',n(st.invYen),n(st.invMai),n(st.retMai),n(st.retYen),v,c])}
function fingerprint(mid,st){const s=canon(mid,st);let h1=0x811c9dc5,h2=0x01000193^s.length;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^c,2246822519)^(h2>>>13)}return(h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')}
if(typeof module!=='undefined')Object.assign(module.exports,{fingerprint,canon});

const $=id=>document.getElementById(id),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

function home(){$('mach').classList.add('hidden');$('home').classList.remove('hidden');

window.saveStore=()=>{const name=$('s_name').value.trim(),lend=+$('s_lend').value,rate=+$('s_rate').value;if(!name||!(lend>0)||!(rate>0)){alert('店舗名・貸出枚数・換金額を入力してね');return}
 const s=stores().filter(x=>x.name!==name);s.push({name,lend,rate});LS.set('v2_stores',s);['s_name','s_lend','s_rate','s_ex'].forEach(k=>$(k).value='');renderStores()};
window.editStore=i=>{const x=stores()[i];$('s_name').value=x.name;$('s_lend').value=x.lend;$('s_rate').value=x.rate;$('s_name').scrollIntoView({block:'center'})};
window.delStore=i=>{const s=stores();if(!confirm(`「${s[i].name}」を削除しますか？`))return;s.splice(i,1);LS.set('v2_stores',s);renderStores()};
function inp(id,val,type='number',extra=''){return`<input id="${id}" type="${type}" ${type==='number'?'min="0" inputmode="numeric"':''} value="${esc(val)}" ${extra}>`}
function step(id,val,w=56){return`<span style="display:inline-flex;gap:4px;align-items:center"><button class="sub sm" style="width:38px;height:38px" onclick="bump('${id}',-1)">−</button><input id="${id}" type="number" min="0" inputmode="numeric" value="${esc(val)}" style="width:${w}px;text-align:center"><button class="sub sm" style="width:38px;height:38px" onclick="bump('${id}',1)">＋</button></span>`}
window.bump=(id,d)=>{const x=$(id);x.value=Math.max(0,(parseInt(x.value)||0)+d);x.dispatchEvent(new Event('input'))};
function machine(k){mid=k;const m=M[k];st=migrate(Object.assign(blank(),LS.get('v2_cur_'+k,{})));st.v=st.v||{};
 $('home').classList.add('hidden');const el=$('mach');el.classList.remove('hidden');
 let h=`<button class="sub sm" onclick="location.hash=''">← 機種選択</button><h1 style="margin-top:10px">${esc(m.name)}</h1>
 <div class="card"><h2>台情報</h2>
 <div class="row"><label>店舗名</label>${inp('f_store',st.store,'text','list="dl_store"')}<datalist id="dl_store">${stores().map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist></div>
 <div class="row"><label>台番号/メモ</label>${inp('f_memo',st.memo,'text')}</div>
 <div class="row"><label>保存日付</label>${inp('f_date',st.date,'date')}</div>
 <div class="row"><label>打ち始め回転数</label>${inp('f_start',st.start)}</div>
 <div class="row"><label>総回転数<small>データ表示の通常時ゲーム数</small></label>${inp('f_total',st.total)}</div>
 <div class="row"><label>自分が回したG</label><b id="mine">-</b></div>
 <div class="row"><label>計算に使うG数<small>回数入力が履歴全体なら「全体」、自分の分だけなら「自分」</small></label><div class="seg" style="flex:1"><button id="gm_all" onclick="setG('all')">履歴全体</button><button id="gm_mine" onclick="setG('mine')">自分の分だけ</button></div></div></div>
 <div class="card"><h2>収支</h2>
 <div class="row"><label>投資（円）</label>${inp('f_invYen',st.invYen)}</div>
 <div class="row"><label>投資（枚）<small>貯枚再プレー等</small></label>${inp('f_invMai',st.invMai)}</div>
 <div class="row"><label>回収（枚）</label>${inp('f_retMai',st.retMai)}</div>
 <div class="row"><label>回収（円）<small>任意</small></label>${inp('f_retYen',st.retYen)}</div>
 <div id="money" class="note"></div></div>
 <div class="card"><h2>カウント</h2>`;
 for(const e of m.els){if(e.t==='rate')h+=`<div class="row"><label>${esc(e.l)} 回数${e.s?`<small>${esc(e.s)}</small>`:''}</label>${step('v_'+e.k,st.v[e.k]??'')}</div>`;
  else if(e.t==='pct')h+=`<div class="row"><label>${esc(e.l)}<small>${esc(e.s)}</small></label></div><div class="row"><label style="text-align:right">母数</label>${step('v_'+e.k+'_n',st.v[e.k+'_n']??'',48)}<label style="text-align:right">当選</label>${step('v_'+e.k+'_k',st.v[e.k+'_k']??'',48)}</div>`;
  else{h+=`<div class="row"><label>${esc(e.l)}<small>${esc(e.s)}</small></label></div>`;e.c.forEach((c,j)=>{h+=`<div class="row"><label style="padding-left:12px">${c}</label>${step('v_'+e.k+'_'+j,st.v[e.k+'_'+j]??'')}</div>`})}}
 h+=`</div><div class="card"><h2>設定示唆（出現回数）</h2><p class="note">「濃厚・否定」系は1回以上で該当しない設定を0%にします。奇偶・高設定示唆は回数を記録するだけ（計算に入れない）。</p>`;
 m.hints.forEach((g,gi)=>{h+=`<p style="margin:12px 0 4px;font-weight:bold;font-size:.9em">${esc(g[0])}</p>`;g[1].forEach((x,hi)=>{h+=`<div class="row"><label>${esc(x[0])} <span class="tag">${esc(x[1])}</span>${x[2]?'':' <span class="note">(注記)</span>'}</label>${step('c_'+gi+'_'+hi,st.checks[gi+'_'+hi]||'',44)}</div>`})});
 h+=`</div><div class="card res"><h2>結果</h2><div id="out"></div></div>
 <div class="card"><h2>確率表と実測</h2><p class="note">オレンジ＝実測値に最も近い設定</p><div class="tw" id="tbl"></div></div>
 <div class="card"><h2>この台を保存</h2><button onclick="saveH()">この台を保存</button><button class="sub" onclick="resetM()">リセット</button><div id="hist" style="margin-top:10px"></div></div>
 <div class="card"><h2>注意・出典</h2><p class="note">※各要素を独立とみなして掛け合わせる簡易計算です（例：初当たりにはCZ・ボーナス経由分が含まれるなど重複があるため、結果はやや強めに出ます）。事前確率は各設定均等。</p>
 ${m.notes.map(n=>`<p class="note">・${esc(n)}</p>`).join('')}<p class="note">出典：<br>${m.src.map(u=>`<a href="${u}" target="_blank">${u}</a>`).join('<br>')}</p></div>`;
 el.innerHTML=h;
 el.querySelectorAll('input').forEach(x=>{x.addEventListener('input',read);x.addEventListener('change',read)});
 update();renderH();banner();scrollTo(0,0)}
function read(){for(const f of['store','memo','date','start','total','invYen','invMai','retMai','retYen'])st[f]=$('f_'+f).value;
 const v={};document.querySelectorAll('[id^="v_"]').forEach(x=>{if(x.value!=='')v[x.id.slice(2)]=Math.max(0,parseInt(x.value)||0)});st.v=v;
 const c={};document.querySelectorAll('[id^="c_"]').forEach(x=>{const n=Math.max(0,parseInt(x.value)||0);if(n)c[x.id.slice(2)]=n});st.checks=c;
 LS.set('v2_cur_'+mid,st);update()}
window.setG=g=>{st.gmode=g;LS.set('v2_cur_'+mid,st);update()};
const r1=x=>Math.round(x*10)/10,sg=x=>(x>0?'+':'')+Math.round(x).toLocaleString();
function update(){const m=M[mid],G=useG(st),tot=+st.total||0,start=+st.start||0;
 $('mine').textContent=st.total!==''?Math.max(0,tot-start)+'G':'-';
 $('gm_all').className=st.gmode==='all'?'':'sub';$('gm_mine').className=st.gmode==='mine'?'':'sub';
 const mo=money(st,stores());
 $('money').innerHTML=!mo.any?'金額を入力すると収支を計算します':`<div class="row"><label>合算差枚</label><b>${mo.diff==null?'店舗レート未設定':sg(mo.diff)+'枚'}</b></div><div class="row"><label>最終合算収支</label><b>${mo.yen==null?'店舗レート未設定':sg(mo.yen)+'円'}</b></div>${mo.lend?`<small>貸出${mo.lend}枚/1000円・換金${mo.rate}円/枚</small>`:'<small>店舗設定（トップ画面）に店舗名を登録すると計算できます</small>'}`;
 const sm=summary(m,st);let o='';
 if(!sm.p)o=`<div class="warn">入力した示唆が矛盾していて、残る設定がありません。回数を見直してね。</div>`;
 else{o=`<p class="note">計算G数：${G}G（${st.gmode==='mine'?'自分の分だけ':'履歴全体'}）</p>`+sm.p.map((x,i)=>`<div class="row"><label style="flex:0 0 52px">設定${S[i]}</label><div class="bar"><div style="width:${(x*100).toFixed(1)}%"></div></div><span>${(x*100).toFixed(1)}%</span></div>`).join('')+
  `<p><b>期待設定：${sm.avg.toFixed(2)}</b>　設定4以上：${(sm.hi*100).toFixed(1)}%</p>`}
 if(sm.notes.length)o+=`<p class="note">示唆メモ：${sm.notes.map(esc).join(' / ')}</p>`;$('out').innerHTML=o;
 const rows=[];const near=(arr,val)=>{if(val==null||!isFinite(val))return-1;let b=0;arr.forEach((x,i)=>{if(Math.abs(x-val)<Math.abs(arr[b]-val))b=i});return b};
 for(const e of m.els){if(e.t==='rate'){const c=st.v[e.k]||0,me=c&&G?G/c:null;rows.push([e.l,e.d.map(x=>'1/'+x),me?'1/'+r1(me):'-',near(e.d,me)])}
  else if(e.t==='pct'){const n=st.v[e.k+'_n']||0,k=st.v[e.k+'_k']||0,me=n?k/n*100:null;rows.push([e.l,e.p.map(x=>x+'%'),me!=null?r1(me)+'%':'-',near(e.p,me)])}
  else{const cs=e.c.map((c,j)=>st.v[e.k+'_'+j]||0),t=cs.reduce((a,b)=>a+b,0);e.c.forEach((c,j)=>{const col=e.p.map(r=>r[j]),me=t?cs[j]/t*100:null;rows.push([e.l+' '+c,col.map(x=>x+'%'),me!=null?r1(me)+'%':'-',near(col,me)])})}}
 const pm=(G>0&&mo.diff!=null)?(3*G+mo.diff)/(3*G)*100:null;
 rows.push(['機械割',m.payout.map(x=>x+'%'),pm!=null?r1(pm)+'%':'-',near(m.payout,pm)]);
 $('tbl').innerHTML=`<table><tr><th>項目</th>${S.map(s=>`<th>設${s}</th>`).join('')}<th>実測</th></tr>${rows.map(r=>`<tr><td style="text-align:left">${esc(r[0])}</td>${r[1].map((x,i)=>`<td class="${i===r[3]?'hit':''}">${x}</td>`).join('')}<td class="me">${r[2]}</td></tr>`).join('')}</table>
 <p class="note">機械割の実測は（投入3枚×計算G数＋合算差枚）÷投入の概算（合算差枚が出るときのみ）。</p>`}
function hintText(m,ch){const t=[];m.hints.forEach((g,gi)=>g[1].forEach((x,hi)=>{const n=+ch[gi+'_'+hi]||0;if(n)t.push(x[0]+'('+x[1]+')×'+n)}));return t.join(' / ')}
window.saveH=()=>{read();const m=M[mid],sm=summary(m,st),fp=fingerprint(mid,st);const h=hist();
 if(h.some(e=>e.fp===fp)&&!confirm('同じ内容のデータがあります。保存しますか？'))return;
 const mo=money(st,stores());
 h.unshift({id:genId(),mid,machine:m.name,store:st.store,memo:st.memo,date:st.date,saved:new Date().toISOString(),fp,
  st:JSON.parse(JSON.stringify(st)),G:useG(st),lend:mo.lend,rate:mo.rate,diff:mo.diff,yen:mo.yen,p:sm.p,avg:sm.avg,hi:sm.hi,hints:hintText(m,st.checks),exported:false});putHist(h);renderH();banner();alert('保存しました')};
function renderH(){const h=hist().filter(e=>e.mid===mid);$('hist').innerHTML=h.length?h.map(e=>`<div class="row" style="border-bottom:1px solid #eee;padding-bottom:6px"><label><b>${esc(e.store||'店舗未入力')} ${esc(e.memo||'')}</b><small>${esc(e.date)} ${e.G}G ${e.avg!=null?'期待設定'+e.avg.toFixed(2)+' / 4以上'+(e.hi*100).toFixed(1)+'%':'矛盾あり'}${e.yen!=null?' / '+sg(e.yen)+'円':''}${e.exported?' ・書出済':''}</small></label><button class="sub sm" onclick="loadH('${e.id}')">読込</button><button class="sub sm" onclick="delH('${e.id}')">削除</button></div>`).join(''):'<p class="note">この機種の保存データはありません</p>'}
window.loadH=id=>{const e=hist().find(x=>x.id===id);if(!e)return;LS.set('v2_cur_'+mid,migrate(JSON.parse(JSON.stringify(e.st))));machine(mid)};
window.delH=id=>{if(!confirm('この保存データを削除しますか？'))return;putHist(hist().filter(x=>x.id!==id));renderH();banner()};
window.resetM=()=>{if(!confirm('この機種の入力内容をすべて消去しますか？（保存済みデータは残ります）'))return;LS.del('v2_cur_'+mid);machine(mid)};
window.exportCSV=async all=>{const h=hist(),list=all?h:h.filter(e=>!e.exported);if(!list.length){alert('書き出すデータがありません');return}
 const name=`slot_settei_${today()}.csv`,blob=new Blob([buildCSV(list)],{type:'text/csv'});let ok=false;
 try{const f=new File([blob],name,{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});ok=true}}catch(e){if(e&&e.name==='AbortError')return}
 if(!ok){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
 const ids=new Set(list.map(e=>e.id));putHist(h.map(e=>ids.has(e.id)?{...e,exported:true}:e));banner();if(mid&&!$('mach').classList.contains('hidden'))renderH();else home()};
function route(){const m=location.hash.match(/m=(\w+)/);if(m&&M[m[1]])machine(m[1]);else{mid=null;home()}}
addEventListener('hashchange',route);route()}
// ===== CSV（UI外：nodeでテスト可） =====
function csvCols(){const c=[];for(const[k,m]of Object.entries(M)){for(const e of m.els){if(e.t==='rate')c.push([k,'v',e.k,m.name+':'+e.l]);else if(e.t==='pct'){c.push([k,'v',e.k+'_n',m.name+':'+e.l+'(母数)']);c.push([k,'v',e.k+'_k',m.name+':'+e.l+'(当選)'])}else e.c.forEach((x,j)=>c.push([k,'v',e.k+'_'+j,m.name+':'+e.l+' '+x]))}
 m.hints.forEach((g,gi)=>g[1].forEach((x,hi)=>c.push([k,'c',gi+'_'+hi,m.name+':示唆 '+g[0].replace(/（.*）/,'')+' '+x[0]+'('+x[1]+')'])))}return c}
const q=x=>{x=String(x??'');return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
function buildCSV(list){const cols=csvCols();const head=['id','fingerprint','日付','店舗','機種','台番号/メモ','打ち始めG','総回転数','自分G','計算G数','計算G方式',...cols.map(c=>c[3]),'投資(円)','投資(枚)','回収(枚)','回収(円)','貸出枚数/1000円','換金額(円/枚)','合算差枚','合算収支(円)','期待設定','設定4以上%',...S.map(s=>'設定'+s+'%'),'示唆','保存日時'];
 const lines=[head.map(q).join(',')];for(const e of list){const s=e.st;const r1=x=>x==null?'':Math.round(x*10)/10;
  lines.push([e.id,e.fp||fingerprint(e.mid,s),e.date,e.store,e.machine,e.memo,s.start,s.total,s.total!==''?Math.max(0,(+s.total||0)-(+s.start||0)):'',e.G,s.gmode==='mine'?'自分の分だけ':'履歴全体',
   ...cols.map(c=>c[0]!==e.mid?'':c[1]==='v'?(s.v[c[2]]??''):(s.checks[c[2]]||0)),s.invYen,s.invMai,s.retMai,s.retYen,e.lend??'',e.rate??'',r1(e.diff),r1(e.yen),
   e.avg!=null?e.avg.toFixed(2):'',e.hi!=null?(e.hi*100).toFixed(1):'',...S.map((x,i)=>e.p?(e.p[i]*100).toFixed(1):''),e.hints,e.saved||''].map(q).join(','))}
 return '\ufeff'+lines.join('\r\n')}
if(typeof module!=='undefined')Object.assign(module.exports,{buildCSV});
</script></body></html>
