<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f4fd8">
<link rel="apple-touch-icon" href="icon.png?v=1">
<link rel="icon" href="icon.png?v=1">
<link rel="manifest" href="manifest.json?v=1">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f4f7fc;color:#14213d;font-size:15px;-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#1f4fd8,#2b6cf0);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:18px;font-weight:800}
#st{font-size:12px;color:#fff;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px}
main{max-width:480px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid #e3e9f5;border-radius:16px;box-shadow:0 2px 10px rgba(31,79,216,.06);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:800;color:#14213d;display:flex;justify-content:space-between;align-items:center}
.big{font-size:38px;font-weight:900;letter-spacing:-.5px;color:#14213d}
.big small{font-size:18px;font-weight:800}
.up{color:#1f4fd8;font-weight:800}.dn,.neg{color:#e0283a!important}
.pos{color:#14213d}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eef2f9}
.row:last-child{border-bottom:0}
.row b{font-weight:800}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#f0f5ff;border-radius:14px;padding:10px 12px}
.tile .l{font-size:12px;font-weight:700;color:#1f4fd8}
.tile .v{font-size:19px;font-weight:900;margin-top:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid #cdd9f3;background:#fff;color:#1f4fd8;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.pill.on{background:#1f4fd8;color:#fff;border-color:#1f4fd8}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3e9f5;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;font-weight:700;color:#7b8bb0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:#1f4fd8}
nav svg{width:24px;height:24px}
input,select{font:inherit;border:1px solid #cdd9f3;border-radius:10px;padding:7px 9px;background:#fff;color:#14213d;width:100%}
input.num{text-align:right}
.btn{border:0;background:#1f4fd8;color:#fff;font-weight:800;border-radius:12px;padding:10px 14px;font-size:15px}
.btn.sub{background:#eaf0fd;color:#1f4fd8}
.btn.del{background:#fde8ea;color:#e0283a}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:#1f4fd8;color:#fff;font-weight:700;padding:5px 4px;white-space:nowrap;position:sticky;top:0}
td{padding:5px 4px;border-bottom:1px solid #eef2f9;text-align:right;white-space:nowrap}
td.l{text-align:left}
tr.sum td{font-weight:800;background:#f0f5ff}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
.bar{position:relative}
.bar i{position:absolute;left:0;top:3px;bottom:3px;background:#d7e3fd;border-radius:3px;z-index:0}
.bar i.n{background:#fbd5d9}
.bar span{position:relative;z-index:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;font-weight:700;color:#1f4fd8}
.cal .d{min-height:58px;border-radius:10px;background:#f6f8fd;padding:3px;font-size:11px;text-align:center;border:1px solid transparent}
.cal .d.today{border-color:#1f4fd8}
.cal .d .n{font-weight:800;font-size:13px}
.cal .d .t{border-radius:6px;color:#fff;font-weight:800;padding:1px 0;margin-top:2px}
.t-stand{background:#1f4fd8}.t-kado{background:#f08c00}.t-off{background:#2fb36b}.t-other{background:#7a5af8}.t-free{background:#0f9fb5}.t-standkado{background:linear-gradient(90deg,#1f4fd8 50%,#f08c00 50%)}
.cal .d .y{font-weight:800;font-size:10px}
.sheet{position:fixed;inset:0;background:rgba(10,20,50,.35);z-index:20;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.chip{border:2px solid #cdd9f3;background:#fff;border-radius:14px;padding:14px 0;font-size:17px;font-weight:800;color:#14213d}
.chip.on{color:#fff;border-color:transparent}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.f label{font-size:12px;font-weight:700;color:#1f4fd8}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh b{font-size:17px}
.mh button{border:0;background:#eaf0fd;color:#1f4fd8;font-weight:800;border-radius:10px;width:40px;height:34px;font-size:18px}
textarea{width:100%;min-height:110px;font:12px monospace;border:1px solid #cdd9f3;border-radius:10px;padding:8px}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800;color:#fff}
.i1-生活費{background:#1f9bd8}.i1-収入{background:#2fb36b}.i1-ギャンブル{background:#e0283a}
.hide{display:none}
.mh .mpick,.mpick{width:auto;height:auto;white-space:nowrap;flex:0 1 auto;background:none;border:0;font:inherit;font-size:18px;font-weight:800;color:#14213d;padding:8px 12px;border-radius:10px;min-height:44px}.mpick:active{background:#eef3ff}.gl{border-left:2px solid #9fb3dc!important}th.gl{border-left:2px solid #fff!important}</style></head><body>
<header><h1>生活管理ツール</h1><span id="st">読み込み中</span></header>
<main id="main"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const API='https://api.github.com/repos/pokoden/slot-data/contents/';
const PATH='seikatsu/seikatsu.json';
const tok=()=>LS.get('v2_token','')||'';
const yen=n=>{n=Math.round(+n||0);return (n<0?'-':'')+'¥'+Math.abs(n).toLocaleString()};
const cls=n=>(+n<0?'neg':'');
const Y=n=>`<span class="${cls(n)}">${yen(n)}</span>`;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const TODAY=new Date();const TD=ymd(TODAY);const CUR=ymOf(TODAY);
const addM=(ym,k)=>{let[y,m]=ym.split('-').map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)};
const ymLabel=ym=>{const[y,m]=ym.split('-');return y+'/'+(+m)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const I1=['生活費','収入','ギャンブル'];
const I2=['生活固定費','生活変動費','税金','給料収入','雑収入','貯金','競馬','カジノ','パチスロ','調整'];
const I2of1={'生活固定費':'生活費','生活変動費':'生活費','税金':'生活費','貯金':'生活費','調整':'生活費','給料収入':'収入','雑収入':'収入','競馬':'ギャンブル','カジノ':'ギャンブル','パチスロ':'ギャンブル'};
const TYPES={stand:'スタンド',kado:'稼働',standkado:'スタンド+稼働',off:'休み',other:'その他労働'};const TL={...TYPES,free:'予定'};const isS=t=>t==='stand'||t==='standkado',isK=t=>t==='kado'||t==='standkado';
function defData(){return{v:2,wallet:{cash:0,pachi:0,bank:0,small:0,big:0,save:0,car:0},sched:{},ledger:{},fixedDone:{},plans:[],
 fixed:[['BIGLOBE',6505],['アクサ',13971],['スマホ',14230],['損保',3690],['タバコ',25000],['楽天ネット',1045],['自宅',20000]].map(([n,a])=>({id:uid(),i1:'生活費',i2:'生活固定費',i3:n,exp:a})),
 set:{rate:1100,stdH:9,step:100000,prevEnd:null,fuyo:1290000,fixedFrom:CUR,loan:{items:[['車本体',700000],['タイヤホイール',148000]],n:24,monthly:37100,start:'2026-10'}},updatedAt:''}}
let D=LS.get('sk2_data',null);
let slot={byDate:{}},chodamaYen=null,sha=null,tab=LS.get('sk2_tab','home'),calYM=CUR,monYM=CUR,range=LS.get('sk2_range','1y');
// 旧データ移行
function migrate(old){const d=defData();if(!old)return d;
 const w=d.wallet;w.cash=+old.cash||0;w.pachi=+old.pachi||0;w.bank=+old.bank||0;
 for(const[k,r]of Object.entries(old.schedule||{})){if(!r||!r.type)continue;const t=r.type==='rest'?'off':(TYPES[r.type]?r.type:'other');d.sched[k]={t,h:+r.hours||0,pay:+r.pay||0}}
 for(const[ym,arr]of Object.entries(old.kakei||{}))for(const it of arr||[]){const inc=it.kind==='income';(d.ledger[ym]=d.ledger[ym]||[]).push({id:uid(),i1:inc?'収入':'生活費',i2:inc?'雑収入':'生活変動費',i3:it.name||'',inc:inc?+it.amount||0:0,exp:inc?0:+it.amount||0})}
 d.legacy=old;return d}
if(!D){D=migrate(LS.get('seikatsu_data',null));}
function fill(){const b=defData();for(const k in b)if(D[k]==null)D[k]=b[k];for(const k in b.set)if(D.set[k]==null)D.set[k]=b.set[k];for(const k in b.wallet)if(D.wallet[k]==null)D.wallet[k]=b.wallet[k]}
fill();
// 固定費を毎月自動で入れる
function applyFixed(){let ym=D.set.fixedFrom||CUR,ch=false;while(ym<=CUR){if(!D.fixedDone[ym]){const L=D.ledger[ym]=D.ledger[ym]||[];for(const f of D.fixed)if(!L.some(x=>x.i3===f.i3&&x.i2===f.i2))L.push({id:uid(),i1:f.i1,i2:f.i2,i3:f.i3,inc:+f.inc||0,exp:+f.exp||0,fx:1});D.fixedDone[ym]=1;ch=true}ym=addM(ym,1)}return ch}
// 保存
let saveT=null,saving=false;
function save(){D.updatedAt=new Date().toISOString();LS.set('sk2_data',D);LS.set('sk2_dirty',1);clearTimeout(saveT);saveT=setTimeout(push,1500)}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function ub64(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}
async function gh(path){const r=await fetch(API+path+'?t='+Date.now(),{headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json'},cache:'no-store'});if(r.status===404)return{nf:1};if(!r.ok)throw new Error(r.status);const j=await r.json();let txt=j.content?ub64(j.content):null;if(txt==null&&j.git_url){const g=await fetch(j.git_url,{headers:{Authorization:'Bearer '+tok()}});txt=ub64((await g.json()).content)}return{sha:j.sha,data:JSON.parse(txt)}}
let loaded=false;
async function push(){if(!tok()||!loaded||saving)return;saving=true;st('保存中');try{for(let i=0;i<3;i++){const r=await fetch(API+PATH,{method:'PUT',headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'seikatsu',content:b64(JSON.stringify(D)),...(sha?{sha}:{})})});if(r.status===409||r.status===422){const g=await gh(PATH);sha=g.sha||null;continue}if(!r.ok)throw new Error(r.status);sha=(await r.json()).content.sha;LS.set('sk2_dirty',0);st('保存済み');break}}catch(e){st('保存失敗')}saving=false}
function st(t){$('st').textContent=t}
async function boot(){applyFixed();render();if(!tok()){st('トークン未設定');loaded=false;return}
 try{const g=await gh(PATH);if(g.nf){const o=await gh('seikatsu.json').catch(()=>({nf:1}));if(!o.nf&&!LS.get('sk2_data',null)){D=migrate(o.data);fill()}}else{sha=g.sha;if(!LS.get('sk2_dirty',0)||String(g.data.updatedAt||'')>String(D.updatedAt||'')||(+g.data.importRev||0)>(+D.importRev||0)){D=g.data;fill();LS.set('sk2_data',D);LS.set('sk2_dirty',0)}}loaded=true;if(applyFixed()||LS.get('sk2_dirty',0))save();st('同期済み')}catch(e){st('読み込み失敗');}
 try{const[a,p,c,sd]=await Promise.all(['data.json','pachinko.json','chodama.json','data.json'].map(f=>gh(f).catch(()=>({nf:1}))));
  const by={};for(const s of[a,p]){const es=(s.data&&s.data.entries)||[];for(const e of es){if(!e||e.deleted)continue;const d=e.date||String(e.saved||'').slice(0,10);if(!d||e.yen==null||!isFinite(+e.yen))continue;const o=by[d]=by[d]||{yen:0,h:0};o.yen+=+e.yen;o.h+=+e.hours>0?+e.hours:0}}slot.byDate=by;
  if(c.data&&c.data.ev){const stores=(a.data&&a.data.stores)||[],sm={};for(const s of stores)sm[s.name]=s;let y=0;for(const e of c.data.ev){if(e.deleted||e.t!=='set'||!e.n)continue;const s=sm[e.store]||{};let per=3.57;if(e.k==='s'&&s.ex)per=100/s.ex;else if(e.k==='p'&&s.val)per=s.val;y+=e.n*per}chodamaYen=Math.round(y*0.95)}
  {const lt=LS.get('cd_total_yen',null),rt=c.data&&c.data.total;const b=[lt,rt].filter(x=>x&&isFinite(+x.yen)).sort((p,q)=>String(q.at)<String(p.at)?-1:1)[0];if(b)chodamaYen=Math.round(+b.yen)}
 }catch(e){}render()}
// 集計
function slotMonth(ym){let y=0,h=0,n=0;for(const[d,o]of Object.entries(slot.byDate))if(d.startsWith(ym)){y+=o.yen;h+=o.h;n++}return{y,h,n}}
function dayInfo(d){const r=D.sched[d]||{};const s=slot.byDate[d];const o={...r};if(isK(r.t)||(!r.t&&s)){o.t=o.t||'kado';if(s){o.kh=s.h;o.ky=s.yen}else{o.kh=+r.kh||0;o.ky=+r.ky||0}}return o}
function workMonth(ym){const R={sd:0,sh:0,sp:0,od:0,oh:0,op:0,kd:0,kh:0,ky:0,off:0};const[y,m]=ym.split('-').map(Number);const n=new Date(y,m,0).getDate();for(let i=1;i<=n;i++){const d=ym+'-'+pad(i),o=dayInfo(d);if(isS(o.t)){R.sd++;R.sh+=+o.h||0;R.sp+=+o.pay||0}if(o.t==='other'){R.od++;R.oh+=+o.h||0;R.op+=+o.pay||0}if(isK(o.t)){R.kd++;R.kh+=+o.kh||0;R.ky+=+o.ky||0}if(o.t==='off')R.off++}return R}
function rows(ym){const L=(D.ledger[ym]||[]).slice();const w=workMonth(ym);if(L.some(x=>x.imp))return L;
 if(!L.some(x=>x.i2==='給料収入')&&(w.sp+w.op))L.push({auto:1,i1:'収入',i2:'給料収入',i3:'給料',inc:w.sp+w.op,exp:0});
 if(!L.some(x=>x.i2==='パチスロ')){const s=slotMonth(ym);if(s.n)L.push({auto:1,i1:'ギャンブル',i2:'パチスロ',i3:'パチスロ',inc:s.y>0?s.y:0,exp:s.y<0?-s.y:0})}return L}
function allMonths(){const s=new Set([...Object.keys(D.ledger),CUR]);for(const d of Object.keys(slot.byDate))s.add(d.slice(0,7));for(const d of Object.keys(D.sched))s.add(d.slice(0,7));const a=[...s].filter(x=>/^\d{4}-\d\d$/.test(x)&&x<=CUR).sort();if(!a.length)return[CUR];const out=[];for(let m=a[0];m<=CUR;m=addM(m,1))out.push(m);return out}
function summary(){let cum=0;return allMonths().map(ym=>{const L=rows(ym);const o={ym,inc:0,exp:0,c:{}};for(const x of L){o.inc+=+x.inc||0;o.exp+=+x.exp||0;o.c[x.i2]=(o.c[x.i2]||0)+(+x.inc||0)-(+x.exp||0)}o.net=o.inc-o.exp;cum+=o.net;o.cum=cum;o.save40=o.net>0?Math.round(o.net*.4):0;return o})}
function loanInfo(){const L=D.set.loan,total=L.monthly*L.n;let paid=0;if(L.start<=CUR){let m=L.start;while(m<=CUR){paid++;m=addM(m,1)}}paid=Math.min(paid,L.n);return{total,paid,left:L.n-paid,rem:total-paid*L.monthly}}
// 描画
const ICON={list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',money:'<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'};
const NAV=[['home','ホーム'],['cal','予定'],['money','お金'],['list','一覧'],['set','設定']];
function render(){$('nav').innerHTML=NAV.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${l}</button>`).join('');
 $('main').innerHTML=({home:vHome,cal:vCal,money:vMoney,list:vList,set:vSet}[tab]||vHome)()}
function go(k){tab=k;LS.set('sk2_tab',k);render();scrollTo(0,0)}
function spark(vals,w=90,h=28){if(vals.length<2)return'';const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;const p=vals.map((v,i)=>(i*w/(vals.length-1)).toFixed(1)+','+(h-2-(v-mn)/r*(h-4)).toFixed(1)).join(' ');const up=vals[vals.length-1]>=vals[0];return`<svg width="${w}" height="${h}"><polyline points="${p}" fill="none" stroke="${up?'#1f4fd8':'#e0283a'}" stroke-width="2"/></svg>`}
function lineChart(pts){const W=440,H=210,P=78;if(pts.length<2)return'<div style="height:60px"></div>';const vs=pts.map(p=>p[1]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn-=1;mx+=1}const x=i=>P+i*(W-P-8)/(pts.length-1),y=v=>H-22-(v-mn)/(mx-mn)*(H-36);
 let g='';{const raw=(mx-mn)/4,e=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(f=>f*e).find(f=>f>=raw);const lo=Math.floor(mn/st)*st,hi=Math.ceil(mx/st)*st;mn=lo;mx=hi;for(let v=lo;v<=hi+st/2;v+=st){const c=v<0?'#e0283a':'#1f4fd8';g+=`<line x1="${P}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#9fb3dc':'#eef2f9'}"/><text x="${P-6}" y="${y(v)+4}" font-size="12" font-weight="700" text-anchor="end" fill="${c}">${Math.round(v).toLocaleString()}</text>`}}
 const step=Math.max(1,Math.ceil(pts.length/5));pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)g+=`<text x="${x(i)}" y="${H-6}" font-size="10" text-anchor="middle" fill="#14213d">${p[0]}</text>`});

 <div class="card"><h2>合計</h2><table><tr><th></th><th>件数</th><th>収入</th><th>支出</th><th>収支</th></tr><tr><td class="l">絞り込み</td><td>${f.length}</td><td>${yen(T.i)}</td><td>${yen(T.e)}</td><td>${Y(T.i-T.e)}</td></tr><tr><td class="l">全部</td><td>${all.length}</td><td>${yen(A.i)}</td><td>${yen(A.e)}</td><td>${Y(A.i-A.e)}</td></tr></table></div>
 <div class="card"><div class="scroll"><table><tr><th>年月</th><th>項目1</th><th>項目2</th><th>項目3</th><th>収入</th><th>支出</th><th>収支</th></tr>${f.slice().reverse().map(x=>`<tr><td>${x.ym.replace('-','/')}</td><td class="l">${esc(x.i1)}</td><td class="l">${esc(x.i2)}</td><td class="l">${esc(x.i3)}</td><td>${x.inc?yen(x.inc):''}</td><td>${x.exp?yen(x.exp):''}</td><td>${Y((+x.inc||0)-(+x.exp||0))}</td></tr>`).join('')}</table></div></div>`}
function closeSheet(){$('sheet').classList.remove('on')}
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
// お金
function vMoney(){const L=rows(monYM);const ri=(D.ledger[monYM]||[]);let inc=0,exp=0;L.forEach(x=>{inc+=+x.inc||0;exp+=+x.exp||0});
 const sel=(a,v,on)=>`<select onchange="${on}">${a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
 const lines=L.map(x=>{const i=ri.indexOf(x);if(x.auto)return`<tr><td class="l"><span class="tag i1-${x.i1}">${x.i1}</span></td><td class="l">${x.i2}</td><td class="l">${esc(x.i3)}</td><td>${x.inc?yen(x.inc):''}</td><td>${x.exp?yen(x.exp):''}</td><td></td></tr>`;
  return`<tr><td class="l"><span class="tag i1-${x.i1}">${x.i1}</span></td><td class="l">${sel(I2,x.i2,`ed(${i},'i2',this.value)`)}</td><td class="l"><input value="${esc(x.i3)}" style="width:90px" onchange="ed(${i},'i3',this.value)"></td><td><input class="num" style="width:78px" inputmode="numeric" value="${x.inc||''}" onchange="ed(${i},'inc',this.value)"></td><td><input class="num" style="width:78px" inputmode="numeric" value="${x.exp||''}" onchange="ed(${i},'exp',this.value)"></td><td><button class="btn del" style="padding:4px 8px" onclick="D.ledger[monYM].splice(${i},1);save();render()">×</button></td></tr>`}).join('');
 const S=summary();const yS=S.filter(o=>o.ym.slice(0,4)===monYM.slice(0,4));
 const cats=(()=>{const b=['給料収入','雑収入','生活固定費','生活変動費','税金','貯金','パチスロ','競馬','カジノ','調整'],u=new Set();S.forEach(o=>Object.keys(o.c).forEach(k=>u.add(k)));return[...b.filter(k=>u.has(k)),...[...u].filter(k=>!b.includes(k))]})();
 const cm=(rows(monYM).reduce((a,x)=>{a[x.i2]=(a[x.i2]||0)+(+x.inc||0)-(+x.exp||0);return a},{}));const cmx=Math.max(1,...Object.values(cm).map(Math.abs));
 const st=S.map(o=>`<tr><td>${ymLabel(o.ym)}</td><td>${yen(o.inc)}</td><td>${yen(o.exp)}</td><td>${Y(o.net)}</td><td>${Y(o.cum)}</td>${cats.map(c=>`<td>${o.c[c]?Y(o.c[c]):''}</td>`).join('')}<td>${o.save40?yen(o.save40):''}</td></tr>`).reverse().join('');
 return`<div class="card"><div class="mh"><button onclick="monYM=addM(monYM,-1);render()">‹</button><button class="mpick" onclick="openMP('mon')">${ymLabel(monYM)} ▾</button><button onclick="monYM=addM(monYM,1);render()">›</button></div>
 <div class="tiles"><div class="tile"><div class="l">収入</div><div class="v">${yen(inc)}</div></div><div class="tile"><div class="l">出費</div><div class="v">${yen(exp)}</div></div><div class="tile"><div class="l">収支</div><div class="v ${cls(inc-exp)}">${yen(inc-exp)}</div></div><div class="tile"><div class="l">累計収支</div><div class="v ${cls((S.find(o=>o.ym===monYM)||{}).cum)}">${yen((S.find(o=>o.ym===monYM)||{}).cum||0)}</div></div></div></div>
 <div class="card"><h2>明細</h2><div class="pills" style="margin-bottom:8px">${I2.filter(c=>c!=='パチスロ').map(c=>`<button class="pill" onclick="addRow('${c}')">${c}</button>`).join('')}</div><div class="scroll"><table><tr><th>項目1</th><th>項目2</th><th>項目3</th><th>収入</th><th>支出</th><th></th></tr>${lines}</table></div></div>
 <div class="card"><h2>分類</h2>${Object.entries(cm).sort((a,b)=>a[1]-b[1]).map(([k,v])=>`<div class="row bar" style="display:block"><i class="${v<0?'n':''}" style="width:${Math.abs(v)/cmx*100}%"></i><span style="display:flex;justify-content:space-between"><span>${k}</span><b class="${cls(v)}">${yen(v)}</b></span></div>`).join('')}</div>
 <div class="card"><h2>月の集計</h2><div class="scroll"><table><tr><th>年月</th><th>収入</th><th>出費</th><th>収支</th><th>累計収支</th>${cats.map(c=>`<th>${c.replace('収入','')}</th>`).join('')}<th>40%貯金</th></tr>${st}</table></div></div>
 <div class="card"><h2>明細の取り込み</h2><textarea id="imp" placeholder="年月	項目1	項目2	項目3	収入	支出"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" onclick="doImport()">取り込む</button></div><div id="impRes" style="margin-top:6px;font-weight:700"></div></div>`}
function ed(i,k,v){const x=D.ledger[monYM][i];if(k==='inc'||k==='exp')v=+String(v).replace(/[^\d-]/g,'')||0;x[k]=v;if(k==='i2')x.i1=I2of1[v]||x.i1;save();render()}
function addRow(c){(D.ledger[monYM]=D.ledger[monYM]||[]).push({id:uid(),i1:I2of1[c],i2:c,i3:'',inc:0,exp:0});save();render()}
function parseYM(s){s=String(s).trim().replace(/^"|"$/g,'');let m=s.match(/(\d{4})\s*[\/\-年.]\s*(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2]);return null}
const num=s=>{s=String(s??'').replace(/[¥￥,，"\s円]/g,'');if(s===''||s==='-')return 0;const v=+s;return isFinite(v)?v:0};
function doImport(){const txt=$('imp').value;const lines=txt.split(/\r?\n/).filter(l=>l.trim());let col={ym:0,i1:1,i2:2,i3:3,inc:4,exp:5};const out={};let ok=0,bad=0;
 for(const l of lines){const c=l.includes('\t')?l.split('\t'):l.trim().split(/[\s\u3000\u00a0]+/);
  if(c.some(x=>/項目1/.test(x))){c.forEach((x,i)=>{x=x.trim();if(/年月|日付/.test(x))col.ym=i;if(x==='項目1')col.i1=i;if(x==='項目2')col.i2=i;if(x==='項目3')col.i3=i;if(x==='収入')col.inc=i;if(/^(支出|出費)$/.test(x))col.exp=i});continue}
  const ym=parseYM(c[col.ym]);if(!ym){bad++;continue}let i2=(c[col.i2]||'').trim(),i1=(c[col.i1]||'').trim();if(!I1.includes(i1))i1=I2of1[i2]||'生活費';
  (out[ym]=out[ym]||[]).push({id:uid(),i1,i2:i2||'調整',i3:(c[col.i3]||'').trim(),inc:Math.abs(num(c[col.inc])),exp:Math.abs(num(c[col.exp])),imp:1});ok++}
 for(const[ym,a]of Object.entries(out)){D.ledger[ym]=a;D.fixedDone[ym]=1}
 const ms=Object.keys(out).sort();if(ms.length&&ms[0]<(D.set.fixedFrom||CUR)){}
 save();$('impRes').textContent=ok+'件 取り込み'+(bad?' / '+bad+'行 読めず':'')+(ms.length?'（'+ymLabel(ms[0])+'〜'+ymLabel(ms[ms.length-1])+'）':'');setTimeout(render,1200)}
// 設定
function vSet(){const s=D.set,F=fuyoInfo();
 const inp=(v,on,w)=>`<input class="num" inputmode="numeric" style="width:${w||130}px" value="${v??''}" onchange="${on}">`;
 return`<div class="card"><h2>トークン</h2><input type="password" value="${tok()?'********':''}" placeholder="github_pat_..." onchange="if(this.value&&!/^\\*+$/.test(this.value)){LS.set('v2_token',this.value.trim());boot()}"><div style="margin-top:6px;font-weight:700">${tok()?'設定済み':'未設定'}</div></div>
 <div class="card"><h2>固定費<button class="btn sub" style="padding:5px 10px;font-size:13px" onclick="D.fixed.push({id:uid(),i1:'生活費',i2:'生活固定費',i3:'',exp:0});save();render()">＋</button></h2>
 <table>${D.fixed.map((f,i)=>`<tr><td class="l"><input value="${esc(f.i3)}" onchange="D.fixed[${i}].i3=this.value;save()"></td><td>${inp(f.exp,`D.fixed[${i}].exp=+this.value||0;save()`,100)}</td><td><button class="btn del" style="padding:4px 8px" onclick="D.fixed.splice(${i},1);save();render()">×</button></td></tr>`).join('')}</table></div>
 <div class="card"><h2>給料</h2>
 <div class="row"><span>スタンド時給</span>${inp(s.rate,"D.set.rate=+this.value||0;save()")}</div>
 <div class="row"><span>スタンド標準時間</span>${inp(s.stdH,"D.set.stdH=+this.value||0;save()")}</div>
 ${fuyoBlock(F)}</div>
 <div class="card"><h2>目標</h2>
 <div class="row"><span>前年最終残高</span>${inp(s.prevEnd,"D.set.prevEnd=this.value===''?null:+this.value;save()")}</div>
 <div class="row"><span>毎月の目標増額</span>${inp(s.step,"D.set.step=+this.value||0;save()")}</div>
</div>
`}
boot();
</script></body></html>
