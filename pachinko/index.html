// ===== 同期用の純粋関数（nodeでテスト可） =====
// 同じ記録（recId、無ければid）の重複は最新(saved)の1件だけ残す。残りは削除扱い(tombstone)にして同期でも復活させない（何度実行しても同じ結果）
function recKey(e){return(e.st&&e.st.recId)||e.id}
function dedupeLive(list){const best=new Map();for(const e of list){const k=recKey(e),o=best.get(k);if(!o||String(e.saved||'')>String(o.saved||''))best.set(k,e)}return list.filter(e=>best.get(recKey(e))===e)}
function dedupeRaw(raw,now){const live=raw.filter(x=>!x.deleted),keep=new Set(dedupeLive(live));return raw.map(x=>x.deleted||keep.has(x)?x:{id:x.id,deleted:true,updatedAt:now})}
function storeKey(x){return 'n:'+String(x.name||'').trim()}
function entryKey(x){return x.id}
function strip(x){const{updatedAt,...r}=x;return JSON.stringify(r)}
// 旧リスト(tombstone含む)と新しい表示リストから、変更分にupdatedAtを付け、消えた物をtombstone化
function applyChanges(raw,next,key,now){const old=new Map(raw.map(x=>[key(x),x])),out=[],seen=new Set();
 for(const x of next){const k=key(x);seen.add(k);const o=old.get(k);if(o&&!o.deleted&&strip(o)===strip({...x,deleted:undefined}))out.push(o);else{const y={...x,updatedAt:now};delete y.deleted;if(!y.id)y.id=(o&&o.id)||genId();out.push(y)}}
 for(const[k,o]of old)if(!seen.has(k))out.push(o.deleted?o:{id:o.id,name:o.name,deleted:true,updatedAt:now});return out}
function mergeList(a,b,key){const m=new Map();for(const x of[...(a||[]),...(b||[])]){const k=key(x);const o=m.get(k);if(!o||String(x.updatedAt||'')>String(o.updatedAt||''))m.set(k,x)}return[...m.values()]}
function mergeData(l,r){r=r||{};const ent=mergeList(l.entries,r.entries,entryKey).sort((x,y)=>String(y.saved||y.updatedAt||'').localeCompare(String(x.saved||x.updatedAt||'')));
 return{version:1,stores:mergeList(l.stores,r.stores,storeKey),entries:ent,updatedAt:new Date().toISOString()}}
