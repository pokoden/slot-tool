<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f2f4f8;margin:0;padding:12px;color:#222;max-width:640px;margin:auto}
h1{font-size:1.25em;margin:4px 0 12px}h2{font-size:1.05em;margin:0 0 10px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.row{display:flex;align-items:center;justify-content:space-between;margin:8px 0;gap:8px}
.row label{flex:1;font-size:.92em}.row small,.note{color:#777;font-size:.78em}.row small{display:block}
input,select{width:96px;padding:8px;font-size:1em;border:1px solid #ccd;border-radius:8px;text-align:right;background:#fff}
input[type=text],input[type=date]{width:160px;text-align:left}

.mbtn{text-align:left;background:#fff;color:#222;border:2px solid #2b6fe8;font-size:1.05em}

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.76em;white-space:nowrap}td,th{border:1px solid #dde;padding:4px;text-align:center}th{background:#eef2fa}
td.hit{background:#ff9f2e;color:#fff;font-weight:bold}td.me{background:#fff7e6;font-weight:bold}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:.9em}.chk input{width:22px;height:22px;flex:none}
.tag{font-size:.72em;padding:1px 6px;border-radius:6px;background:#eef2fa;color:#2b6fe8;margin-left:4px}

.pt{font-size:.8em}.pt input{width:64px;padding:6px 4px;font-size:16px;text-align:right}.pt td,.pt th{padding:3px}.pt th{font-size:.85em;white-space:normal;min-width:56px}
.pt td.c{font-weight:bold;min-width:56px}.pt .bd{background:#f6f8fc}.pt button.sm{width:30px;height:32px;padding:0}.pt th.g{background:#fff3d6}

</style></head><body>
<div id="banner" class="banner hidden"></div>
<div id="home"></div>
<div id="mach" class="hidden"></div>
<script>
// ===== 機種データ（出典：pachinko-spec.info の残保留あり条件） =====
// 追加するときはこの配列に1行足すだけ。R は小さい順。初当たり＝TS（低ベース時の大当り確率分母）
const MACHINES=[
 {id:'umi5',name:'P大海物語5',sub:'三洋物産 / ハイミドル・MTE2',intro:'2023年2月6日',first:319.7,total:9.24,r1:140,R:[10],
  src:'https://pachinko-spec.info/spec/103492/'}
];
const M={};MACHINES.forEach(m=>{m.R=[...m.R].sort((a,b)=>a-b);M[m.id]=m});
const RENT=4,EXC=3.57,BALLK=250,SANDB=125,ROWS=20,ROWS0=10;
const P_=m=>m.r1/m.total;
const defRatio=m=>m.first>=350?50:m.first>=290?60:m.first>=190?70:80;
const borders=(m,r)=>{const P=P_(m),u=P*EXC;return{cash:1000/u,ball:BALLK/P,ratio:(1000*(1-r)+BALLK*EXC*r)/u}};
const N=x=>x===''||x==null?null:(isFinite(+x)?+x:null);
// 1行の計算（空欄は無視、0は0として扱う）
function rowCalc(m,w){const s0=N(w.s0),s1=N(w.s1),b0=N(w.b0)??s0,b1=N(w.b1)??s1;
 const spins=b0!=null&&b1!=null&&b1>=b0?b1-b0:null;
 const y0=N(w.y0),y1=N(w.y1),m0=N(w.m0),m1=N(w.m1);
 const c0=N(w.c0),c1=N(w.c1);
 // 現金：サンド投入合計 − 現在サンド表示。玉：サンド玉回数があればそれ×125玉、なければ持ち玉の差
 const yen=y0!=null||y1!=null?(y0??0)-(y1??0):0,balls=c0!=null||c1!=null?((c0??0)-(c1??0))*SANDB:(m0!=null||m1!=null?(m0??0)-(m1??0):0);
 const k=Math.max(0,yen)/1000+Math.max(0,balls)/BALLK;
 const rate=spins!=null&&k>0?spins/k:null;
 let cs=null,bs=null;if(spins!=null&&k>0){cs=spins*(Math.max(0,yen)/1000)/k;bs=spins-cs}
 const hits={};let anyHit=false;for(const R of m.R){const v=N((w.r||{})[R]);if(v!=null){hits[R]=v;anyHit=true}}
 return{spins,yen:Math.max(0,yen),balls:Math.max(0,balls),k,rate,cs,bs,hits,anyHit,neg:(yen<0||balls<0)}}
function calc(m,st){const P=P_(m),r=(N(st.ratio)??defRatio(m))/100,B=borders(m,r);
 const rows=(st.rows||[]).map(w=>rowCalc(m,w||{}));let sp=0,yen=0,balls=0,cs=0,bs=0,k=0;const hits={};m.R.forEach(R=>hits[R]=0);
 for(const x of rows){if(x.spins!=null&&x.k>0){sp+=x.spins;yen+=x.yen;balls+=x.balls;cs+=x.cs;bs+=x.bs;k+=x.k}for(const R in x.hits)hits[R]+=x.hits[R]}
 const rate=k>0?sp/k:null;
 const work=k>0?cs*P*EXC-yen+(bs*P-balls)*EXC:null;
 const exp=rate?{cash:sp*P*EXC-sp/rate*1000,ball:sp*P*EXC-sp/rate*BALLK*EXC,ratio:sp*P*EXC-sp/rate*(1000*(1-r)+BALLK*EXC*r)}:null;
 // 収支：現金投資・最初/最後の持ち玉（空欄なら表から自動）
 const filled=(st.rows||[]).filter(w=>w&&Object.values(w).some(v=>v!==''&&v!=null&&typeof v!=='object'));
 const autoInv=yen,autoB0=filled.length?N(filled[0].m0):null,autoB1=filled.length?N(filled[filled.length-1].m1):null;
 const inv=N(st.inv)??autoInv,b0=N(st.bStart)??autoB0??0,b1=N(st.bOut)??N(st.bEnd)??autoB1;
 const any=[st.inv,st.bEnd,st.bOut].some(x=>N(x)!=null)||k>0;
 const pl=any?((b1??0)-b0)*EXC-inv:null;
 const rounds=m.R.reduce((a,R)=>a+R*(hits[R]||0),0),firsts=rows.filter(x=>x.anyHit&&Object.values(x.hits).some(v=>v>0)).length,expR=sp/m.total*1;
 return{rounds,firsts,expR,P,r,B,rows,sp,yen,balls,cs,bs,k,rate,work,exp,hits,inv,autoInv,autoB0,autoB1,b0,b1,pl}}
function hm2min(t){const x=String(t||'').match(/^(\d{1,2}):(\d{2})/);return x?+x[1]*60+ +x[2]:null}
function hours(a,b){const x=hm2min(a),y=hm2min(b);if(x==null||y==null)return null;let d=y-x;if(d<0)d+=1440;return d/60}
function genId(){let r;if(typeof crypto!=='undefined'&&crypto.randomUUID)r=crypto.randomUUID();else r=Array.from({length:4},()=>Math.random().toString(36).slice(2,10)).join('');return Date.now().toString(36)+'-'+r}
function fingerprint(mid,st){const c={...st};delete c.tS;delete c.tE;delete c.tEman;const s=JSON.stringify([mid,c]);let h1=0x811c9dc5,h2=0x01000193^s.length;for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,16777619);h2=Math.imul(h2^ch,2246822519)^(h2>>>13)}return(h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')}
if(typeof module!=='undefined')module.exports={M,MACHINES,P_,borders,defRatio,rowCalc,calc,hours};
// ===== UI =====
if(typeof document!=='undefined'){
const $=id=>document.getElementById(id),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`},nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const blankRow=()=>({s0:'',s1:'',b0:'',b1:'',m0:'',m1:'',y0:'',y1:'',c0:'',c1:'',r:{}});
const blank=()=>({store:'',memo:'',date:today(),ratio:'',inv:'',bStart:'',bEnd:'',bOut:'',tS:'',tE:'',tEman:false,rows:Array.from({length:ROWS},blankRow)});
let mid=null,st=null,more=false;
const TOK='v2_token';// スロット版と同じ鍵を共有
const rawStores=()=>LS.get('p1_stores',[]),rawHist=()=>LS.get('p1_hist',[]);
const stores=()=>rawStores().filter(x=>!x.deleted),hist=()=>rawHist().filter(x=>!x.deleted);
const putStores=s=>{LS.set('p1_stores',applyChanges(rawStores(),s,storeKey,new Date().toISOString()));syncSoon()};
const putHist=h=>{LS.set('p1_hist',applyChanges(rawHist(),h,entryKey,new Date().toISOString()));syncSoon()};
const DEF_STORES=['柏マル','柏USA','五所ジャム','石渡マル','五所マル'];
function seedStores(list){const have=new Set((list||[]).map(storeKey));const add=DEF_STORES.filter(n=>!have.has('n:'+n)).map(name=>({id:'def-'+name,name,updatedAt:'2000-01-01T00:00:00.000Z'}));return add.length?[...(list||[]),...add]:list}
(function(){const sd=seedStores(rawStores());if(sd!==rawStores())LS.set('p1_stores',sd)})();
const pc=x=>x>0?' style="color:#1e5bd6"':x<0?' style="color:#d62828"':'',sg=x=>(x>0?'+':'')+Math.round(x).toLocaleString(),f2=x=>x==null||!isFinite(x)?'-':x.toFixed(2),sg2=x=>x==null||!isFinite(x)?'-':(x>0?'+':'')+x.toFixed(2);
function banner(){const n=hist().filter(e=>!e.exported).length;$('banner').classList.toggle('hidden',!n);$('banner').innerHTML=`未書き出し <b>${n}</b> 件 <button class="sm" onclick="exportCSV(false)">書き出し</button>`}
function thumb(k,w){const m=M[k];return m?`<img src="img/${k}.jpg" alt="" width="${w}" style="width:${w}px;height:auto;border-radius:6px;flex:0 0 ${w}px" onerror="this.outerHTML='<span style=&quot;display:inline-block;width:${w}px;padding:6px 0;border-radius:6px;background:#2b6fe8;color:#fff;font-size:11px;text-align:center&quot;>${esc(m.name.slice(0,6))}</span>'">`:''}
const eLine=e=>`${esc(e.date||'')} ${esc(e.store||'店舗未入力')}${e.memo?' 台'+esc(e.memo):''} ${(e.G??0).toLocaleString()}回転${e.rate!=null?' 回転率'+f2(e.rate):''}<br>仕事量 ${e.work!=null?`<span${pc(e.work)}>${sg(e.work)}円</span>`:'-'} / 収支 ${e.yen!=null?`<span${pc(e.yen)}>${sg(e.yen)}円</span>`:'-'}${e.hours?` / ${e.hours.toFixed(1)}h`:''}${e.exported?' ・書出済':''}`;
function histPage(){mid=null;$('mach').classList.add('hidden');const el=$('home');el.classList.remove('hidden');
 const h=hist().slice().sort((a,b)=>String(b.saved||'').localeCompare(String(a.saved||'')));
 el.innerHTML=`<button class="sub sm" onclick="location.hash=''">← 機種選択</button><h1 style="margin-top:10px">全機種の履歴</h1><div class="card"><p class="note">${h.length}件・タップで読み込み（同期データ含む）</p>`+(h.length?h.map(e=>`<div class="row" style="border-bottom:1px solid #eee;padding:6px 0;gap:8px">${thumb(e.mid,36)}<label style="cursor:pointer;flex:1" onclick="loadAll('${e.id}')"><b>${esc((M[e.mid]||{}).name||e.machine||'')}</b><small>${eLine(e)}</small></label><button class="sub sm" onclick="delAll('${e.id}')">削除</button></div>`).join(''):'<p class="note">保存データはありません</p>')+`</div>`;banner();scrollTo(0,0)}
window.loadAll=id=>{const e=hist().find(x=>x.id===id);if(!e||!M[e.mid])return;LS.set('p1_cur_'+e.mid,JSON.parse(JSON.stringify(e.st)));location.hash='m='+e.mid};
window.delAll=id=>{if(!confirm('この保存データを削除しますか？'))return;putHist(hist().filter(x=>x.id!==id));histPage()};
// ===== 分析 =====
const AN_MET=[['yen','収支(円)'],['work','仕事量(円)'],['rate','回転率'],['wh','時給(仕事量)'],['n','打った回数'],['G','総回転数'],['win','勝率']];
const anS=()=>Object.assign({met:'yen',dir:'good',store:'',mach:'',hmet:'yen'},LS.get('p1_an',{}));
let anMore=new Set(),anIds=[];
function dParts(e){const m=String(e.date||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];return{y,mo,d,w:new Date(y,mo-1,d).getDay()}}
const DIMS={store:{l:'店舗',f:e=>String(e.store||'').trim()||'店舗未入力'},mach:{l:'機種',f:e=>M[e.mid]?e.mid:null,show:k=>M[k].name},
 tail:{l:'末尾',f:e=>{const p=dParts(e);return p?String(p.d%10):null},show:k=>k+'のつく日'},day:{l:'日',f:e=>{const p=dParts(e);return p?String(p.d).padStart(2,'0'):null},show:k=>(+k)+'日'},
 dow:{l:'曜日',f:e=>{const p=dParts(e);return p?String(p.w):null},show:k=>'日月火水木金土'[k]+'曜'},mon:{l:'月',f:e=>{const p=dParts(e);return p?String(p.mo).padStart(2,'0'):null},show:k=>(+k)+'月'},
 zoro:{l:'ゾロ目',f:e=>{const p=dParts(e);return p&&p.mo===p.d?'z':null},show:()=>'ゾロ目日'}};
function anStats(list){const s={n:list.length,G:0,yen:null,work:null,rate:null,wh:null,win:null,ids:list.map(e=>e.id)};let wn=0,ww=0,kk=0,hh=0,wk=0;
 for(const e of list){s.G+=+e.G||0;if(e.yen!=null){s.yen=(s.yen||0)+e.yen;wn++;if(e.yen>0)ww++}if(e.work!=null)s.work=(s.work||0)+e.work;if(e.k>0)kk+=e.k;if(e.hours>0&&e.work!=null){hh+=e.hours;wk+=e.work}}
 const gk=list.reduce((a,e)=>a+(e.k>0?+e.G||0:0),0);s.rate=kk?gk/kk:null;s.wh=hh?wk/hh:null;s.win=wn?ww/wn:null;return s}
function anGroup(list,dims){const g=new Map();for(const e of list){const ks=dims.map(d=>DIMS[d].f(e));if(ks.some(k=>k==null))continue;const key=ks.join('\u0001');if(!g.has(key))g.set(key,{dims,ks,list:[]});g.get(key).list.push(e)}
 return[...g.values()].map(x=>({...x,label:x.ks.map((k,i)=>DIMS[dims[i]].show?DIMS[dims[i]].show(k):k).join('×'),mid:dims.includes('mach')?x.ks[dims.indexOf('mach')]:null,s:anStats(x.list)}))}
function anSort(rows,met,dir){const v=r=>r.s[met];return rows.sort((a,b)=>{const x=v(a),y=v(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return dir==='good'?y-x:x-y})}
const fmtP=x=>x==null?'-':(x*100).toFixed(1)+'%';
function anTable(id,title,rows,o){const S=anS();anSort(rows,S.met,S.dir);const all=anMore.has(id),show=all?rows:rows.slice(0,10);
 return`<div class="card"><h2>${esc(title)} <small class="note">${rows.length}件</small></h2>${rows.length?`<div class="tw"><table><tr><th>#</th><th style="text-align:left">${esc(o&&o.head||'項目')}</th><th>回数</th><th>総回転</th><th>回転率</th><th>仕事量</th><th>収支</th><th>時給</th><th>勝率</th></tr>${show.map((r,i)=>{let a='';if(r.mid){anIds.push({mid:r.mid,ids:r.s.ids,label:r.label});a=` onclick="anDetail(${anIds.length-1})" style="cursor:pointer;color:#2b6fe8;text-decoration:underline"`}
  return`<tr><td>${i+1}</td><td style="text-align:left"${a}>${r.mid?thumb(r.mid,16)+' ':''}${esc(r.label)}</td><td>${r.s.n}</td><td>${r.s.G.toLocaleString()}</td><td>${f2(r.s.rate)}</td><td${pc(r.s.work)}>${r.s.work==null?'-':sg(r.s.work)}</td><td${pc(r.s.yen)}>${r.s.yen==null?'-':sg(r.s.yen)}</td><td${pc(r.s.wh)}>${r.s.wh==null?'-':sg(r.s.wh)}</td><td>${fmtP(r.s.win)}</td></tr>`}).join('')}</table></div>${rows.length>10?`<button class="sub sm" onclick="anToggle('${id}')">${all?'閉じる':'もっと見る（全'+rows.length+'件）'}</button>`:''}`:'<p class="note">データなし</p>'}</div>`}
window.anToggle=id=>{anMore.has(id)?anMore.delete(id):anMore.add(id);const y=scrollY;anPage();scrollTo(0,y)};
window.anSet=(k,v)=>{const S=anS();S[k]=v;LS.set('p1_an',S);const y=scrollY;anPage();scrollTo(0,y)};
function anCtl(h){const S=anS();const mets=h?AN_MET.filter(x=>!['n','win'].includes(x[0])):AN_MET,cur=h?S.hmet:S.met;
 return`<div class="card" style="position:sticky;top:0;z-index:5"><div class="row"><label>並び順</label><select style="flex:1;font-size:16px" onchange="anSet('${h?'hmet':'met'}',this.value)">${mets.map(([k,l])=>`<option value="${k}"${k===cur?' selected':''}>${l}</option>`).join('')}</select><select style="font-size:16px" onchange="anSet('dir',this.value)"><option value="good"${S.dir==='good'?' selected':''}>良い順</option><option value="bad"${S.dir==='bad'?' selected':''}>悪い順</option></select></div></div>`}
function anFilter(kind){const S=anS(),ss=[...new Set(hist().map(e=>String(e.store||'').trim()||'店舗未入力'))].sort();let h='';
 if(kind.includes('s'))h+=`<div class="row"><label>店舗</label><select style="flex:1;font-size:16px" onchange="anSet('store',this.value)"><option value="">全店舗</option>${ss.map(x=>`<option${x===S.store?' selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
 if(kind.includes('m'))h+=`<div class="row"><label>機種</label><select style="flex:1;font-size:16px" onchange="anSet('mach',this.value)"><option value="">全機種</option>${MACHINES.map(m=>`<option value="${m.id}"${m.id===S.mach?' selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`;
 return h?`<div class="card">${h}</div>`:''}
function anData(){const S=anS();return hist().filter(e=>(!S.store||(String(e.store||'').trim()||'店舗未入力')===S.store))}
const back=(to,l)=>`<button class="sub sm" onclick="location.hash='${to}'">← ${l}</button>`;
function anPage(){mid=null;anIds=[];$('mach').classList.add('hidden');const el=$('home');el.classList.remove('hidden');const p=location.hash.slice(4),S=anS();let h='',data;
 const T=(dims,t,id)=>anTable(id||dims.join('_'),t,anGroup(data,dims),{head:dims.map(d=>DIMS[d].l).join('×')});

async function ghGet(tok){const r=await fetch(SYNC_URL+'?t='+Date.now(),{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},cache:'no-store'});
 if(r.status===404)return{sha:null,data:{version:1,stores:[],entries:[]}};if(!r.ok)throw new Error('取得失敗 '+r.status+(r.status===401?'（トークンが無効）':r.status===403?'（権限不足）':''));
 const j=await r.json();return{sha:j.sha,data:JSON.parse(b64dec(j.content||''))}}
async function ghPut(tok,data,sha){const body={message:'pachinko sync '+new Date().toISOString(),content:b64enc(JSON.stringify(data))};if(sha)body.sha=sha;
 return fetch(SYNC_URL,{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)})}
window.syncNow=async manual=>{const tok=LS.get(TOK,'');if(!tok){if(manual)syncStatus();return}
 if(syncing){again=true;return}syncing=true;syncStatus('同期中…');
 try{if(navigator.onLine===false)throw new Error('オフライン（あとで自動で同期します）');
  for(let i=0;i<4;i++){const rm=await ghGet(tok);const mg=mergeData({stores:rawStores(),entries:rawHist()},rm.data);
   LS.set('p1_stores',seedStores(mg.stores));LS.set('p1_hist',mg.entries);
   if(!sameData(mg,rm.data)){const r=await ghPut(tok,mg,rm.sha);if(r.status===409||r.status===422){if(i<3)continue;throw new Error('競合が続いたため中断')}if(!r.ok)throw new Error('保存失敗 '+r.status)}
   const d=new Date();syncStatus(`最終同期：${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`);refreshView();break}
 }catch(e){syncStatus('エラー：'+(e.message||e))}finally{syncing=false;if(again){again=false;syncSoon()}}};

 const sph=c.sp/h,K=[['ratio','比率'],['cash','現金'],['ball','持ち玉']],ev=Object.fromEntries(K.map(([k])=>[k,c.exp[k]/c.sp])),Y=x=>`<span${pc(x)}>${sg(x)}円</span>`;

 const d=b=>c.rate==null?null:c.rate-b;setO('o_dr',sg2(d(c.B.ratio)),d(c.B.ratio));setO('o_dc',sg2(d(c.B.cash)),d(c.B.cash));setO('o_db',sg2(d(c.B.ball)),d(c.B.ball));
 m.R.forEach(R=>setO('o_R'+R,c.hits[R]));

 {const cr=c.k>0?(c.yen/1000)/c.k*100:null,dd=b=>c.rate==null?null:c.rate-b,rw=(l,v,col)=>`<div class="row"><label>${l}</label><b${col==null?'':pc(col)}>${v}</b></div>`,dR=c.rounds-c.expR;

  +rw('ラウンド数合計',`${c.rounds}R（期待 ${c.expR.toFixed(1)}R　<span${pc(dR)}>${c.sp?sg2(dR).replace(/\.(\d)\d$/,'.$1'):'-'}</span>）`)
  +rw('初当たり',c.firsts?`${c.firsts}回　1/${(c.sp/c.firsts).toFixed(1)}`:'0回')+(()=>{const n=m.R.reduce((a,R)=>a+(c.hits[R]||0),0);return rw('合計当たり',n?`${n}回　1/${(c.sp/n).toFixed(1)}`:'0回')})()}
 setO('o_er',c.exp?sg(c.exp.ratio)+'円':'-',c.exp&&c.exp.ratio);setO('o_ec',c.exp?sg(c.exp.cash)+'円':'-',c.exp&&c.exp.cash);setO('o_eb',c.exp?sg(c.exp.ball)+'円':'-',c.exp&&c.exp.ball);
 $('o_detail').textContent=c.k>0?`現金で約${Math.round(c.cs)}回転（${c.yen.toLocaleString()}円）・持ち玉で約${Math.round(c.bs)}回転（${c.balls.toLocaleString()}玉）・持ち玉比率（実際）${(c.bs/(c.sp||1)*100).toFixed(0)}%`:'';
 {const h=st.tS&&st.tE?hours(st.tS,st.tE):null,ok=h>0,yb2=x=>x==null?'-':sg(x)+'円／'+sg(x/EXC)+'玉';$('o_time').textContent=ok?`${st.tS}〜${st.tE}（${h.toFixed(1)}時間）`:st.tS?`${st.tS}〜（保存で終了）`:'-';
  const a=ok&&c.pl!=null?c.pl/h:null,b=ok&&c.work!=null?c.work/h:null;setO('o_plh',yb2(a),a);setO('o_wkh',yb2(b),b)}return c}

// ===== 同期用の純粋関数（nodeでテスト可） =====
function storeKey(x){return 'n:'+String(x.name||'').trim()}
function entryKey(x){return x.id}
function strip(x){const{updatedAt,...r}=x;return JSON.stringify(r)}
// 旧リスト(tombstone含む)と新しい表示リストから、変更分にupdatedAtを付け、消えた物をtombstone化
function applyChanges(raw,next,key,now){const old=new Map(raw.map(x=>[key(x),x])),out=[],seen=new Set();
 for(const x of next){const k=key(x);seen.add(k);const o=old.get(k);if(o&&!o.deleted&&strip(o)===strip({...x,deleted:undefined}))out.push(o);else{const y={...x,updatedAt:now};delete y.deleted;if(!y.id)y.id=(o&&o.id)||genId();out.push(y)}}
 for(const[k,o]of old)if(!seen.has(k))out.push(o.deleted?o:{id:o.id,name:o.name,deleted:true,updatedAt:now});return out}
function mergeList(a,b,key){const m=new Map();for(const x of[...(a||[]),...(b||[])]){const k=key(x);const o=m.get(k);if(!o||String(x.updatedAt||'')>String(o.updatedAt||''))m.set(k,x)}return[...m.values()]}
function mergeData(l,r){r=r||{};const ent=mergeList(l.entries,r.entries,entryKey).sort((x,y)=>String(y.saved||y.updatedAt||'').localeCompare(String(x.saved||x.updatedAt||'')));
 return{version:1,stores:mergeList(l.stores,r.stores,storeKey),entries:ent,updatedAt:new Date().toISOString()}}
function sameData(a,b){const n=d=>JSON.stringify({s:[...(d.stores||[])].sort((x,y)=>storeKey(x)<storeKey(y)?-1:1),e:[...(d.entries||[])].sort((x,y)=>x.id<y.id?-1:1)});return n(a)===n(b||{})}
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b64){const s=atob(b64.replace(/\s/g,''));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b)}
// ===== CSV =====
const q=x=>{x=String(x??'');return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
function buildCSV(list){const Rs=[...new Set(MACHINES.flatMap(m=>m.R))].sort((a,b)=>a-b);const RF=['s0','s1','b0','b1','m0','m1','y0','y1','c0','c1'],RL=['打ち始め回転数','現在の回転数','ボ打ち始め回転数','ボ打ち終わり回転数','打ち始め持ち玉','現在の持ち玉','サンド投入合計現金','現在サンド表示現金','サンド打ち始玉回数','サンド現在玉回数'];const ex2=['回収出玉'];
 const nr=Math.max(0,...list.map(e=>((e.st||{}).rows||[]).reduce((a,w,i)=>w&&Object.entries(w).some(([k,v])=>k==='r'?Object.keys(v||{}).length:v!==''&&v!=null)?i+1:a,0)));
 const r1=x=>x==null?'':Math.round(x*10)/10,r2=x=>x==null?'':Math.round(x*100)/100;
 const head=['id','日付','店舗','機種','台番号/メモ','総回転数','回転率','持ち玉比率%','現金投資(円)','使った持ち玉','収支(円)','仕事量(円)','見込み(比率)','見込み(現金)','見込み(持ち玉)','開始','終了','時間','仕事量時給','収支時給',...Rs.map(R=>R+'R回数'),'保存日時'];
 for(let i=0;i<nr;i++){RL.forEach(l=>head.push((i+1)+'回目:'+l));Rs.forEach(R=>head.push((i+1)+'回目:'+R+'R'))}head.push(...ex2);
 const lines=[head.map(q).join(',')];for(const e of list){const s=e.st||{};const row=[e.id,e.date,e.store,e.machine,e.memo,e.G,r2(e.rate),e.ratio,e.cashYen,e.ballsUsed,r1(e.yen),r1(e.work),e.exp?r1(e.exp.ratio):'',e.exp?r1(e.exp.cash):'',e.exp?r1(e.exp.ball):'',e.tS,e.tE,r2(e.hours),e.hours>0&&e.work!=null?Math.round(e.work/e.hours):'',e.hours>0&&e.yen!=null?Math.round(e.yen/e.hours):'',...Rs.map(R=>(e.hits||{})[R]??''),e.saved||''];
  for(let i=0;i<nr;i++){const w=(s.rows||[])[i]||{};RF.forEach(k=>row.push(w[k]??''));Rs.forEach(R=>row.push((w.r||{})[R]??''))}row.push(s.bOut??'');lines.push(row.map(q).join(','))}
 return '\ufeff'+lines.join('\r\n')}
if(typeof module!=='undefined')Object.assign(module.exports,{buildCSV,mergeData});
