<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>メディアプレイヤー</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="プレイヤー">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f0f">
<link rel="apple-touch-icon" href="icon.png?v=1">
<link rel="icon" href="icon.png?v=1">
<link rel="manifest" href="manifest.json?v=1">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f0f;--sf:#1c1c1c;--sf2:#272727;--ln:#303030;--tx:#f1f1f1;--gd:#e9c46a;--bl:#2b6fe8;--rd:#ff4e45}
html,body{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--tx);font-size:14px;-webkit-text-size-adjust:100%;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
body.hasmini{padding-bottom:calc(126px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
button{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--bl);color:#fff;padding:10px 12px;cursor:pointer}
button.sub{background:var(--sf2);color:var(--tx)}button.dng{color:var(--rd)}button:disabled{opacity:.4}
button.lnk{background:none;color:var(--gd);padding:4px 6px}
input,select{font:inherit;border:1px solid var(--ln);border-radius:10px;padding:9px 10px;background:var(--sf);color:var(--tx);width:100%}
input.num{text-align:right}
input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--gd);margin:0}
h2,h3{font-size:14px;margin:0}
[hidden]{display:none!important}
/* 最初の画面 */
#choose{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top))}
#choose .logo{display:flex;justify-content:center}#choose .logo img{width:84px;height:84px;border-radius:20px}
#choose button{display:flex;align-items:center;justify-content:center;gap:14px;height:120px;border-radius:16px;font-size:22px;background:linear-gradient(135deg,#111,#2a2418);color:var(--gd);border:2px solid #5a4a22}
#choose button span{font-size:40px}
/* ヘッダー */
header{position:sticky;top:0;z-index:20;background:rgba(15,15,15,.96);display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
header b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;color:var(--tx);padding:6px 8px}
#hd_home img{width:28px;height:28px;border-radius:7px;display:block}
main{max-width:640px;margin:0 auto;padding:6px 10px 10px}
section{margin:6px 0 18px}section h2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card{background:var(--sf);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin-bottom:8px}.card>button{width:100%;margin-top:8px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:5px 0;gap:8px}
.red{color:var(--rd)}
.warn{background:#3a1d1a;color:#ffb4ab;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-weight:700;cursor:pointer}
.empty{padding:40px 0;text-align:center}
/* 一覧 */
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.grid.music{grid-template-columns:1fr 1fr}
.it{position:relative;cursor:pointer;min-width:0}
.th{position:relative;border-radius:10px;overflow:hidden;background:#222 center/40% no-repeat url(icon.png?v=1)}
.th.video{aspect-ratio:16/9}.th.music{aspect-ratio:1}
.th img{width:100%;height:100%;object-fit:cover;display:block}.th img:not([src]){visibility:hidden}
.du{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:700;padding:1px 5px;border-radius:5px}
.fv{position:absolute;left:6px;top:4px;color:var(--gd);font-style:normal;text-shadow:0 0 3px #000}
.tx{padding:6px 30px 0 2px;min-width:0}.tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700}.tx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mo{position:absolute;right:0;bottom:0;background:none;color:var(--tx);padding:6px 6px;font-size:16px}
.list{display:flex;flex-direction:column;gap:8px}
.list .it{display:flex;align-items:center;gap:10px}.list .th{width:120px;flex:none}.list .th.music{width:56px}.list .tx{flex:1;padding:0 30px 0 0}.list .mo{top:50%;transform:translateY(-50%);bottom:auto}
.list.ed .tx{padding-right:0}.ord{display:flex;gap:4px}.ord button{padding:8px 9px}
.hrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.hrow::-webkit-scrollbar{display:none}
.hrow .it{flex:none;width:44%}.hrow .th.music{}body[data-mode=music] .hrow .it{width:36%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--sf2);color:var(--tx);border-radius:10px;padding:7px 11px}.chip.on{background:var(--tx);color:#000}.chip i{font-style:normal;color:var(--gd);margin-left:2px}
.chip.on i{color:#7a5a00}
.pbar{display:flex;gap:8px;margin:8px 0;align-items:center}.pbar>button{flex:1}.pbar .nar{flex:none}.cnt{flex:none}
.ctl{display:flex;gap:8px;margin:8px 0}.ctl select{flex:1}.ic{flex:none;width:44px;padding:9px 0}
.srch{margin:4px 0}
.seg{display:flex;background:var(--sf);border-radius:10px;padding:3px;margin:8px 0;gap:3px}.seg button{flex:1;background:none;color:var(--tx);padding:8px 4px}.seg button.on{background:var(--sf2);color:var(--gd)}.seg button{white-space:nowrap;letter-spacing:-1px;padding:8px 2px}
.rows{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.rowb{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--sf);color:var(--tx);padding:12px}.rowb i{font-style:normal;color:var(--gd)}
.crumb{display:flex;flex-wrap:wrap;align-items:center;margin:6px 0}
.prog{height:8px;background:var(--sf2);border-radius:4px;overflow:hidden;margin:8px 0}.prog div{height:100%;background:var(--gd)}
.fold{background:var(--sf);border-radius:12px;padding:6px 10px;margin-bottom:8px}
.fh,.fr{display:flex;align-items:center;gap:8px;padding:7px 0;min-width:0}.fh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fh i,.fr em{font-style:normal;flex:none}
.fr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fr+.fr{border-top:1px solid var(--ln)}
.ok{color:#5bd16b;font-style:normal;font-weight:700}.nw{background:var(--rd);color:#fff;font-style:normal;font-weight:700;border-radius:5px;padding:0 5px}
.sendbox{position:sticky;top:calc(48px + env(safe-area-inset-top));z-index:5}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.fl{display:flex;align-items:center;gap:10px;margin:8px 0}.fl span{width:96px;flex:none}
/* タブ */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(15,15,15,.98);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;min-width:0;background:none;color:#aaa;padding:7px 0 6px;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:700}
#tabs button span{white-space:nowrap;letter-spacing:-1.5px}
#tabs button.on{color:var(--gd)}#tabs svg{width:24px;height:24px}
/* ミニプレイヤー */
#mini{position:fixed;left:6px;right:6px;bottom:calc(60px + env(safe-area-inset-bottom));z-index:29;background:var(--sf2);border-radius:12px;display:flex;align-items:center;gap:10px;padding:6px;overflow:hidden;cursor:pointer}
#mini img{width:46px;height:46px;border-radius:8px;object-fit:cover}#mini .mt{flex:1;min-width:0}#mini .mt b,#mini .mt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini button{background:none;color:var(--tx);font-size:18px;padding:8px}
#mini_bar{position:absolute;left:0;bottom:0;height:2px;background:var(--gd)}
/* シート */
#sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet_in{background:var(--sf);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
#sheet_in>button{width:100%;margin-top:8px}#sheet_in h3{margin-bottom:6px}
/* 再生画面 */
.pl{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none;padding-top:calc(52px + env(safe-area-inset-top))}
.pl.open{display:block}
#stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center;visibility:hidden}#stage video.on{visibility:visible}
.dimx{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:1}
#ind,.indm,.indx{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;font-weight:700;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}#ind.show,.indm.show,.indx.show{opacity:1}
.ctlx{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.55),transparent 30%,transparent 65%,rgba(0,0,0,.65));transition:opacity .25s}
.hid .ctlx{opacity:0;pointer-events:none}
.ctlx button{background:none;color:#fff;padding:8px 10px}
.ct{display:flex;align-items:center;gap:4px;padding:4px}.ct b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{display:flex;justify-content:center;align-items:center;gap:6px}.ctlx .cm button{font-size:16px}.ctlx .cm .pp{font-size:26px;width:64px;height:64px;border-radius:32px;background:rgba(0,0,0,.45)}
.cb{display:flex;align-items:center;gap:6px;padding:0 6px 4px}.cb .zr{display:none}#pv.zoomed .cb .zr{display:block}
.sk{position:relative;flex:1;display:flex;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;height:24px;width:100%;position:relative}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(255,255,255,.3);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:7px;background:var(--gd);margin-top:-5px}
input[type=range]::-moz-range-track{height:4px;background:rgba(255,255,255,.3)}input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:7px;background:var(--gd);border:0}
.lockx{position:absolute;inset:0;display:none;z-index:70}.locked .lockx{display:block;position:fixed}.locked .ctlx{display:none}
.unl{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));opacity:0;transition:opacity .2s;background:rgba(0,0,0,.6);color:#fff}.unl.show{opacity:1}
.pinfo{padding:10px}.pinfo h3{margin:2px 0 4px}.p_a{margin-bottom:6px;color:var(--gd)}
.pbtn{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pbtn button{background:var(--sf2);color:var(--tx);padding:8px 10px;flex:1 0 auto}.pbtn button.on{color:var(--gd)}
.pbtn.main button{font-size:16px}.si{width:20px;height:20px;display:block;margin:auto}.ctlx .si{width:26px;height:26px}.pbtn.main .pp{background:var(--tx);color:#000}
.p_q{padding:10px}.p_q .it.now .tx b{color:var(--gd)}.p_q .th.video{width:110px}
.seekw{display:flex;align-items:center;gap:8px}
#pv.fs #stage,#pv.fs{overflow:hidden}#pv.fs #stage{position:fixed;inset:0;aspect-ratio:auto;z-index:2}
@media (orientation:landscape) and (max-height:500px){#pv #stage{position:fixed;inset:0;aspect-ratio:auto;z-index:2}}
#pm .pmw{max-width:480px;margin:0 auto;padding:6px 16px}#pm .ct button{background:none;color:var(--tx);font-size:18px}
#pm .art{position:relative;width:min(56.25vw,360px);aspect-ratio:1;margin-left:auto!important;margin-right:auto!important;touch-action:none;border-radius:14px;overflow:hidden;background:#222;margin:6px 0 12px}#pm .art img{width:100%;height:100%;object-fit:cover}
#pm .p_q{max-width:480px;margin:0 auto}
/* r267 */
.hst{display:flex;flex-direction:column;align-items:flex-end;gap:0;padding:2px 4px!important;font-size:14px;line-height:1.25;max-width:52%}.hst span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gd{color:var(--gd)}.bl{color:#7aa7ff}
.ck{display:none;position:absolute;right:6px;top:5px;width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.55);border:2px solid #fff;color:transparent;font-style:normal;text-align:center;line-height:20px;font-weight:700}
.it.sel .ck{background:var(--gd);border-color:var(--gd);color:#000}body.hasbulk .ck{display:block}
.it.sel .th{outline:3px solid var(--gd);outline-offset:-3px}.list .ck{right:auto;left:4px}
.bdg{display:flex!important;gap:4px;flex-wrap:wrap}.bad,.dp{font-style:normal;font-weight:700;border-radius:5px;padding:0 5px;flex:none}.bad{background:#5a1f1a;color:#ffb4ab}.dp{background:#3a3014;color:var(--gd)}
.fr b{flex:none;font-weight:700;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 0 30%}
.nar.on{background:var(--gd);color:#000}
#bulk{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:31;background:#1d1a12;border-top:2px solid var(--gd);padding:8px 8px}
#bulk .bk1,#bulk .bk2{display:flex;gap:6px;align-items:center}#bulk .bk1{margin-bottom:6px}#bulk .bk1 b{flex:1;color:var(--gd)}#bulk .bk2{flex-wrap:wrap}#bulk .bk2 button{flex:1 0 30%;padding:9px 4px}
#bulk .dngb{background:#7a2a22}
body.hasbulk main{padding-bottom:130px}body.hasbulk #mini{display:none!important}
.pk{max-height:50vh;overflow:auto}.pk .fr em{max-width:35%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 再生画面の戻る・ミニバー */
.phd{position:fixed;top:0;left:0;right:0;z-index:7;display:flex;align-items:center;justify-content:space-between;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 4px 0;background:var(--bg)}
.phd button{background:none;color:var(--tx);padding:6px 10px}.bkv{width:30px;height:30px;display:block;color:var(--gd)}
#pv:not(.fs) .ctlx [data-pc=close]{visibility:hidden}
#vmini,#pmini{display:none;position:fixed;left:6px;right:6px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:8;background:var(--sf2);border-radius:12px;align-items:center;gap:8px;padding:6px;cursor:pointer}
#pv.vm #vmini,#pm.vm #pmini{display:flex}#pv.vm,#pm.vm{padding-bottom:80px}
#vmini img{width:80px;height:45px;border-radius:6px;object-fit:cover;background:#000;flex:none}#pmini img{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none}.mbar .mt{flex:1;min-width:0}.mbar .p_a{margin:0}.mbar .mt b,.mbar .mt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar button{background:none;color:var(--tx);padding:8px 6px;flex:none}.mbar .si{width:20px;height:20px}
#pv.fs .phd{display:none}
@media (orientation:landscape) and (max-height:500px){.phd{display:none}.pl{padding-top:0}#pv:not(.fs) .ctlx [data-pc=close]{visibility:visible}#vmini,#pmini{display:none!important}}
.wsel{width:auto;flex:none}
/* 音楽の横向き全画面 */
.stg{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#mstage{display:none;touch-action:none}
.mst .mart{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:80%;aspect-ratio:1;object-fit:cover;border-radius:14px;box-shadow:0 0 0 2px #5a4a22,0 0 40px rgba(233,196,106,.25)}
@media (orientation:landscape) and (max-height:500px){#pm.open .pmw,#pm.open .p_q{display:none}#pm.open #mstage{display:block;position:fixed;inset:0;background:radial-gradient(circle at center,#1d1a12,#000 70%);z-index:2}}
/* PC 横長 */
@media (min-width:900px) and (hover:hover) and (pointer:fine){
 body{padding-bottom:0;padding-left:96px}body.hasmini{padding-bottom:70px}
 #tabs{top:0;bottom:0;right:auto;width:96px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--ln);padding-top:60px}
 #tabs button{flex:none;padding:12px 0;font-size:14px}
 #bulk{left:96px}
 main{max-width:none;padding:6px 24px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.grid.music{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
 .hrow .it{width:260px}body[data-mode=music] .hrow .it{width:170px}
 #mini{left:106px;bottom:8px}
 .sendbox{top:52px}
 #pv.open{display:flex;align-items:flex-start}#pv .pvl{flex:1;min-width:0;height:calc(100vh - 52px);overflow:auto}#pv #stage{max-height:76vh}#pv .p_q{width:380px;flex:none;height:calc(100vh - 52px);overflow:auto}
 #pm.open{display:grid;grid-template-columns:minmax(0,1fr) 420px}#pm .p_q{max-width:none;overflow:auto;max-height:100vh}
}
</style>
</head><body>
<div id="choose" hidden><div class="logo"><img src="icon.png?v=1" alt=""></div><button data-mode="music"><span>🎵</span>音楽</button><button data-mode="video"><span>🎬</span>動画</button></div>
<div id="app" hidden>
<header><button id="hd_home"><img src="icon.png?v=1" alt=""></button><button id="hd_back" hidden>‹</button><b id="hd_t"></b><button id="hd_st" class="hst"></button></header>
<main id="main"></main>
<div id="mini" hidden><img id="mini_img" alt=""><div class="mt"><b id="mini_t"></b><span id="mini_a"></span></div><button id="mini_pv">⏮</button><button id="mini_pp">▶</button><button id="mini_nx">⏭</button><div id="mini_bar"></div></div>
<div id="bulk" hidden></div>
<nav id="tabs"></nav>
</div>
<div id="pv" class="pl"></div>
<div id="pm" class="pl"></div>
<audio id="au" preload="auto" playsinline></audio>
<div id="sheet" hidden><div id="sheet_in"></div></div>
<script src="core.js?v=12"></script>
<script src="conv.js?v=12"></script>
<script src="player.js?v=12"></script>
<script src="app.js?v=12"></script>
</body></html>
