<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>プロンプト作成</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="プロンプト作成">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f5fd6">
<link rel="apple-touch-icon" href="icon.png?v=1">
<link rel="icon" href="icon.png?v=1">
<link rel="manifest" href="manifest.json?v=1">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f3f4f7;color:#111;font-size:16px;-webkit-text-size-adjust:100%;line-height:1.45}
body{padding:0 0 calc(12px + env(safe-area-inset-bottom))}
header{background:#1f5fd6;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{width:32px;height:32px;border-radius:8px}
header h1{font-size:16px;margin:0;flex:1;font-weight:700}
header a{color:#fff;font-size:16px;text-decoration:none}
nav{display:flex;gap:4px;padding:8px 8px;overflow-x:auto;background:#fff;border-bottom:1px solid #d0d3db;position:sticky;top:52px;z-index:4}
nav button{flex:0 0 auto;border:1px solid #c5c8d0;background:#fff;border-radius:16px;padding:6px 12px;font-size:16px;color:#111}
nav button.on{background:#1f5fd6;border-color:#1f5fd6;color:#fff}
main{padding:10px;max-width:640px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
h2{font-size:16px;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
input,select,textarea,button{font-size:16px;font-family:inherit;color:#111}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;padding:8px;border:1px solid #c5c8d0;border-radius:8px;background:#fff}
textarea{min-height:140px;resize:vertical}
button.b{padding:9px 14px;border-radius:8px;border:none;background:#1f5fd6;color:#fff;font-weight:700}
button.sub{background:#e9ecf2;color:#111;border:none;padding:9px 14px;border-radius:8px;font-weight:700}
button.lock{background:#fff;border:1px solid #c5c8d0;border-radius:8px;padding:4px 8px}
button.lock.on{background:#111;color:#fff;border-color:#111}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pick button{border:1px solid #c5c8d0;background:#fff;border-radius:8px;padding:6px 10px;font-size:16px;color:#111;text-align:left}
.pick button.on{background:#1f5fd6;border-color:#1f5fd6;color:#fff}
.pick button.off{background:#e4e6eb;color:#111;border-style:solid;border-color:#c5c8d0;text-decoration:line-through;pointer-events:none}
.line{margin:6px 0;padding:8px;background:#f6f7fa;border-radius:8px}
.pose{border:1px solid #c5c8d0;border-radius:8px;padding:8px;margin:6px 0;background:#fff;width:100%;text-align:left}
.pose.on{border-color:#1f5fd6;background:#eef3ff}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #e3e5ea}
.item:last-child{border-bottom:none}
.ok{color:#137a3a}.ng{color:#c62828}
#st{margin:0 0 8px;min-height:0}
</style>
</head>
<body>
<header>
  <img src="icon.png?v=1" alt="">
  <h1>プロンプト作成</h1>
  <a href="../">スロ判別へ</a>
</header>
<nav id="nav"></nav>
<main>
  <div id="st"></div>
  <div id="app"></div>
</main>
<script src="app.js?v=1"></script>
</body>
</html>
