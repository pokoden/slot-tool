<style>

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0}

th,td{padding:5px 6px;border-bottom:1px solid #eee;text-align:right}

td.l,th.l{text-align:left}
th.fix,td.fix{position:sticky;left:0;background:#fff;z-index:1}
th.fix{background:#f6f7fa;z-index:2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}

.hidden{display:none}
.zw{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh;border:1px solid #ccc;border-radius:8px;background:#fafafa}
.zb{position:relative;min-width:100%}
.zc{position:absolute;transform:translate(-50%,-50%);min-width:36px;padding:1px 3px;border-radius:6px;border:2px solid #999;background:#fff;text-align:center;font-size:11px;line-height:1.15;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.zc b{display:block;font-size:12px}.zc.ed{touch-action:none;cursor:move}.zc.sel{box-shadow:0 0 0 3px #1f5fd6;z-index:2}
.zgrid{display:grid;width:max-content;padding:2px;background:#fff}
.g{border:1px solid #444;margin:0 -1px -1px 0;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;white-space:nowrap;line-height:1}
.gt{font-weight:700;cursor:pointer}.ga{color:#333}.gk{font-weight:700}.mo{background:#39ff14}.mt{background:#f5ff00}.mx{background:#ddd}.ms{background:#ff9100}.mb{background:#00b0ff}.mq{background:#b4b4b4}
.g.sel{background:#cfe0ff;z-index:2}.g.mo.sel{background:#39ff14}.g.mt.sel{background:#f5ff00}.g.ms.sel{background:#ff9100}.g.mb.sel{background:#00b0ff}.g.mq.sel{background:#b4b4b4}.gt.sel{outline:2px solid #1f5fd6;outline-offset:-2px}
.zl b{display:inline-block;min-width:16px;text-align:center;border:1px solid #444;border-radius:3px;padding:0 2px}
.zl{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-right:10px}.zl i{width:12px;height:12px;border-radius:3px;display:inline-block}.zleg{margin:6px 0}
.r1{color:#c62828;font-weight:700}.r2{color:#d4561c;font-weight:600}
tr.sum td{background:#fff8e6;font-weight:600}tr.sum td.fix{background:#fff8e6}
tr.gh td{background:#20242c;padding:0;text-align:left}
.bd{position:sticky;left:0;display:flex;gap:6px;width:calc(100vw - 56px);box-sizing:border-box;padding:1px 6px;font-size:11px;line-height:1.35;color:#e9c46a;font-weight:600;cursor:pointer}
.bd.st{color:#9fd3ff}.bn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bd.open .bn{white-space:normal}.bc{white-space:nowrap;color:#fff;font-weight:400}
th.fix,td.fix{padding-left:4px;padding-right:6px}
.f1{width:34px;min-width:34px;max-width:34px;text-align:center!important;padding-left:2px!important;padding-right:2px!important}.f2{left:34px!important}
table td{font-variant-numeric:tabular-nums}td.mkc{text-align:center}
td.ml{max-width:6em;overflow:hidden;text-overflow:ellipsis}
th.s{cursor:pointer}th.s.on{color:#1f5fd6}
.fs{min-width:5.2em;max-width:7.5em;text-align:left!important;white-space:normal!important;line-height:1.25}input.mi{font-size:16px;padding:2px 4px;text-align:right;border:1px solid #888;border-radius:4px;background:#fff;color:#111;width:68px}input.mi.s{width:50px}td.ib{color:#0b57d0;font-weight:700}.gv{font-size:.8em;margin-left:2px;font-weight:700;color:#111}.zv{display:block;font-size:10px;font-weight:700}
td.fs b{display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:4px 0}.cal i{font-style:normal;text-align:center;font-size:12px;color:#111;font-weight:700}.cal button{height:36px;padding:0;border:1px solid #ccd;border-radius:6px;background:#fff;color:#111;font-size:14px}.cal button.dd{background:#e3edff;font-weight:700}.cal button.on{background:#1f5fd6;color:#fff;border-color:#1f5fd6;font-weight:700}.cal .su{color:#c0201a}.cal .sa{color:#0b57d0}.cal button.on.su,.cal button.on.sa{color:#fff}.calh{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px}.calh button{width:40px;height:34px;font-size:18px;border:1px solid #ccd;border-radius:8px;background:#fff;color:#111}.calh b{font-size:15px}
td.kst{color:#0b57d0;font-weight:700;font-size:11px;line-height:12px;white-space:normal;overflow:hidden}td.kst span{white-space:nowrap}#kvt tr.kr td{height:30px;padding-top:0;padding-bottom:0;overflow:hidden;text-overflow:ellipsis}.mn{display:inline-block;max-width:6.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips button{font-size:13px;padding:5px 9px;border-radius:14px;border:1px solid #ccd;background:#fff;color:#111}.chips button.on{background:#1f5fd6;color:#fff;border-color:#1f5fd6}
details summary{font-size:14px;font-weight:600;padding:4px 0}
.mk{display:inline-block;min-width:20px;text-align:center;border-radius:50%;font-weight:700;line-height:20px;font-size:14px}.mk.a{background:#39ff14;color:#063}.mk.m{background:#ff2bd6;color:#fff}.mk.x{color:#111;font-weight:700}.mk.t{background:#f5ff00;color:#5a5200}.mk.ms{background:#ff9100;color:#3a1c00}.mk.mb{background:#00b0ff;color:#00243a}.mk.mq{background:#b4b4b4;color:#111}.ox3{min-width:46px;width:46px}.gl{border-left:2px solid #555!important}.gr{border-right:2px solid #555!important}.og{color:#0b7a2b;font-weight:700;background:#e3f9dd}.ox{color:#222}.seat{font-weight:600}.seat.un{color:#222;font-weight:400}.tn b{font-size:13px}td.tn{white-space:normal!important;max-width:8.5em;min-width:3.5em;line-height:1.2}.sc{font-weight:700;white-space:nowrap}.tn b.sl{color:#1f5fd6}td.mkc{cursor:pointer}
</style>

<body>
<header><img src="icon.png?v=1" alt=""><h1>設定狙いツール</h1><a href="../">スロ判別へ</a></header>
<nav id="nav"></nav>
<main id="main"><div class="card">読み込み中…</div></main>
<script src="core.js?v=16"></script>
<script src="layouts.js?v=1"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const API='https://api.github.com/repos/pokoden/slot-data/';
const tok=()=>LS.get('v2_token','');
const TABS=[['imp','取り込み'],['tou','当日'],['ken','検索'],['bor','ボーダー'],['ana','分析'],['ner','狙い'],['zu','図面'],['set','設定']];
let tab=LS.get('nr_tab','imp');if(!TABS.some(t=>t[0]===tab&&!t[2]))tab='imp';
// 状態
let anDirty=false,zuDirty=false;
let NRC={};
const S={an:{v:1,border:{},marks:{}},loaded:false,loadErr:'',files:{},rows:[],set:{groups:{},types:{},alias:null},agg:{},pending:null};
const setObj=()=>({groups:S.set.groups||{},types:S.set.types||{},alias:S.set.alias||NC.DEF_ALIAS});

async function gh(path,opt={}){const r=await fetch(API+path,Object.assign({cache:'no-store'},opt,{headers:Object.assign({Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json'},opt.headers||{})}));return r}
function b64dec(b){const bin=atob(b.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function b64enc(s){const u=new TextEncoder().encode(s);let bin='';for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin)}
async function loadAll(){NRC={};S.loaded=false;S.loadErr='';S.files={};S.rows=[];S.agg={};
 if(!tok()){S.loadErr='この画面にはGitHubトークンが入ってないよ。下の欄に、スロ判別ツールと同じトークンを入れてね。';S.needTok=true;return}
 S.needTok=false;const why=st=>st===401?'トークンが違うか期限切れみたい（401）':st===403?'トークンに slot-data の読み書き権限がないか、回数制限（403）':st===404?'slot-data が見えない（404）。トークンの対象リポジトリを確認してね':'通信エラー（'+st+'）';
 const r=await gh('contents/nerai'); if(!r.ok){if(r.status===401||r.status===404)S.needTok=true;throw new Error('一覧の読み込みに失敗：'+why(r.status))}
 const all=(await r.json()).filter(f=>f.type==='file');const list=all.filter(f=>/\.json$/.test(f.name));
 for(const f of all)if(!/\.json$/.test(f.name))S.files['nerai/'+f.name]={sha:f.sha,txt:null};
 // iPhoneで重くならないよう3つずつ読む。失敗したら1回だけやり直す
 let done=0;const q=[...list];const one=async f=>{let b;for(let t=0;t<2;t++){try{b=await gh('git/blobs/'+f.sha);if(b.ok)break}catch(e){b=null}}
  if(!b||!b.ok)throw new Error(f.name+' の読み込みに失敗：'+(b?why(b.status):'通信が切れた'));
  const txt=b64dec((await b.json()).content);JSON.parse(txt);S.files['nerai/'+f.name]={sha:f.sha,txt};done++;const m=$('main');if(m&&!S.loaded)m.innerHTML=`<div class="card">読み込み中… ${done}/${list.length}</div>`};
 await Promise.all([0,1,2].map(async()=>{while(q.length)await one(q.shift())}));
 const an=S.files['nerai/analysis.json'];S.an=an?JSON.parse(an.txt):{v:1,border:{},marks:{}};S.anSaved=JSON.stringify(S.an);const zf=S.files['nerai/zumen.json'];S.zu=zf?JSON.parse(zf.txt):{v:1,stores:{}};if(!S.zu.stores)S.zu.stores={};S.zuSaved=JSON.stringify(S.zu);S.zimg={};S.zimgNew={};
 const st=S.files['nerai/settings.json'];if(st)S.set=Object.assign({groups:{},types:{},alias:null},JSON.parse(st.txt));
 for(const k of Object.keys(S.files).sort()){if(/nerai\/\d{4}-\d{2}\.json$/.test(k))S.rows.push(...NC.rowsFromFile(JSON.parse(S.files[k].txt)));
  else if(/agg-/.test(k))S.agg[k.slice(10,17)]=JSON.parse(S.files[k].txt)}
 S.loaded=true}
// 変わったファイルだけ保存。読み込みに失敗していたら絶対に保存しない
async function saveFiles(out,msg,prog){if(!S.loaded)throw new Error('読み込みに失敗してるので保存しないよ（データを守るため）');
 const keys=Object.keys(out).filter(k=>!S.files[k]||S.files[k].txt!==out[k]).sort((a,b)=>(/agg-|settings/.test(a)?1:0)-(/agg-|settings/.test(b)?1:0)||a.localeCompare(b));
 let n=0;for(const k of keys){prog&&prog(`保存中 ${++n}/${keys.length}（${k.slice(6)}）`);
  const body={message:msg+' '+k,content:b64enc(out[k])};if(S.files[k])body.sha=S.files[k].sha;
  const r=await gh('contents/'+k,{method:'PUT',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
  if(!r.ok){const e=r.status===409||r.status===422?'他の端末で先に更新されたみたい。読み直してからもう一度やってね':'保存失敗（'+r.status+'）';throw new Error(k.slice(6)+'：'+e+(n>1?`\n※${n-1}件は保存済み。読み直すと続きから直せるよ`:''))}
  const j=await r.json();S.files[k]={sha:j.content.sha,txt:out[k]}}
 return keys.length}
function allFiles(rows){const out=NC.monthFiles(rows,setObj());out['nerai/settings.json']=JSON.stringify({v:1,groups:S.set.groups||{},types:S.set.types||{},alias:S.set.alias||NC.DEF_ALIAS});return out}
function refreshAgg(out){S.agg={};for(const k in out)if(/agg-/.test(k))S.agg[k.slice(10,17)]=JSON.parse(out[k])}

function nav(){$('nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" ${t[2]?'disabled':''} onclick="go('${t[0]}')">${t[1]}${t[2]?'<small>（準備中）</small>':''}</button>`).join('')}
window.go=t=>{if((anDirty||zuDirty)&&t!==tab&&!confirm('設定や図面が未保存だよ。保存しないで移動する？'))return;if(t!==tab&&anDirty){anDirty=false;S.an=JSON.parse(S.anSaved);NRC={}}if(t!==tab&&zuDirty){zuDirty=false;S.zu=JSON.parse(S.zuSaved);S.zimgNew={};NRC={}}tab=t;LS.set('nr_tab',t);render()};
function render(){nav();const m=$('main');
 if(!S.loaded){m.innerHTML=`<div class="card"><h2>読み込めなかったよ</h2><p class="note ng">${esc(S.loadErr)}</p><button class="b" onclick="reload()">もう一度読む</button></div>${tokCard()}`;return}
 if(tab==='imp')return impPage();if(tab==='set')return setPage();if(tab==='tou')return touPage();if(tab==='ana')return anaPage();if(tab==='bor')return borPage();if(tab==='ner')return nerPage();if(tab==='zu')return zuPage();if(tab==='ken')return kenPage()}
window.reload=async()=>{$('main').innerHTML='<div class="card">読み込み中…</div>';try{await loadAll()}catch(e){S.loadErr=e.message}render()};

// ===== トークン（スロ判別ツールと同じ v2_token。ホーム画面に追加したアプリは保存場所が別なので、ここでも入れられる）=====
function tokCard(){return`<div class="card"><h2>🔑 同期トークン <span class="${tok()?'ok':'ng'}" style="font-size:13px">${tok()?'保存済み':'未設定'}</span></h2>
<div class="row"><input id="tk" type="password" autocomplete="off" placeholder="github_pat_…" style="flex:1;min-width:0"><button class="b" onclick="saveTok()">保存</button></div></div>`}
window.saveTok=()=>{const v=$('tk').value.trim();if(!v){alert('トークンを入れてね');return}LS.set('v2_token',v);$('tk').value='';reload()};
// ===== 取込 =====
function dataInfo(){const R=S.rows;if(!R.length)return'<p class="note">まだデータがないよ</p>';
 let a='9',b='0';const st={};for(const r of R){if(r.d<a)a=r.d;if(r.d>b)b=r.d;st[r.s]=(st[r.s]||0)+1}
 return`<div class="kv"><span>件数</span><b>${R.length.toLocaleString()}件</b><span>期間</span><b>${a} 〜 ${b}</b>${Object.entries(st).sort((x,y)=>y[1]-x[1]).map(([s,n])=>`<span>${esc(s)}</span><b>${n.toLocaleString()}件</b>`).join('')}</div>`}
function impPage(){$('main').innerHTML=`
<div class="card"><h2>📥 データ取り込み</h2>
<div class="row"><input type="file" id="f" accept=".tsv,.csv,.txt,text/csv,text/tab-separated-values,text/plain" multiple></div>
<textarea id="paste" placeholder="2026/10/26	マルハン青森柏	マイジャグラーV	321	3776	15	8"></textarea>
<div class="row"><button class="b" onclick="readIn()">読み込んで確認</button></div><div id="pv"></div></div>
<div class="card"><h2>🗂 保存済みデータ</h2>${dataInfo()}<div class="row"><button class="b sub" onclick="reload()">読み直す</button></div></div>`}
window.readIn=async()=>{let txt=$('paste').value;const fs=$('f').files;for(const f of fs)txt+='\n'+await f.text();
 if(!txt.trim()){$('pv').innerHTML='<p class="st ng">データが空だよ</p>';return}
 const set=setObj();const p=NC.parseText(txt,set);const m=NC.merge(S.rows,p.rows,set);S.pending=m;
 const days={};for(const r of p.rows){const k=r.d+'｜'+r.s;days[k]=(days[k]||0)+1}
 $('pv').innerHTML=`<div class="st">読めた行：${p.rows.length.toLocaleString()}件\n新しく追加：${m.add.toLocaleString()}件\n重複で削除：${m.dup.toLocaleString()}件\n数字が違うので置き換え：${m.rep.toLocaleString()}件${p.errs.length?`\n<span class="ng">読めなかった行：${p.errs.length}件</span>`:''}</div>
 ${p.errs.length?`<div class="tw"><table><tr><th>行</th><th class="l">理由</th><th class="l">内容</th></tr>${p.errs.slice(0,30).map(e=>`<tr><td>${e.line}</td><td class="l">${e.why}</td><td class="l">${esc(e.text)}</td></tr>`).join('')}</table></div>`:''}
 ${m.repl.length?`<div class="tw"><table><tr><th class="l">日付</th><th class="l">店舗</th><th>台番</th><th>前</th><th>後</th></tr>${m.repl.map(x=>`<tr><td class="l">${x.neu.d}</td><td class="l">${esc(x.neu.s)}</td><td>${esc(x.neu.t)}</td><td>${x.old.g}G ${x.old.bb}/${x.old.rb}</td><td>${x.neu.g}G ${x.neu.bb}/${x.neu.rb}</td></tr>`).join('')}</table></div>`:''}
 <div class="tw"><table><tr><th class="l">日付｜店舗</th><th>行数</th></tr>${Object.entries(days).sort().map(([k,n])=>`<tr><td class="l">${esc(k)}</td><td>${n}</td></tr>`).join('')}</table></div>
 <div class="row"><button class="b" ${m.add+m.rep?'':'disabled'} onclick="doSave()">保存する</button><button class="b sub" onclick="S.pending=null;$('pv').innerHTML=''">やめる</button></div><div id="sv" class="st"></div>`};
window.doSave=async()=>{const m=S.pending;if(!m)return;const sv=$('sv');document.querySelectorAll('#pv button').forEach(b=>b.disabled=true);
 try{sv.textContent='計算中…';await new Promise(r=>setTimeout(r,30));const out=allFiles(m.rows);
  NRC={};const n=await saveFiles(out,'設定狙い取込',t=>sv.textContent=t);S.rows=m.rows;refreshAgg(out);S.pending=null;
  sv.className='st ok';sv.textContent=`保存したよ（${n}ファイル更新）`;$('paste').value='';$('f').value=''}
 catch(e){sv.className='st ng';sv.textContent=e.message}};

// ===== 手入力の回転・BB・RB（店舗・日付・台番ごと。表示だけで、どの計算にも使わない）=====
const manKey=(s,d,t)=>s+'|'+d+'|'+t;
const manAll=()=>S.an.manual||(S.an.manual={});
// 表示用の値：手入力が優先、なければその日の実データ（実データがない日は空欄）
function effV(s,d,t,real){const m=manAll()[manKey(s,d,t)]||{};return{g:m.g!=null?m.g:real?real.g:null,bb:m.bb!=null?m.bb:real?real.bb:null,rb:m.rb!=null?m.rb:real?real.rb:null}}

 const chip=(id,L)=>`<div class="chips">${L.map(([k,x])=>`<button class="${kn[id].includes(k)?'on':''}" onclick="knTog('${id}','${esc(k).replace(/'/g,'')}')">${esc(x)}</button>`).join('')}</div>`;
 const num=(id,ph,w=70)=>`<input type="number" inputmode="decimal" step="any" value="${esc(kn[id])}" placeholder="${ph}" style="width:${w}px" onchange="kn.${id}=this.value;kenRes()">`;
 const txt=(id,ph,w=140)=>`<input value="${esc(kn[id])}" placeholder="${ph}" style="width:${w}px" onchange="kn.${id}=this.value;kenRes()">`;
 const per=kenPer();
 const pb=[[1,'前日'],[2,'2日間'],[3,'3日間'],[6,'6日間']].map(([n,t])=>`<button class="${kn.from===per[n][0]&&kn.to===per[n][1]?'on':''}" onclick="knPer(${n})">${t}</button>`).join('');
 $('main').innerHTML=`<div class="card"><h2>🔎 データ検索 <span style="flex:1"></span><button class="b sub" style="margin:0;padding:6px 10px;font-size:13px" onclick="knReset()">条件をリセット</button></h2>
<p class="note">店舗</p>${chip('st',stores.map(s=>[s,s.replace(/^マルハン/,'')]))}
<div class="row">${sel('g',[['','すべての機種']].concat(groups.slice().sort(gOrd()).map(g=>[g,mShort(g)])),kn.g)}${sel('ty',[['','ノーマル・AT'],['N','ノーマル'],['AT','AT']],kn.ty)}</div>
<p class="note">期間</p><div class="chips">${pb}<button class="${!kn.from&&!kn.to?'on':''}" onclick="knAllP()">全期間</button></div>
${kenCal()}
<p class="note">日末尾</p>${chip('mt',[...Array(10).keys()].map(i=>[String(i),String(i)]))}
<p class="note">曜日</p>${chip('yo',[...'日月火水木金土'].map((c,i)=>[String(i),c]))}
<div class="row"><label>日 ${txt('hi','例 7,17,27',110)}</label></div>
<p class="note">回転数</p><div class="row">${num('gmin','以上')}〜${num('gmax','以下')}</div>
<p class="note">確率</p>
<div class="row"><label>BB ${num('bmin','以上',64)}〜${num('bmax','以下',64)}</label></div><div class="row"><label>RB ${num('rmin','以上',64)}〜${num('rmax','以下',64)}</label></div><div class="row"><label>合算 ${num('smin','以上',64)}〜${num('smax','以下',64)}</label></div>
<p class="note">台番</p><div class="row"><label>${txt('tai','例 401 405-410',150)}</label></div>
<p class="note">状態の期間</p>${chip('sw',NC.WIN.map(w=>[w[0],w[1]]))}
<p class="note">状態の指標</p>${chip('sm',[['g','回転'],['gs','合算']])}
<div class="row"><label>並び ${sel('so',[['def','店舗・機種・台番順'],['d-','日付が新しい順'],['d+','日付が古い順'],['t','台番順'],['g-','回転が多い順'],['g+','回転が少ない順'],['s+','合算が良い順'],['s-','合算が悪い順']],kn.so)}</label><button class="b sub" onclick="knSo('def')">標準の並びに戻す</button></div></div>
<div id="kres"></div>`;kenRes()}
// 下の表は全行を一度に見られる（もっと見るなし）。画面に見えている行の前後だけ描いて、スクロールで入れ替える
const KRH=30,KBUF=40;let KV=null;
function kenRow(x){const r=x.r,P=(g,n)=>NC.fmtP(NC.den(g,n));const ix=NC.rowIdx(r,KV.set,KV.base);const hit=ix.g!=null&&ix.rb!=null&&ix.gs!=null&&ix.g>=55&&ix.rb>=55&&ix.gs>=55;
 const tc=x.k?`<td class="fix kst">${esc(x.k.lab)}<span>(${esc(r.t)})</span></td>`:`<td class="fix">${esc(r.t)}</td>`;
 return`<tr class="kr">${tc}<td class="l">${r.d.slice(5)}</td><td>${r.g.toLocaleString()}</td><td>${r.bb}</td><td>${r.rb}</td><td>${P(r.g,r.bb)}</td><td>${P(r.g,r.rb)}</td><td>${P(r.g,r.bb+r.rb)}</td>${stTd(r.s)}<td class="l"><span class="mn" title="${esc(r.m)}">${esc(mShort(r.m))}</span>${hit?' <span class="mk a">○</span>':''}</td></tr>`}
function knPaint(force){const tb=$('kvb');const tbl=$('kvt');if(!KV||!tb||!tbl)return;const n=KV.out.length;
 const top=tbl.getBoundingClientRect().top+(tbl.tHead?tbl.tHead.offsetHeight:0);
 const step=KBUF/2;let first=Math.max(0,Math.floor((-top/KRH-KBUF)/step)*step);if(first>n)first=Math.max(0,n-KBUF);
 if(!force&&first===KV.first)return;KV.first=first;const end=Math.min(n,first+Math.ceil(window.innerHeight/KRH)+2*KBUF+step);const nc=tbl.tHead.rows[0].cells.length;
 const sp=h=>h>0?`<tr class="ksp"><td colspan="${nc}" style="height:${h}px;padding:0;border:0"></td></tr>`:'';
 let h=sp(first*KRH);for(let i=first;i<end;i++)h+=kenRow(KV.out[i]);h+=sp((n-end)*KRH);tb.innerHTML=h}
let knSc=0;window.addEventListener('scroll',()=>{if(tab!=='ken'||!KV||knSc)return;knSc=requestAnimationFrame(()=>{knSc=0;knPaint(false)})},{passive:true});
// 上の合計・平均は、台番の行だけで数える（状態の行は入れない）
function kenRes(){LS.set('nr_kn',kn);const el=$('kres');if(!el)return;const set=setObj();const {out,nT,nS}=kenRun();const P=(g,n)=>NC.fmtP(NC.den(g,n));
 const t={n:nT,g:0,bb:0,rb:0};for(const x of out)if(!x.k){t.g+=x.r.g;t.bb+=x.r.bb;t.rb+=x.r.rb}
 KV={out,set,base:out.length?kenBase():null,first:-1};
 const cw=[116,52,56,40,40,58,58,50,66,120];
 el.innerHTML=`<div class="card"><h2>📋 結果 ${nT.toLocaleString()}件${nS?`（状態 ${nS.toLocaleString()}件）`:''}</h2>
${out.length?`<div class="tw"><table><tr><th class="l">区分</th><th>件数</th><th>回転</th><th>BB</th><th>RB</th><th>BB確率</th><th>RB確率</th><th>合算</th></tr>
<tr class="sum"><td class="l">合計</td><td>${t.n.toLocaleString()}</td><td>${t.g.toLocaleString()}</td><td>${t.bb.toLocaleString()}</td><td>${t.rb.toLocaleString()}</td><td rowspan="2">${P(t.g,t.bb)}</td><td rowspan="2">${P(t.g,t.rb)}</td><td rowspan="2">${P(t.g,t.bb+t.rb)}</td></tr>
<tr class="sum"><td class="l">平均</td><td></td><td>${t.n?Math.round(t.g/t.n).toLocaleString():''}</td><td>${t.n?(t.bb/t.n).toFixed(1):''}</td><td>${t.n?(t.rb/t.n).toFixed(1):''}</td></tr></table></div>
<div class="tw" style="margin-top:8px"><table id="kvt" style="table-layout:fixed;width:${cw.reduce((a,b)=>a+b,0)}px"><colgroup>${cw.map(w=>`<col style="width:${w}px">`).join('')}</colgroup><thead><tr><th class="fix s ${kn.so==='t'?'on':''}" onclick="knSo('t')">台番</th><th class="l s ${kn.so[0]==='d'?'on':''}" onclick="knSo('d')">月日</th><th class="s ${kn.so[0]==='g'?'on':''}" onclick="knSo('g')">回転</th><th>BB</th><th>RB</th><th>BB確率</th><th>RB確率</th><th class="s ${kn.so[0]==='s'?'on':''}" onclick="knSo('s')">合算</th><th class="l">店舗</th><th class="l s ${kn.so==='def'?'on':''}" onclick="knSo('def')">機種</th></tr></thead><tbody id="kvb"></tbody></table></div>`:'<p class="note">条件に合うデータがないよ</p>'}</div>`;
 if(out.length)knPaint(true)}
window.knSo=k=>{kn.so=k==='t'||k==='def'?k:(kn.so===k+'-'?k+'+':k+'-');kenRes()};
window.knTog=(id,k)=>{const a=kn[id];const i=a.indexOf(k);if(i>=0)a.splice(i,1);else a.push(k);kenPage()};
window.knPer=n=>{const p=kenPer()[n];kn.from=p[0];kn.to=p[1];kenPage()};
window.knAllP=()=>{kn.from='';kn.to='';kenPage()};
window.knDay=v=>{if(!isDate(v))return;kn.from=v;kn.to=v;kn.cm=v.slice(0,7);kenPage()};
window.knCm=n=>{const[y,m]=kn.cm.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+n,1));kn.cm=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');kenPage()};
window.knReset=()=>{kn=KN0();kenPage()};

// ===== 設定 =====
function setPage(){const set=setObj();const ms=[...new Set(S.rows.map(r=>r.m))].sort((a,b)=>a.localeCompare(b,'ja'));
 const al=Object.entries(set.alias).map(([a,b])=>a+'='+b).join('\n');
 $('main').innerHTML=`<div class="card"><h2>⚙️ 機種のタイプとまとめ</h2>
 <div class="tw"><table><tr><th class="l fix">機種</th><th>タイプ</th><th class="l">まとめ名</th></tr>${ms.map((m,i)=>`<tr><td class="l fix" style="max-width:180px;overflow:hidden;text-overflow:ellipsis">${esc(m)}</td><td><select data-m="${i}" class="ty"><option value="N" ${NC.typeOf(m,set)==='N'?'selected':''}>ノーマル</option><option value="AT" ${NC.typeOf(m,set)==='AT'?'selected':''}>AT</option></select></td><td><input data-m="${i}" class="gr" value="${esc(NC.groupOf(m,set))}" style="width:150px;font-size:14px"></td></tr>`).join('')}</table></div>
 <h2 style="margin-top:12px">機種名の言いかえ</h2>
 <textarea id="al">${esc(al)}</textarea>
 <div class="row"><button class="b" onclick="saveSet()">保存して計算し直す</button></div><div id="sv" class="st"></div></div>${tokCard()}`;
 window._ms=ms}
window.saveSet=async()=>{const ms=window._ms,set=setObj();const types={},groups={};
 document.querySelectorAll('.ty').forEach(e=>{const m=ms[e.dataset.m];types[m]=e.value});
 document.querySelectorAll('.gr').forEach(e=>{const m=ms[e.dataset.m];const v=NC.nz(e.value)||m;groups[m]=v});
 const alias={};for(const line of $('al').value.split('\n')){const i=line.indexOf('=');if(i<1)continue;alias[NC.nz(line.slice(0,i))]=NC.nz(line.slice(i+1))}
 const old=S.set;S.set={groups,types,alias};const sv=$('sv');
 try{sv.textContent='計算中…';await new Promise(r=>setTimeout(r,30));
  // 言いかえを今のデータにも反映（重複は削除）
  const ren=S.rows.map(r=>Object.assign({},r,{m:NC.normMachine(r.m,{alias})}));const m=NC.merge([],ren,{alias});
  NRC={};const out=allFiles(m.rows);const n=await saveFiles(out,'設定狙い設定',t=>sv.textContent=t);S.rows=m.rows;refreshAgg(out);
  sv.className='st ok';sv.textContent=`保存したよ（${n}ファイル更新${m.dup?`・重複${m.dup}件削除`:''}）`}
 catch(e){S.set=old;sv.className='st ng';sv.textContent=e.message}};

window.addEventListener('beforeunload',e=>{if(anDirty||zuDirty){e.preventDefault();e.returnValue=''}});
reload();
</script>
</body>
</html>
