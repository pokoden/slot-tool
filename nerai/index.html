  if(lab.includes('回転'))return'回転';

function kbGroups(out,set,base,keyF){const M=new Map();
 for(const x of out){const r=x.r;const k=keyF(r);let a=M.get(k);if(!a)M.set(k,a={k,n:0,G:0,bb:0,rb:0,ok:0,gm:new Map()});

 const L=[];for(const a of M.values()){let ig=0,irb=0,igs=0,w=0,bad=false;
  if(base)for(const b of a.gm.values()){const x=NC.rowIdx({m:b.m,g:b.g/b.n,bb:b.bb/b.n,rb:b.rb/b.n},set,base);if(x.g==null||x.rb==null||x.gs==null){bad=true;continue}ig+=x.g*b.n;irb+=x.rb*b.n;igs+=x.gs*b.n;w+=b.n}
