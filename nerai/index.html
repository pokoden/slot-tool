</style><script>/* r166 共通：全角数字→半角／保存失敗の表示／日ごとの控え／戻る・進む */
(function(){const W=window,L=localStorage;
const z2h=s=>s==null?s:String(s).replace(/[０-９．－＋，]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));W.z2h=z2h;
const fx=e=>{const t=e.target;if(!t||t.tagName!=='INPUT'||(t.type!=='text'&&t.type!=='search'&&t.type!=='tel'))return;const v=t.value;if(!/[０-９．－＋，]/.test(v)||!/^[\s0-9０-９.．\-－+＋,，]*$/.test(v))return;t.value=z2h(v)};
document.addEventListener('input',fx,true);document.addEventListener('change',fx,true);
const R={};W.R166=R;
// ---- 上のバー（戻る・進む）と保存失敗の帯 ----
let top=null,ban=null,ub=null,rb=null;
function mkTop(){if(top)return top;top=document.createElement('div');top.id='r166top';document.body.insertBefore(top,document.body.firstChild);return top}
R.fail=m=>{const f=()=>{if(!ban){ban=document.createElement('div');ban.id='r166fail';(R._bar?mkTop():document.body).appendChild(ban)}ban.textContent='⚠ 保存失敗'+(m?'：'+String(m).replace(/^エラー：/,''):'');ban.style.display=''};document.body?f():addEventListener('DOMContentLoaded',f)};
R.ok=()=>{if(ban)ban.style.display='none'};
// ---- 戻る・進む ----
const U={u:[],r:[],cur:null,k:null,t:null,mute:0,cfg:null};
const snap=s=>{const f=JSON.stringify(s);return{f,c:U.cfg.cmp?U.cfg.cmp(JSON.parse(f)):f}};
function paint(){if(!ub)return;const on=U.cfg&&U.cfg.get()!=null;ub.disabled=!(on&&U.u.length);rb.disabled=!(on&&U.r.length)}
R.urInit=cfg=>{U.cfg=cfg;R._bar=1;const f=()=>{const t=mkTop();const b=document.createElement('div');b.id='r166bar';b.innerHTML='<button type="button" id="r166u">↶戻る</button><button type="button" id="r166r">↷進む</button>';t.insertBefore(b,t.firstChild);ub=b.children[0];rb=b.children[1];ub.onclick=()=>R.undo();rb.onclick=()=>R.redo();if(ban&&ban.parentNode!==t)t.appendChild(ban);paint()};document.body?f():addEventListener('DOMContentLoaded',f)};
R.urNote=()=>{const c=U.cfg;if(!c||U.mute)return;const s=c.get();if(s==null){paint();return}const k=c.key(),n=snap(s);
 if(k!==U.k||!U.cur){U.k=k;U.u=[];U.r=[];U.cur=n;clearTimeout(U.t);U.t=null;paint();return}
 if(n.c===U.cur.c){U.cur=n;return}
 if(!U.t){U.u.push(U.cur);if(U.u.length>50)U.u.shift()}U.r=[];clearTimeout(U.t);U.t=setTimeout(()=>{U.t=null},800);U.cur=n;paint()};
function apply(x){U.mute++;try{U.cfg.set(JSON.parse(x.f))}finally{U.mute--}const s=U.cfg.get();U.cur=s!=null?snap(s):x;clearTimeout(U.t);U.t=null;paint()}
R.undo=()=>{const c=U.cfg;if(!c)return;c.flush&&c.flush();clearTimeout(U.t);U.t=null;if(!U.u.length||c.get()==null)return;const p=U.u.pop();U.r.push(U.cur);apply(p)};
R.redo=()=>{const c=U.cfg;if(!c)return;c.flush&&c.flush();clearTimeout(U.t);U.t=null;if(!U.r.length||c.get()==null)return;const p=U.r.pop();U.u.push(U.cur);apply(p)};
// ---- 日ごとの控え（7日分） ----
const BK='r166bk_',CF={},MAXONE=700000,BUDGET=2500000;
const dS=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const keys=pg=>{const o=[];for(let i=0;i<L.length;i++){const k=L.key(i);if(k&&k.indexOf(BK+(pg?pg+'_':''))===0)o.push(k)}return o};
R.bkReg=(pg,cfg)=>{CF[pg]=cfg};
R.bkDaily=pg=>{try{const c=CF[pg];if(!c)return;const k=BK+pg+'_'+dS();if(L.getItem(k)!=null)return;const d=c.get();if(d==null)return;const s=JSON.stringify(d);if(!s||s.length>MAXONE)return;
  let all=keys(''),tot=all.reduce((a,x)=>a+(L.getItem(x)||'').length,0);all.sort((a,b)=>a.slice(-10)<b.slice(-10)?-1:1);
  while(tot+s.length>BUDGET&&all.length){const x=all.shift();tot-=(L.getItem(x)||'').length;L.removeItem(x)}
  if(tot+s.length>BUDGET)return;try{L.setItem(k,s)}catch(e){return}
  const mine=keys(pg).sort();while(mine.length>7)L.removeItem(mine.shift())}catch(e){}};
R.bkHtml=pg=>{const ds=keys(pg).map(k=>k.slice(-10)).sort().reverse();return`<select id="r166bk" onchange="R166.bkPick('${pg}',this)" style="width:auto"><option value="">復元</option>${ds.map(d=>`<option value="${d}">${+d.slice(5,7)}/${+d.slice(8)}</option>`).join('')}</select>`};
R.bkPick=(pg,el)=>{const d=el.value;el.value='';if(!d)return;const c=CF[pg];if(!c)return;let x=null;try{x=JSON.parse(L.getItem(BK+pg+'_'+d))}catch(e){}if(x==null){alert('控えが読めませんでした');return}
 if(!confirm(+d.slice(5,7)+'/'+(+d.slice(8))+' の状態に戻しますか？'))return;c.restore(x)};
// 控えを今のデータに上書きする時：控えの項目は更新時刻を今にして勝たせる。控えに無い項目は消す（消せる物だけ）
R.bump=(cur,bak,key,del)=>{const now=new Date().toISOString(),kf=key||(x=>x&&x.id),out=[],seen=new Set();for(const x of bak||[]){if(!x)continue;seen.add(kf(x));out.push(Object.assign({},x,{updatedAt:now}))}
 if(del)for(const x of cur||[]){if(!x||seen.has(kf(x))||x.deleted)continue;out.push(Object.assign({},x,{deleted:true,updatedAt:now}))}return out};
})();

<script>

const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const API='https://api.github.com/repos/pokoden/slot-data/';

// 状態

const S={an:{v:1,border:{},marks:{}},loaded:false,loadErr:'',files:{},rows:[],set:{groups:{},types:{},alias:null},agg:{},pending:null};
let KNOWN=null,KNOWN_R=null;const knownM=()=>{if(KNOWN_R!==S.rows){const k=new Set();for(const r of S.rows||[])k.add(r.m);const a=S.set.alias||NC.DEF_ALIAS;for(const x in a)if(a[x])k.add(a[x]);KNOWN=[...k];KNOWN_R=S.rows}return KNOWN};
let KST=null,KST_R=null;const knownS=()=>{if(KST_R!==S.rows){KST=[...new Set((S.rows||[]).map(r=>r.s))];KST_R=S.rows}return KST};
const setObj=()=>({groups:S.set.groups||{},types:S.set.types||{},alias:S.set.alias||NC.DEF_ALIAS,known:knownM(),stores:knownS()});

function b64dec(b){const bin=atob(b.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}

async function loadAll(){NRC={};S.loaded=false;S.loadErr='';S.files={};S.rows=[];S.agg={};
 if(!tok()){S.loadErr='この画面にはGitHubトークンが入ってないよ。下の欄に、スロ判別ツールと同じトークンを入れてね。';S.needTok=true;return}
 S.needTok=false;const why=st=>st===401?'トークンが違うか期限切れみたい（401）':st===403?'トークンに slot-data の読み書き権限がないか、回数制限（403）':st===404?'slot-data が見えない（404）。トークンの対象リポジトリを確認してね':'通信エラー（'+st+'）';
 const r=await gh('contents/nerai'); if(!r.ok){if(r.status===401||r.status===404)S.needTok=true;throw new Error('一覧の読み込みに失敗：'+why(r.status))}
 const all=(await r.json()).filter(f=>f.type==='file');const list=all.filter(f=>/\.json$/.test(f.name));
 for(const f of all)if(!/\.json$/.test(f.name))S.files['nerai/'+f.name]={sha:f.sha,txt:null};
 // iPhoneで重くならないよう3つずつ読む。失敗したら1回だけやり直す
 let done=0;const q=[...list];const one=async f=>{let b;for(let t=0;t<2;t++){try{b=await gh('git/blobs/'+f.sha);if(b.ok)break}catch(e){b=null}}

  const txt=b64dec((await b.json()).content);JSON.parse(txt);S.files['nerai/'+f.name]={sha:f.sha,txt};done++;const m=$('main');if(m&&!S.loaded)m.innerHTML=`<div class="card">読み込み中… ${done}/${list.length}</div>`};
 await Promise.all([0,1,2].map(async()=>{while(q.length)await one(q.shift())}));

const PC0=()=>({from:'',to:'',s:'',g:'',ty:1,rk:1,so:{}});let pc=Object.assign(PC0(),LS.get('nr_pc',{}));if(!pc.so||typeof pc.so!=='object')pc.so={};if(![1,2,3].includes(+pc.rk))pc.rk=1;const pcMore=new Set();
window.pcSoT=(id,c)=>{const o=pc.so[id];const lowGood=c==='pb'||c==='pr'||c==='ps';pc.so[id]=o&&o.c===c?{c,up:o.up?0:1}:{c,up:c==='k'?1:lowGood?1:0};LS.set('nr_pc',pc);const y=scrollY;pcRes();scrollTo(0,y)};
window.pcTgl=id=>{pcMore.has(id)?pcMore.delete(id):pcMore.add(id);const y=scrollY;pcRes();scrollTo(0,y)};
const ymOf=(y,m)=>{const t=new Date(Date.UTC(y,m,1));return t.toISOString().slice(0,7)};
const mEnd=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10)};
// チェックする月 ym の分析期間。分析が「1日〜月末」ならその月数、手入力の日付ならその日数、全期間なら前月末までの全部
function pcWin(ym,first){const P=anPer();const st=ym+'-01',pv=NC.addDay(st,-1);const[y,m]=ym.split('-').map(Number);
 if(!P.from&&!P.to)return[first,pv];
 const f=P.from||first,t=P.to||pv;
 if(/-01$/.test(f)&&t===mEnd(t.slice(0,7))){const n=(+t.slice(0,4)*12+ +t.slice(5,7))-(+f.slice(0,4)*12+ +f.slice(5,7))+1;return[ymOf(y,m-1-n)+'-01',pv]}
 const len=Math.round((Date.parse(t)-Date.parse(f))/864e5)+1;return[NC.addDay(st,-len),pv]}
const PCD=new Map();// 日ごとの狙い（分析期間・設定が同じなら使い回す）
function pcDay(d,stores,R,set,first){const ym=d.slice(0,7);const[from,to]=pcWin(ym,first);const B=bord(),cfg=nerCfg();
 const key=[d,from,to,JSON.stringify(B),JSON.stringify(cfg),JSON.stringify(S.an.marks||{}),R.length].join('~');let v=PCD.get(key);if(v)return v;
 const base=NC.stdBaseAt(R,set,to);const T=[],HD=new Map();
 for(const s of stores){const day=NC.storeHas(R,s,d)?R.filter(r=>r.s===s&&r.d===d):null;if(!day)continue;
  let f=from;if(f<'1')f=first;const rk=((S.agg[ym]||{}).ranks||{})[d]||{};
  const L=NC.neraiList(R,set,base,allRanks(),{store:s,date:d,members:day,tRanks:rk,from:f,to,border:B,marks:S.an.marks||{},cfg,hasPrev:NC.storeHas(R,s,NC.addDay(d,-1)),memo:true});
  for(const x of L.targets||[])T.push(x);for(const r of day)HD.set(s+'|'+r.t,r)}
 rankT(T);v={T:T.filter(x=>x.r3&&x.seat!=null).map(x=>({s:x.s,g:x.g,seat:x.seat,r3:x.r3})),HD};if(PCD.size>400)PCD.clear();PCD.set(key,v);return v}
function pcRun(){const R=S.rows,set=setObj();const stores=[...new Set(R.map(r=>r.s))].sort(storeCmp);
 let lo='9',hi='0';for(const r of R){if(r.d<lo)lo=r.d;if(r.d>hi)hi=r.d}const from=pc.from||lo,to=pc.to||hi;
 const days=[...new Set(R.filter(r=>r.d>=from&&r.d<=to).map(r=>r.d))].filter(d=>d.slice(0,7)>lo.slice(0,7)).sort();
 const ix=(+pc.ty||1)-1,N=+pc.rk||1;const out=[];
 for(const d of days){const D=pcDay(d,stores,R,set,lo);for(const x of D.T){if(x.r3[ix]!==N)continue;if(pc.s&&x.s!==pc.s)continue;if(pc.g&&x.g!==pc.g)continue;const r=D.HD.get(x.s+'|'+x.seat);if(r)out.push({r})}}
 return out}

(function(){const T=`添付の動画またはスクショは、パチスロのデータサイトの画面です。画面に出てくる台のデータを読み取って、表にしてください。

【読み取る日】今日は{TODAY}です。店名の横の「当日」「〇日前」の表示を見て、次の日の画面だけ読み取る。それ以外の日の画面は無視する。日付の列には、その画面の日付を書く。
{DAYS}

【読み取る項目】
・日付：上の対応表の日付（YYYY-MM-DD）
・店名：画面左上の店名
・機種名：画面上部のタイトル。「…」で切れていたら読めたところまで
・台番：「0451番台」なら451
・G：「通常中スタート」の数字
・BB、RB：数字そのまま

【ルール】
・ART、合成確率は書かない
・同じ日・同じ機種・同じ台番は1行だけ（スクロールで重なった台は1回）
・「20円スロット」の台だけ書く。「ライトスロット」など他の区分は書かない
・読めない数字は推測せず「?」
・説明や前置き、まとめは一切書かない

【出力形式】
・タブ区切り（TSV）。カンマは使わない
・全体を1つのコードブロックに入れて、そのままコピーできるようにする
・1行目は見出し：日付\t店名\t機種名\t台番\tG\tBB\tRB
・数字に「,」や単位を付けない
・長くて1回で出し切れない時は、行の途中で切らずキリのいい行で止めて最後に「続く」とだけ書く。「続き」と言われたら見出しなしで次の行から出す`;
let sel;try{sel=JSON.parse(localStorage.getItem('gpDays'))}catch(e){}if(!Array.isArray(sel))sel=[];sel=sel.filter(x=>Number.isInteger(x)&&x>=0&&x<7);if(!sel.length)sel=[1];
const lb=o=>o?o+'日前':'当日',p2=n=>String(n).padStart(2,'0');
window.gpRender=render;function render(){const d=document.getElementById('gpd');if(!d)return;d.innerHTML='';for(let o=0;o<7;o++){const b=document.createElement('button');b.textContent=lb(o);const on=sel.includes(o);b.style.cssText='font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid #1f5fd6;'+(on?'background:#1f5fd6;color:#fff':'background:#fff;color:#1f5fd6');b.onclick=()=>{sel=on?sel.filter(x=>x!==o):[...sel,o].sort((a,b)=>a-b);localStorage.setItem('gpDays',JSON.stringify(sel));render()};d.appendChild(b)}
const n=new Date(),td=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';const days=sel.map(o=>{const x=new Date(n.getFullYear(),n.getMonth(),n.getDate()-o);return '・'+lb(o)+'＝'+x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate())}).join('\n');
document.getElementById('gpt').value=T.replace('{TODAY}',td).replace('{DAYS}',days)}
window.gpCopy=async()=>{const t=document.getElementById('gpt'),b=document.getElementById('gpb');render();let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){}if(!ok){t.focus();t.select();t.setSelectionRange(0,t.value.length);try{ok=document.execCommand('copy')}catch(e){}}if(ok){b.textContent='コピー済';setTimeout(()=>b.textContent='コピー',1500)}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);else render()})();
