<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スロ台データ集計</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 12px; background: #f5f5f5; color: #222; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  textarea { width: 100%; height: 140px; font-family: ui-monospace, monospace; font-size: 13px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  button, select, input[type=date], input[type=password] { font-size: 14px; padding: 8px 12px; margin: 4px 4px 4px 0; border-radius: 6px; border: 1px solid #bbb; background: #fff; }
  button.primary { background: #1a73e8; color: #fff; border: none; }
  button.danger { background: #d93025; color: #fff; border: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { border-bottom: 1px solid #eee; padding: 6px 4px; text-align: right; }
  th { background: #fafafa; text-align: center; position: sticky; top: 0; }
  td.left, th.left { text-align: left; }
  .bad { background: #fce8e6; }
  .good { background: #e6f4ea; }
  .rank { font-weight: bold; color: #d93025; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
  .small { font-size: 12px; color: #666; }
  #status { margin: 6px 0; font-weight: bold; }
</style>
</head>
<body>
<h1>スロ台データ集計</h1>

<div class="card">
  <div class="small">GitHub同期（複数端末で同じデータを見るために必要）</div>
  <input type="password" id="token" placeholder="GitHub Personal Access Token" style="width:100%; max-width:400px;">
  <div>
    <button onclick="saveToken()">トークンを保存</button>
    <button class="primary" onclick="loadFromGitHub()">GitHubから読み込む</button>
    <button onclick="saveToGitHub()">GitHubに保存</button>
  </div>
  <div class="small">トークンはブラウザ内にだけ保存されます。repo権限のPATを作ってください。</div>
</div>

<div class="card">
  <div class="small">TSVを貼り付け（日付	店舗	機種	台番	スタート	BB	RB）</div>
  <textarea id="paste" placeholder="2026/10/16	マルハン青森柏店	SネオアイムジャグラーEXKK	321	3776	15	8
..."></textarea>
  <div>
    <button class="primary" onclick="importTSV()">貼り付けデータを取り込む</button>
    <button onclick="exportCSV()">CSV書き出し</button>
    <button class="danger" onclick="clearAll()">全データ削除</button>
  </div>
  <div id="status"></div>
</div>

<div class="card">
  <div class="controls">
    <label>店舗 <select id="storeSel" onchange="render()"></select></label>
    <label>機種 <select id="machineSel" onchange="render()"></select></label>
    <label>日付 <input type="date" id="dateSel" onchange="render()"></label>
    <label>並び 
      <select id="sortSel" onchange="render()">
        <option value="tai">台番</option>
        <option value="start_asc">スタート少ない順</option>
        <option value="gassan_asc">合算悪い順</option>
        <option value="gassan_desc">合算良い順</option>
      </select>
    </label>
  </div>
  <div id="tableWrap"></div>
</div>

<div class="card">
  <h3 style="margin-top:0;">期間集計（合算が一番悪かった台の合計）</h3>
  <div class="controls">
    <label>開始 <input type="date" id="fromDate"></label>
    <label>終了 <input type="date" id="toDate"></label>
    <button class="primary" onclick="calcPeriod()">計算</button>
  </div>
  <div id="periodResult"></div>
</div>

<script>
const STORAGE_KEY = "slot_dai_data_v1";
const TOKEN_KEY = "slot_github_token";
const OWNER = "pokoden";
const REPO = "slot-tool";
const DATA_PATH = "dai/data.json";
let data = [];
let dataSha = null;

function loadLocal() {
  try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch(e) { data = []; }
}
function saveLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getToken() {
  return localStorage.getItem(TOKEN_KEY) || "";
}
function saveToken() {
  const t = document.getElementById("token").value.trim();
  if (!t) return setStatus("トークンを入力してください");
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById("token").value = "";
  setStatus("トークンを保存しました");
}

async function ghApi(path, method = "GET", body = null) {
  const token = getToken();
  if (!token) throw new Error("トークンが未設定です");
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
    method,
    headers: {
      "Authorization": `token ${token}`,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: body ? JSON.stringify(body) : null
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`GitHub API error ${res.status}: ${err}`);
  }
  return res.json();
}

async function loadFromGitHub() {
  try {
    setStatus("読み込み中...");
    const file = await ghApi(DATA_PATH);
    dataSha = file.sha;
    const text = atob(file.content.replace(/\n/g, ""));
    data = JSON.parse(text);
    saveLocal();
    refreshFilters();
    render();
    setStatus(`GitHubから読み込みました（${data.length}件）`);
  } catch (e) {
    if (e.message.includes("404")) {
      setStatus("data.jsonがまだありません。データを取り込んで保存してください");
    } else {
      setStatus("読み込みエラー: " + e.message);
    }
  }
}

async function saveToGitHub() {
  try {
    setStatus("保存中...");
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = {
      message: "Update slot data.json",
      content,
      branch: "main"
    };
    if (dataSha) body.sha = dataSha;
    const res = await ghApi(DATA_PATH, "PUT", body);
    dataSha = res.content.sha;
    setStatus("GitHubに保存しました");
  } catch (e) {
    setStatus("保存エラー: " + e.message);
  }
}

function parseLine(line) {
  const p = line.split("\t").map(s => s.trim());
  if (p.length < 7) return null;
  const start = parseInt(p[4], 10);
  const bb = parseInt(p[5], 10);
  const rb = parseInt(p[6], 10);
  if (isNaN(start)) return null;
  return {
    date: p[0],
    store: p[1].replace(/店$/, ""),
    machine: p[2],
    tai: p[3],
    start, bb, rb
  };
}

async function importTSV() {
  const text = document.getElementById("paste").value.trim();
  if (!text) { setStatus("データが空です"); return; }
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  let added = 0, updated = 0;
  lines.forEach(line => {
    const row = parseLine(line);
    if (!row) return;
    const idx = data.findIndex(d => d.date === row.date && d.store === row.store && d.machine === row.machine && d.tai === row.tai);
    if (idx >= 0) { data[idx] = row; updated++; }
    else { data.push(row); added++; }
  });
  saveLocal();
  document.getElementById("paste").value = "";
  setStatus(`取り込み完了：新規 ${added}件 / 上書き ${updated}件`);
  refreshFilters();
  render();
  if (getToken()) await saveToGitHub();
}

function gassan(row) {
  const total = row.bb + row.rb;
  return total > 0 ? (row.start / total).toFixed(1) : "-";
}
function gassanNum(row) {
  const total = row.bb + row.rb;
  return total > 0 ? row.start / total : 99999;
}

function refreshFilters() {
  const stores = [...new Set(data.map(d => d.store))].sort();
  const machines = [...new Set(data.map(d => d.machine))].sort();
  const storeSel = document.getElementById("storeSel");
  const machineSel = document.getElementById("machineSel");
  const dateSel = document.getElementById("dateSel");
  storeSel.innerHTML = '<option value="">すべて</option>' + stores.map(s => `<option>${s}</option>`).join("");
  machineSel.innerHTML = '<option value="">すべて</option>' + machines.map(s => `<option>${s}</option>`).join("");
  if (data.length) {
    const latest = data.map(d => d.date).sort().pop();
    dateSel.value = latest.replace(/\//g, "-");
  }
}

function render() {
  const store = document.getElementById("storeSel").value;
  const machine = document.getElementById("machineSel").value;
  const date = document.getElementById("dateSel").value.replace(/-/g, "/");
  const sort = document.getElementById("sortSel").value;

  let rows = data.filter(d => 
    (!store || d.store === store) &&
    (!machine || d.machine === machine) &&
    (!date || d.date === date)
  );

  if (sort === "start_asc") rows.sort((a,b) => a.start - b.start);
  else if (sort === "gassan_asc") rows.sort((a,b) => gassanNum(a) - gassanNum(b));
  else if (sort === "gassan_desc") rows.sort((a,b) => gassanNum(b) - gassanNum(a));
  else rows.sort((a,b) => a.tai.localeCompare(b.tai, undefined, {numeric:true}));

  let html = `<table><thead><tr>
    <th>順位</th><th class="left">台番</th><th class="left">機種</th><th>スタート</th><th>BB</th><th>RB</th><th>合算</th>
  </tr></thead><tbody>`;

  rows.forEach((r, i) => {
    const g = gassan(r);
    const gn = gassanNum(r);
    let cls = "";
    if (gn < 150) cls = "good";
    else if (gn > 250) cls = "bad";
    const rank = (sort === "start_asc" || sort === "gassan_asc") ? i+1 : "";
    html += `<tr class="${cls}">
      <td class="rank">${rank}</td>
      <td class="left">${r.tai}</td>
      <td class="left">${r.machine}</td>
      <td>${r.start}</td><td>${r.bb}</td><td>${r.rb}</td><td>${g}</td>
    </tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("tableWrap").innerHTML = rows.length ? html : "<div class='small'>該当データなし</div>";
}

function calcPeriod() {
  const from = document.getElementById("fromDate").value.replace(/-/g, "/");
  const to = document.getElementById("toDate").value.replace(/-/g, "/");
  if (!from || !to) { document.getElementById("periodResult").innerHTML = "期間を指定してください"; return; }

  const period = data.filter(d => d.date >= from && d.date <= to);
  if (!period.length) { document.getElementById("periodResult").innerHTML = "該当データなし"; return; }

  const byDayMachine = {};
  period.forEach(d => {
    const key = d.date + "|" + d.machine;
    if (!byDayMachine[key]) byDayMachine[key] = [];
    byDayMachine[key].push(d);
  });

  const worstPerDay = [];
  Object.values(byDayMachine).forEach(list => {
    list.sort((a,b) => gassanNum(a) - gassanNum(b));
    if (list.length) worstPerDay.push(list[0]);
  });

  let totalStart = 0, totalBB = 0, totalRB = 0;
  worstPerDay.forEach(w => {
    totalStart += w.start;
    totalBB += w.bb;
    totalRB += w.rb;
  });
  const totalG = totalBB + totalRB;
  const avgGassan = totalG > 0 ? (totalStart / totalG).toFixed(1) : "-";

  document.getElementById("periodResult").innerHTML = `
    <p>対象日数：${new Set(worstPerDay.map(w=>w.date)).size}日 / 最悪台件数：${worstPerDay.length}</p>
    <p>合計スタート：${totalStart.toLocaleString()}　BB：${totalBB}　RB：${totalRB}　合計合算：${avgGassan}</p>
    <div class="small">各日・各機種で合算が一番悪かった台を集計しています。</div>
  `;
}

function exportCSV() {
  if (!data.length) return alert("データがありません");
  const header = "日付,店舗,機種,台番,スタート,BB,RB\n";
  const body = data.map(d => `${d.date},${d.store},${d.machine},${d.tai},${d.start},${d.bb},${d.rb}`).join("\n");
  const blob = new Blob([header + body], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "slot_dai_data.csv";
  a.click();
}

async function clearAll() {
  if (!confirm("全データを削除しますか？")) return;
  data = [];
  saveLocal();
  refreshFilters();
  render();
  setStatus("削除しました");
  if (getToken()) await saveToGitHub();
}

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

loadLocal();
refreshFilters();
render();
if (getToken()) loadFromGitHub();
</script>
</body>
</html>
