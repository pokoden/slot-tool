<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スロ台データ集計</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; padding: 16px; background: #f0f2f5; color: #1a1a1a; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  textarea { width: 100%; height: 120px; font-family: ui-monospace, monospace; font-size: 13px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
  input, select, button { font-size: 15px; padding: 10px 14px; margin: 4px 4px 4px 0; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
  button { cursor: pointer; font-weight: 600; }
  button.primary { background: #0066ff; color: #fff; border: none; }
  button.danger { background: #e53e3e; color: #fff; border: none; }
  button.secondary { background: #edf2f7; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid #eee; }
  th { background: #f8fafc; text-align: center; position: sticky; top: 0; }
  td.left, th.left { text-align: left; }
  .bad { background: #fff5f5; }
  .good { background: #f0fff4; }
  .rank { font-weight: bold; color: #c53030; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  .small { font-size: 13px; color: #666; margin-top: 6px; }
  #status { margin: 8px 0; font-weight: 600; color: #2b6cb0; }
</style>
</head>
<body>
<h1>スロ台データ集計</h1>

<div class="card">
  <div class="small">GitHub同期（月別ファイルで保存）</div>
  <div class="row">
    <input type="password" id="token" placeholder="GitHubトークン" style="flex:1; min-width:200px;">
    <button onclick="saveToken()">保存</button>
    <button class="primary" onclick="loadCurrentMonth()">今月を読む</button>
  </div>
</div>

<div class="card">
  <div class="small">TSVを貼り付け（日付　店舗　機種　台番　スタート　BB　RB）</div>
  <textarea id="paste" placeholder="2026/10/16	マルハン青森柏店	SネオアイムジャグラーEXKK	321	3776	15	8"></textarea>
  <div class="row">
    <button class="primary" onclick="importTSV()">取り込む</button>
    <button class="secondary" onclick="exportCSV()">CSV書き出し</button>
    <button class="danger" onclick="clearAll()">全削除</button>
  </div>
  <div id="status"></div>
</div>

<div class="card">
  <div class="row">
    <label>店舗 <select id="storeSel" onchange="render()"></select></label>
    <label>機種 <select id="machineSel" onchange="render()"></select></label>
    <label>日付 <input type="date" id="dateSel" onchange="render()"></label>
    <label>並び
      <select id="sortSel" onchange="render()">
        <option value="tai">台番</option>
        <option value="start_asc">スタート少</option>
        <option value="gassan_asc">合算悪</option>
        <option value="gassan_desc">合算良</option>
      </select>
    </label>
  </div>
  <div id="tableWrap"></div>
</div>

<div class="card">
  <h3 style="margin-top:0;">期間集計</h3>
  <div class="row">
    <label>開始 <input type="date" id="fromDate"></label>
    <label>終了 <input type="date" id="toDate"></label>
    <button class="primary" onclick="calcPeriod()">計算</button>
  </div>
  <div id="periodResult"></div>
</div>

<script>
const TOKEN_KEY = "slot_github_token";
const OWNER = "pokoden";
const REPO = "slot-data";
let data = [];
let monthShas = {};

function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
function saveToken() {
  const t = document.getElementById("token").value.trim();
  if (!t) return setStatus("トークンを入力");
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById("token").value = "";
  setStatus("トークン保存しました");
}
function monthOf(d) { return d.replace(/\//g, "-").slice(0, 7); }
function setStatus(msg) { document.getElementById("status").textContent = msg; }

async function ghGet(path) {
  const token = getToken();
  if (!token) throw new Error("トークンなし");
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
    headers: { Authorization: "token " + token, Accept: "application/vnd.github+json" }
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function ghPut(path, content, sha) {
  const token = getToken();
  const body = { message: "Update " + path, content: btoa(unescape(encodeURIComponent(content))), branch: "main" };
  if (sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
    method: "PUT",
    headers: { Authorization: "token " + token, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function loadMonth(ym) {
  const file = await ghGet(ym + ".json");
  if (!file) return [];
  monthShas[ym] = file.sha;
  const decoded = decodeURIComponent(escape(atob(file.content.replace(/\n/g, ""))));
  return JSON.parse(decoded);
}
async function saveMonth(ym, rows) {
  const res = await ghPut(ym + ".json", JSON.stringify(rows, null, 2), monthShas[ym]);
  monthShas[ym] = res.content.sha;
}
async function loadCurrentMonth() {
  const ym = new Date().toISOString().slice(0, 7);
  try {
    setStatus(ym + " 読み込み中...");
    const rows = await loadMonth(ym);
    data = data.filter(d => monthOf(d.date) !== ym).concat(rows);
    refreshFilters();
    render();
    setStatus(ym + " 読み込み完了（" + rows.length + "件）");
  } catch (e) { setStatus("エラー: " + e.message); }
}
async function importTSV() {
  const text = document.getElementById("paste").value.trim();
  if (!text) return setStatus("データが空です");
  const byMonth = {};
  text.split(/\r?\n/).forEach(line => {
    const p = line.split("\t").map(s => s.trim());
    if (p.length < 7) return;
    const start = parseInt(p[4], 10);
    if (isNaN(start)) return;
    const row = { date: p[0], store: p[1].replace(/店$/, ""), machine: p[2], tai: p[3], start, bb: +p[5], rb: +p[6] };
    const ym = monthOf(row.date);
    (byMonth[ym] ||= []).push(row);
  });
  for (const ym of Object.keys(byMonth)) {
    let existing = await loadMonth(ym);
    byMonth[ym].forEach(nr => {
      const i = existing.findIndex(d => d.date === nr.date && d.store === nr.store && d.machine === nr.machine && d.tai === nr.tai);
      if (i >= 0) existing[i] = nr; else existing.push(nr);
    });
    await saveMonth(ym, existing);
    data = data.filter(d => monthOf(d.date) !== ym).concat(existing);
  }
  document.getElementById("paste").value = "";
  setStatus("取り込み完了");
  refreshFilters();
  render();
}
function gassan(r) { const t = r.bb + r.rb; return t > 0 ? (r.start / t).toFixed(1) : "-"; }
function gassanNum(r) { const t = r.bb + r.rb; return t > 0 ? r.start / t : 99999; }
function refreshFilters() {
  const stores = [...new Set(data.map(d => d.store))].sort();
  const machines = [...new Set(data.map(d => d.machine))].sort();
  document.getElementById("storeSel").innerHTML = '<option value="">すべて</option>' + stores.map(s => `<option>${s}</option>`).join("");
  document.getElementById("machineSel").innerHTML = '<option value="">すべて</option>' + machines.map(s => `<option>${s}</option>`).join("");
}
function render() {
  const store = document.getElementById("storeSel").value;
  const machine = document.getElementById("machineSel").value;
  const date = document.getElementById("dateSel").value.replace(/-/g, "/");
  const sort = document.getElementById("sortSel").value;
  let rows = data.filter(d => (!store || d.store === store) && (!machine || d.machine === machine) && (!date || d.date === date));
  if (sort === "start_asc") rows.sort((a,b) => a.start - b.start);
  else if (sort === "gassan_asc") rows.sort((a,b) => gassanNum(a) - gassanNum(b));
  else if (sort === "gassan_desc") rows.sort((a,b) => gassanNum(b) - gassanNum(a));
  else rows.sort((a,b) => a.tai.localeCompare(b.tai, undefined, {numeric:true}));
  let html = `<table><thead><tr><th>順位</th><th class="left">台番</th><th class="left">機種</th><th>スタート</th><th>BB</th><th>RB</th><th>合算</th></tr></thead><tbody>`;
  rows.forEach((r, i) => {
    const g = gassan(r), gn = gassanNum(r);
    const cls = gn < 150 ? "good" : gn > 250 ? "bad" : "";
    const rank = (sort === "start_asc" || sort === "gassan_asc") ? i + 1 : "";
    html += `<tr class="${cls}"><td class="rank">${rank}</td><td class="left">${r.tai}</td><td class="left">${r.machine}</td><td>${r.start}</td><td>${r.bb}</td><td>${r.rb}</td><td>${g}</td></tr>`;
  });
  html += "</tbody></table>";
  document.getElementById("tableWrap").innerHTML = rows.length ? html : "<div class='small'>該当なし</div>";
}
function calcPeriod() {
  const from = document.getElementById("fromDate").value.replace(/-/g, "/");
  const to = document.getElementById("toDate").value.replace(/-/g, "/");
  if (!from || !to) return document.getElementById("periodResult").innerHTML = "期間を指定してください";
  const period = data.filter(d => d.date >= from && d.date <= to);
  if (!period.length) return document.getElementById("periodResult").innerHTML = "該当なし";
  const by = {};
  period.forEach(d => { (by[d.date + "|" + d.machine] ||= []).push(d); });
  const worst = [];
  Object.values(by).forEach(list => { list.sort((a,b) => gassanNum(a) - gassanNum(b)); if (list.length) worst.push(list[0]); });
  let ts = 0, tb = 0, tr = 0;
  worst.forEach(w => { ts += w.start; tb += w.bb; tr += w.rb; });
  const g = (tb + tr) > 0 ? (ts / (tb + tr)).toFixed(1) : "-";
  document.getElementById("periodResult").innerHTML = `<p>対象 ${new Set(worst.map(w => w.date)).size}日 / 最悪台 ${worst.length}件</p><p>合計スタート ${ts.toLocaleString()}　BB ${tb}　RB ${tr}　合算 ${g}</p>`;
}
function exportCSV() {
  if (!data.length) return alert("データなし");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["日付,店舗,機種,台番,スタート,BB,RB\n" + data.map(d => `${d.date},${d.store},${d.machine},${d.tai},${d.start},${d.bb},${d.rb}`).join("\n")], { type: "text/csv" }));
  a.download = "slot_dai.csv";
  a.click();
}
async function clearAll() {
  if (!confirm("全データ削除しますか？")) return;
  data = [];
  refreshFilters();
  render();
  setStatus("削除しました");
}
refreshFilters();
render();
</script>
</body>
</html>
