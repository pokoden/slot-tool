<div id="top"><h1>🌳 家系図</h1><input id="q" type="search" placeholder="名前で検索" autocomplete="off"><button class="ib" onclick="openList()">一覧</button><button class="ib" onclick="fitAll()">全体</button><button class="ib" onclick="openSet()">⚙</button></div>

<script>
// ===== データは非公開リポジトリ pokoden/slot-data の kakeizu.json だけに保存。このページ（公開）にはデータを入れない =====
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOK='v2_token',DK='kz_data',REPO='https://api.github.com/repos/pokoden/slot-data/contents/kakeizu.json',LOCAL=location.protocol==='file:';
const now=()=>new Date().toISOString(),nid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let D=LS.get(DK,null)||{version:1,people:[],unions:[],meta:{}};let col=new Set(LS.get('kz_col',[]));
const hasTok=()=>!!LS.get(TOK,'');
// ---- 基本 ----
const P=()=>D.people.filter(p=>!p.deleted),byId=new Map();function idx(){byId.clear();for(const p of P())byId.set(p.id,p)}
const U=()=>D.unions.filter(u=>!u.deleted&&byId.has(u.a)&&byId.has(u.b));

const parents=p=>[p.father,p.mother].filter(x=>x&&byId.has(x));
const parentsB=p=>[p.fatherRel==='step'?null:p.father,p.motherRel==='step'?null:p.mother].filter(x=>x&&byId.has(x));
const RELN={bio:'実',step:'継',adopt:'養'};
const BO=['','長','次','三','四','五','六','七','八','九','十'];const boTxt=p=>{const o=p.bo;if(!o)return'';if(o==='last')return'末っ子';if(o==='only')return'一人っ子';if(o==='unk')return'';return(BO[+o]||(+o+'番目の'))+(p.sex==='f'?'女':p.sex==='m'?'男':'子')};
const kids=id=>P().filter(c=>c.father===id||c.mother===id).sort(bsort);
function bsort(a,b){const ka=x=>x.bo==='only'?0:x.bo==='last'?999:(+x.bo>0?+x.bo:null),A=ka(a),B=ka(b);if(A!=null&&B!=null&&A!==B)return A-B;const x=a.birth||'9999',y=b.birth||'9999';return x<y?-1:x>y?1:(a.order||0)-(b.order||0)||String(a.at||'').localeCompare(String(b.at||''))}
const isDead=p=>!!(p&&(p.dead||p.death)),nm=p=>p?(String(p.name||'').trim()||'不明'):'不明';
function save(){D.meta.updatedAt=now();LS.set(DK,D);syncSoon()}
function touch(p){p.updatedAt=now()}
// ---- 年齢 ----
const pd=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?{y:+m[1],m:+m[2],d:+m[3]}:null};
function ageAt(b,e){const x=pd(b);if(!x)return null;const t=e?pd(e):(()=>{const n=new Date();return{y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate()}})();if(!t)return null;let a=t.y-x.y;if(t.m<x.m||(t.m===x.m&&t.d<x.d))a--;return a}
const jd=s=>{const x=pd(s);return x?`${x.y}年${x.m}月${x.d}日`:''};
// ---- 続柄（「自分」から見て） ----
function ups(id){const m=new Map([[id,{d:0,via:null}]]),q=[id];while(q.length){const c=q.shift(),o=m.get(c),p=byId.get(c);if(!p||o.d>8)continue;for(const x of parentsB(p))if(!m.has(x)){m.set(x,{d:o.d+1,via:o.d===0?x:o.via});q.push(x)}}return m}
function blood(me,t){if(me===t)return'自分';const A=ups(me),B=ups(t);let best=null;for(const [k,a] of A){const b=B.get(k);if(b&&(!best||a.d+b.d<best.a.d+best.b.d))best={k,a,b}}if(!best)return null;
 const a=best.a.d,b=best.b.d,T=byId.get(t),M=byId.get(me),sx=T.sex,via=best.a.via?byId.get(best.a.via):null,side=via?(via.id===M.father?'父方の':via.id===M.mother?'母方の':''):'';const g=(m,f,u)=>sx==='m'?m:sx==='f'?f:u;
 const older=()=>T.birth&&M.birth?T.birth<M.birth:null;
 if(b===0){if(a===1)return g('父','母','親');if(a===2)return side+g('祖父','祖母','祖父母');if(a===3)return side+g('曾祖父','曾祖母','曾祖父母');if(a===4)return side+g('高祖父','高祖母','高祖父母');return a+'代前の先祖'}
 if(a===0){return['',g('息子','娘','子'),'孫','ひ孫','玄孫'][b]||b+'代下の子孫'}
 if(a===1&&b===1){const sh=parentsB(T).filter(x=>parentsB(M).includes(x)).length;const o=older();const w=o==null?g('兄弟','姉妹','きょうだい'):o?g('兄','姉','きょうだい'):g('弟','妹','きょうだい');if(sh===1&&parentsB(T).length===2&&parentsB(M).length===2){const c=parentsB(T).find(x=>parentsB(M).includes(x));return(c===M.father?'異母':'異父')+w}return w}
 if(a===2&&b===1)return side+g('おじ','おば','おじ・おば');if(a===1&&b===2)return g('甥','姪','甥・姪');if(a===2&&b===2)return side+'いとこ';
 if(a===3&&b===1)return side+g('大おじ','大おば','大おじ・大おば');if(a===1&&b===3)return'甥・姪の子';if(a===2&&b===3)return'いとこの子';if(a===3&&b===2)return side+'親のいとこ';if(a===3&&b===3)return side+'はとこ';
 return(a+b)+'親等の親戚'}
function relOf(t){const me=D.meta.self;if(!me||!byId.has(me)||!byId.has(t))return'';const T=byId.get(t);if(T.relOv&&T.relOvSelf===me)return T.relOv;return relAuto(t)}
function relAuto(t){const me=D.meta.self;if(!me||!byId.has(me)||!byId.has(t))return'';const T=byId.get(t),M=byId.get(me),g=(m,f,u)=>T.sex==='m'?m:T.sex==='f'?f:u;
 if(t===M.father||t===M.mother){const rl=t===M.father?M.fatherRel:M.motherRel,b=t===M.father?'父':'母';return rl==='step'?'継'+b:rl==='adopt'?'養'+b:b}
 if(T.father===me||T.mother===me){const rl=T.father===me?T.fatherRel:T.motherRel;if(rl==='step')return g('継息子','継娘','継子');if(rl==='adopt')return g('養子','養女','養子')}
 let r=blood(me,t);if(r)return r;
 if(spouses(me).includes(t))return g('夫','妻','配偶者');
 for(const s of spouses(me)){const x=blood(s,t);if(x){const mp={'父':'義父','母':'義母','兄':'義兄','弟':'義弟','姉':'義姉','妹':'義妹','兄弟':'義兄弟','姉妹':'義姉妹','祖父':'義祖父','祖母':'義祖母'};return mp[x]||'配偶者の'+x}}
 for(const s of spouses(t)){const x=blood(me,s);if(x){const mp={'息子':'義理の娘（嫁）','娘':'義理の息子（婿）','兄':'義姉','弟':'義妹','姉':'義兄','妹':'義弟','兄弟':'義理のきょうだい','姉妹':'義理のきょうだい','父':(M.mother?'継母':'父の配偶者（母の欄が未設定）'),'母':(M.father?'継父':'母の配偶者（父の欄が未設定）')};if(mp[x]&&((x==='兄'||x==='弟')?T.sex!=='m':(x==='姉'||x==='妹')?T.sex!=='f':true))return mp[x];return x+'の'+g('夫','妻','配偶者')}}
 return''}
// ---- 配置：上の先祖から下へ。夫婦は横並び（他家出身の配偶者は点線の「⇢」で出身の家へ） ----
const W=124,H=62,HG=16,SG=26,LV=124;let POS=new Map(),GH=[],LN=[],TG=[],relC=new Map();
function plan(){idx();const all=P(),head=new Map(),beside=new Map();for(const p of all)if(parents(p).length)head.set(p.id,1);
 for(const p of all){if(head.has(p.id))continue;const h=spouses(p.id).find(s=>head.has(s));if(h)beside.set(p.id,h)}
 const roots=[];for(const p of all.sort(bsort)){if(head.has(p.id)||beside.has(p.id))continue;const grp=[p.id,...spouses(p.id).filter(s=>!head.has(s)&&!beside.has(s))];const h=grp.map(i=>byId.get(i)).sort((a,b)=>(a.sex==='m'?0:1)-(b.sex==='m'?0:1))[0].id;head.set(h,1);for(const g of grp)if(g!==h&&!beside.has(g))beside.set(g,h);roots.push(h)}
 const under=c=>{const f=c.father&&byId.has(c.father)?c.father:null,m=c.mother&&byId.has(c.mother)?c.mother:null;if(f&&head.has(f))return f;if(m&&head.has(m))return m;return beside.get(f)||beside.get(m)||f||m};
 const ch=new Map();for(const p of all)if(parents(p).length){const u=under(p);if(!ch.has(u))ch.set(u,[]);ch.get(u).push(p)}for(const v of ch.values())v.sort(bsort);
 return{head,beside,roots,ch}}
function layout(){const L=plan(),seen=new Set();POS=new Map();GH=[];LN=[];TG=[];relC=new Map();
 const mem=h=>[h,...spouses(h)].filter((x,i,a)=>a.indexOf(x)===i),nIn=h=>{let n=0;const st=[...(L.ch.get(h)||[])];while(st.length){const c=st.pop();n++;st.push(...(L.ch.get(c.id)||[]))}return n};
 const meas=new Map(),hid=new Set();function M(h,dep){if(dep>60)return W;const u=mem(h).length*W+(mem(h).length-1)*HG;let c=0;if(col.has(h)){const st=[...(L.ch.get(h)||[])];while(st.length){const x=st.pop();if(hid.has(x.id))continue;hid.add(x.id);for(const s of spouses(x.id))if(L.beside.get(s)===x.id)hid.add(s);st.push(...(L.ch.get(x.id)||[]))}}else{const k=(L.ch.get(h)||[]).filter(x=>!seen.has(x.id));k.forEach(x=>seen.add(x.id));for(const x of k)c+=M(x.id,dep+1);if(k.length)c+=SG*(k.length-1);meas.set(h+'k',k)}const w=Math.max(u,c);meas.set(h,{w,u,c});return w}
 function place(h,left,y){const m=meas.get(h);if(!m)return;const ms=mem(h);let x=left+(m.w-m.u)/2;const xs={};
  ms.forEach((id,i)=>{const real=id===h||L.beside.get(id)===h;const X=x+i*(W+HG);xs[id]=X;if(real)POS.set(id,{x:X,y});else GH.push({id,x:X,y,of:h});if(i>0){const un=U().find(u=>(u.a===h&&u.b===id)||(u.b===h&&u.a===id))||{};LN.push(`<line class="ln mar${un.st==='div'?' gl':''}" x1="${X-HG}" y1="${y+H/2}" x2="${X}" y2="${y+H/2}"/>`+(un.st==='div'?`<text x="${X-HG/2}" y="${y+H/2-4}" font-size="10" text-anchor="middle" fill="#c0577f">離</text>`:''))}});
  const k=meas.get(h+'k')||[],hx=xs[h]+W/2;const all=L.ch.get(h)||[];if(all.length)TG.push({h,x:hx,y:y+H+9,c:col.has(h),n:nIn(h)});if(!k.length)return;
  let cx=left+(m.w-m.c)/2;const cxs=[];for(const c of k){const w=meas.get(c.id).w;place(c.id,cx,y+LV);cxs.push({c,x:cx+(w-meas.get(c.id).u)/2+W/2});cx+=w+SG}
  const grp=new Map();for(const o of cxs){const op=[o.c.father,o.c.mother].find(z=>z&&z!==h&&xs[z]!=null);const key=op||'';if(!grp.has(key))grp.set(key,[]);grp.get(key).push(o)}
  let gi=0;for(const [op,arr] of grp){const x0=op?(Math.min(xs[op],xs[h])+Math.max(xs[op],xs[h])+W)/2:hx,y0=op?y+H/2:y+H,yb=y+H+(LV-H)/2+gi*7-4;gi++;
   const xa=Math.min(x0,...arr.map(o=>o.x)),xb=Math.max(x0,...arr.map(o=>o.x));LN.push(`<path class="ln" d="M${x0} ${y0}V${yb}M${xa} ${yb}H${xb}${arr.map(o=>`M${o.x} ${yb}V${y+LV}`).join('')}"/>`)}}
 let left=0;for(const r of L.roots){if(seen.has(r))continue;seen.add(r);M(r,0);place(r,left,0);left+=meas.get(r).w+SG*2}
 // ループなどで置けなかった人も端に出す
 for(const p of P())if(!POS.has(p.id)&&!hid.has(p.id)&&!L.beside.has(p.id)&&!GH.some(g=>g.id===p.id)){if(!meas.has(p.id)){seen.add(p.id);M(p.id,0)}place(p.id,left,0);left+=(meas.get(p.id)||{w:W}).w+SG*2}
 return L}
// ---- 描画 ----
let TR=LS.get('kz_tr',null)||{x:20,y:80,k:1},hlId=null;
function card(p,x,y,cls,extra){const s=p.sex==='m'?'m':p.sex==='f'?'f':'u',dead=isDead(p),a=ageAt(p.birth,p.death),yr=pd(p.birth)?pd(p.birth).y:'?',dy=pd(p.death)?pd(p.death).y:'',r=relC.get(p.id)??(relC.set(p.id,relOf(p.id)),relC.get(p.id));
 const n=nm(p),nn=n.length>8?n.slice(0,8)+'…':n,sub=dead?`${yr}–${dy||'?'}${a!=null?' ('+a+'歳)':''}`:(pd(p.birth)?`${yr}年生 ${a}歳`:'');const bt=boTxt(p);const sub2=bt?(sub?sub+' ・'+bt:bt):sub;
 return`<g class="nd ${s}${dead?' dead':''}${cls||''}${p.id===D.meta.self?' me':''}${p.id===hlId?' hl':''}" data-id="${p.id}"${extra||''} transform="translate(${x},${y})"><rect class="b" width="${W}" height="${H}"/>${p.photo?`<clipPath id="c${p.id}${cls?'g':''}"><circle cx="20" cy="${H/2}" r="15"/></clipPath><image href="${p.photo}" x="5" y="${H/2-15}" width="30" height="30" clip-path="url(#c${p.id}${cls?'g':''})" preserveAspectRatio="xMidYMid slice"/>`:''}
 <text x="${p.photo?40:10}" y="22" font-weight="bold">${dead?'✝ ':''}${esc(nn)}${cls?' ⇢':''}</text><text class="s" x="${p.photo?40:10}" y="38">${esc(sub2)}</text>${r?`<text class="r" x="${p.photo?40:10}" y="53">${esc(r)}</text>`:''}</g>`}
function draw(){const L=layout(),svgs=[];
 if(!hasTok()){$('vp').innerHTML='';$('empty').style.display='flex';$('empty').innerHTML='<div><p style="font-size:1.1em">🔒 同期の設定が必要です</p><p style="font-size:.9em">右上の ⚙ からトークンを入れると、家系図を読み込みます。</p></div>';return}
 if(!P().length){$('empty').style.display='flex';$('empty').innerHTML='<div><p>まだ誰もいません</p><button class="btn p" onclick="addFirst()">最初の人を追加</button></div>'}else $('empty').style.display='none';
 svgs.push(LN.join(''));for(const g of GH){const p=byId.get(g.id);svgs.push(card(p,g.x,g.y,' gh',` data-go="${g.id}"`))}for(const [id,o] of POS)svgs.push(card(byId.get(id),o.x,o.y,''));
 for(const t of TG)svgs.push(`<g class="tg" data-tg="${t.h}" transform="translate(${t.x},${t.y})"><circle r="10"/><text y="4">${t.c?'+'+t.n:'−'}</text></g>`);
 $('vp').innerHTML=svgs.join('');apply()}
function apply(){$('vp').setAttribute('transform',`translate(${TR.x},${TR.y}) scale(${TR.k})`)}
let trT=null;const keepTR=()=>{clearTimeout(trT);trT=setTimeout(()=>LS.set('kz_tr',TR),400)};
// ---- 指で動かす・拡大縮小 ----

 if(t==='child'){const sp=spouses(p.id);const extra=sp.length?`<div class="f"><label>もう一人の親</label><select id="m_x">${sp.map(s=>`<option value="${s}">${esc(nm(byId.get(s)))}</option>`).join('')}<option value="">（入れない）</option></select></div>`:'';
  ask(`${nm(p)} の子`,{extra},o=>{const other=o.ex?byId.get(o.ex):null,mf=x=>x&&x.sex==='f'?'mother':'father';const c={name:o.name,sex:o.sex};if(p.sex==='f'){c.mother=p.id;if(other)c.father=other.id}else{c.father=p.id;if(other)c.mother=other.id}if(p.sex===''&&other&&other.sex==='m'){c.mother=p.id;c.father=other.id}mk(c);save();draw();openP(cur)});return}
 if(t==='sib'){ask(`${nm(p)} の兄弟姉妹`,{},o=>{if(!parents(p).length){const f=mk({name:'不明',sex:'m'});p.father=f.id;touch(p)}mk({name:o.name,sex:o.sex,father:p.father,mother:p.mother});save();draw();openP(cur)})}};
// ---- 設定・同期（トークンは画面にもログにも出さない） ----
window.openSet=()=>{const m=$('modal');m.innerHTML=`<div><h3 style="margin:0 0 6px">⚙ 同期</h3><p style="font-size:.82em;color:#666">データは非公開の保存場所（slot-data の kakeizu.json）にだけ保存します。スロット版と同じトークンを使います。</p><div class="f"><label>トークン</label><input id="s_t" type="password" autocomplete="off" placeholder="${hasTok()?'保存済み（変更時のみ）':'github_pat_…'}"></div><p style="font-size:.8em;color:#888" id="s_m">${esc(LS.get('kz_msg',''))}</p><div class="btns"><button class="btn" onclick="$('modal').style.display='none'">閉じる</button><button class="btn p" onclick="saveTok()">保存して同期</button></div></div>`;m.style.display='flex'};
window.saveTok=()=>{const v=$('s_t').value.trim();if(v)LS.set(TOK,v);$('modal').style.display='none';draw();syncNow()};
const b64e=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)},b64d=s=>{const x=atob(String(s).replace(/\s/g,''));const b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return new TextDecoder().decode(b)};
const H_=t=>({Authorization:'Bearer '+t,Accept:'application/vnd.github+json'});
async function ghGet(t){const r=await fetch(REPO+'?t='+Date.now(),{headers:H_(t),cache:'no-store'});if(r.status===404)return{sha:null,data:null};if(!r.ok)throw new Error(r.status===401?'トークンが無効':'取得失敗 '+r.status);const j=await r.json();let txt=j.content?b64d(j.content):'';
 if(!txt&&j.size){const r2=await fetch(REPO+'?t='+Date.now(),{headers:{...H_(t),Accept:'application/vnd.github.raw'},cache:'no-store'});txt=await r2.text()}return{sha:j.sha,data:txt?JSON.parse(txt):null}}
const mrg=(a,b)=>{const m=new Map();for(const x of[...(a||[]),...(b||[])]){if(!x||!x.id)continue;const o=m.get(x.id);if(!o||String(x.updatedAt||'')>String(o.updatedAt||''))m.set(x.id,x)}return[...m.values()]};
const sig=d=>JSON.stringify([[...d.people].sort((a,b)=>a.id<b.id?-1:1),[...d.unions].sort((a,b)=>a.id<b.id?-1:1),d.meta.self||'']);
let syT=null,busy=false,again=false;function syncSoon(){clearTimeout(syT);syT=setTimeout(syncNow,800)}
const msg=t=>{LS.set('kz_msg',t);$('sy').textContent=t;if($('s_m'))$('s_m').textContent=t};
async function syncNow(){const t=LS.get(TOK,'');if(!t||LOCAL)return;if(busy){again=true;return}busy=true;msg('同期中…');
 try{for(let i=0;i<4;i++){const g=await ghGet(t),R=g.data||{version:1,people:[],unions:[],meta:{}};R.meta=R.meta||{};const M={version:1,people:mrg(D.people,R.people),unions:mrg(D.unions,R.unions),meta:String(D.meta.selfAt||'')>=String(R.meta.selfAt||'')?{...R.meta,...D.meta}:{...D.meta,...R.meta}};
  D=M;LS.set(DK,D);if(g.sha&&sig(M)===sig(R))break;const body={message:'kakeizu sync',content:b64e(JSON.stringify({...M,updatedAt:now()}))};if(g.sha)body.sha=g.sha;
  const r=await fetch(REPO,{method:'PUT',headers:{...H_(t),'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.status===409||r.status===422){if(i<3)continue;throw new Error('競合')}if(!r.ok)throw new Error('保存失敗 '+r.status);break}
  const d=new Date(),p=n=>String(n).padStart(2,'0');msg(`同期 ${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`);draw();if(cur){const ae=document.activeElement;if(ae&&$('sheet').contains(ae)&&ae.tagName!=='BUTTON')refreshHead();else openP(cur)}}catch(e){msg('同期エラー：'+(e.message||e))}finally{busy=false;if(again){again=false;syncSoon()}}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
// トークンが無い端末ではデータを出さない（この端末の保存分も表示しない）
draw();if(hasTok()){if(!LS.get('kz_tr',null))fitAll();syncNow()}
</script></body></html>
