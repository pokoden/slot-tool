<style>

<script>
// r69：店舗名の変更（古い名前→新しい名前）。読み込み時・同期で取得したデータの両方に適用し、古い名前が戻らないようにする
const SMAP={'柏マル':'マルハン青森柏','マルハンつがる柏':'マルハン青森柏','柏USA':'USA柏','つがる柏USA':'USA柏','五所マル':'マルハン五所川原','石渡マル':'マルハン弘前石渡','五所ジャム':'ジャムフレンド五所川原','弘前マル':'マルハン弘前','弘前ジャム':'ジャムフレンド弘前'};
const SMRE=new RegExp('(^|[|-])('+Object.keys(SMAP).sort((a,b)=>b.length-a.length).join('|')+')(?=[|-]|$)','g');
function smStr(s){if(Object.prototype.hasOwnProperty.call(SMAP,s.trim()))return SMAP[s.trim()];return s.replace(SMRE,(m,a,n)=>a+SMAP[n])}
function smDedupe(a){if(!Array.isArray(a))return a;const m=new Map(),o=[];for(const x of a){if(!x||typeof x!=='object'||x.name==null){o.push(x);continue}const k=String(x.name).trim(),p=m.get(k);
 if(!p){m.set(k,x);o.push(x);continue}const better=(!x.deleted&&p.deleted)||(!!x.deleted===!!p.deleted&&String(x.updatedAt||'')>String(p.updatedAt||''));if(better){o[o.indexOf(p)]=x;m.set(k,x)}}return o}
function SMIG(v,storesKey){if(typeof v==='string')return smStr(v);if(Array.isArray(v)){const r=v.map(x=>SMIG(x));return storesKey?smDedupe(r):r}
 if(v&&typeof v==='object'){const r={};for(const k of Object.keys(v))r[smStr(k)]=SMIG(v[k],k==='stores');return r}return v}
(function(){try{const re=new RegExp(Object.keys(SMAP).join('|'));for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!/^(v2_|p1_|cd_)/.test(k)||/token/i.test(k))continue;const s=localStorage.getItem(k);if(!s||!re.test(s))continue;
 let j;try{j=JSON.parse(s)}catch(e){continue}const n=SMIG(j,/_stores$/.test(k));const t=JSON.stringify(n);if(t!==s)localStorage.setItem(k,t)}}catch(e){}})();

// ===== 版の確認：開いたとき・戻ったときにサーバーの最新版と比べ、古ければ読み込み直す（ホーム画面のキャッシュ対策） =====
const APPV='r60';
async function verCheck(){try{if(location.protocol==='file:')return;const r=await fetch(location.pathname+'?vc='+Date.now(),{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/const APPV='([^']+)'/);if(!m||m[1]===APPV)return;const k='cd_vtry_'+m[1];if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1');location.replace(location.pathname+'?v='+m[1]+'&t='+Date.now()+location.hash)}catch(e){}}
verCheck();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')verCheck()});
// ===== 貯玉管理（パチンコ＝貯玉 / スロット＝貯メダル）。データは各ツールの保存記録（localStorage＋同期データ）から計算 =====
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=x=>x===''||x==null?null:(isFinite(+x)?+x:null),Z=x=>N(x)??0;
const sg=x=>(x>0?'+':x<0?'−':'±')+Math.abs(Math.round(x)).toLocaleString(),pc=x=>x>0?' style="color:#1e5bd6"':x<0?' style="color:#d62828"':'';
const TOK='v2_token',TOB='cd_tob',TOB_YEN=6000,REPO='https://api.github.com/repos/pokoden/slot-data/contents/';
const KIND={p:{hist:'p1_hist',stores:'p1_stores',file:'pachinko.json',l:'パチンコ（貯玉）',u:'玉'},s:{hist:'v2_hist',stores:'v2_stores',file:'data.json',l:'スロット（貯メダル）',u:'枚'}};
let remote={p:null,s:null},tab=LS.get('cd_tab','p');
const sk=n=>String(n||'').trim()||'店舗未入力';
function storesOf(k){const a=LS.get(KIND[k].stores,[])||[],b=(remote[k]&&remote[k].stores)||[],m=new Map();
 for(const x of[...a,...b]){if(!x)continue;const o=m.get(sk(x.name));if(!o||String(x.updatedAt||'')>String(o.updatedAt||''))m.set(sk(x.name),x)}return[...m.values()].filter(x=>!x.deleted)}
// 1玉(1枚)の円価値：パチンコ＝店舗の1玉の価値（未登録3.57円）、スロット＝店舗の換金額（100円あたりの枚数から）
function yenPer(k,name){const s=storesOf(k).find(x=>sk(x.name)===name);if(k==='p')return s&&+s.val>0?+s.val:3.57;
 const ex=s&&+s.ex>0?+s.ex:(s&&+s.rate>0?Math.round(100/s.rate*1000)/1000:null);return ex?100/ex:null}
// 保存記録：ローカル＋同期データをidでマージ（新しい方）、削除済み除外、同じ記録の重複は最新のみ
function records(k){const m=new Map();for(const x of[...(LS.get(KIND[k].hist,[])||[]),...((remote[k]&&remote[k].entries)||[])]){if(!x||!x.id)continue;const o=m.get(x.id);if(!o||String(x.updatedAt||'')>String(o.updatedAt||''))m.set(x.id,x)}
 const best=new Map();for(const e of m.values()){if(e.deleted)continue;const key=(e.st&&e.st.recId)||e.id,o=best.get(key);if(!o||String(e.saved||'')>String(o.saved||''))best.set(key,e)}return[...best.values()]}
// 1台の増減＝回収−使用持ち玉(メダル)−使用貯玉(メダル)（パチンコの自動値は表の上のボックスと同じ計算）
function netOf(k,e){const s=e.st||{};
 if(k==='p'&&s.bx&&typeof s.bx==='object'&&s._p4){const st=storesOf('p').find(x=>sk(x.name)===sk(e.store))||{},per=st.mode==='ball'?1:(+st.per>0?+st.per:125);
  const top=q=>{for(const w of s.rows||[]){const v=N((w||{})[q]);if(v!=null)return v}return null},bx=s.bx,used=(t,f)=>{const a=N(bx[t+'0'])??top(t+'0');return a==null?0:(a-(N(bx[t+'1'])??0))*f};
  return Z(s.out)-(N(s.usv)??used('k',s.bxKball?1:per))-(N(s.uhb)??used('m',1))}
 return Z(s.out)-(Z(s.sv0)-Z(s.sv1))-(Z(s.hb0)-Z(s.hb1))}
// タバコ交換状態 [{id:'p|店舗|日付',on,updatedAt}]
const CASH='cd_cash',cashList=()=>LS.get(CASH,[])||[],cashOf=id=>{const x=cashList().find(t=>t.id===id);return x&&x.v!==''&&x.v!=null&&isFinite(+x.v)?+x.v:null};
const tobList=()=>LS.get(TOB,[])||[],tobOn=id=>{const x=tobList().find(t=>t.id===id);return!!(x&&x.on)};
function mergeTob(a,b){const m=new Map();for(const x of[...(a||[]),...(b||[])]){const o=m.get(x.id);if(!o||String(x.updatedAt||'')>String(o.updatedAt||''))m.set(x.id,x)}return[...m.values()]}
function calcKind(k){const rows=new Map();for(const e of records(k)){if(e.src==='excel')continue;// エクセル取込分は貯玉計算に入れない
 const st=sk(e.store),d=e.date||String(e.saved||'').slice(0,10),key=st+'|'+d;if(!rows.has(key))rows.set(key,{store:st,date:d,net:0,n:0});const r=rows.get(key);r.net+=netOf(k,e);r.n++}
 const out=[...rows.values()].map(r=>{const id=k+'|'+r.store+'|'+r.date,yp=yenPer(k,r.store),on=tobOn(id),tob=on&&yp?Math.round(TOB_YEN/yp):0;return{...r,id,yp,on,tob,res:r.net-tob}});
 // 同じ店舗は日付の古い順に累積：増減→タバコ→（現金換金の入力があれば）残高をその数に置き換え
 const bal=new Map();for(const r of[...out].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)){const o=bal.get(r.store)||{store:r.store,bal:0,yp:r.yp};o.bal+=r.res;r.cash=cashOf(r.id);if(r.cash!=null)o.bal=r.cash;r.after=o.bal;bal.set(r.store,o)}
 out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.store.localeCompare(b.store));
 return{rows:out,bal:[...bal.values()].sort((a,b)=>b.bal-a.bal)}}
let IDS=[],main=LS.get('cd_main','ss'),calM=null,mode=LS.get('cd_mode','all'),cstore='all',pg='home';
// ===== 収支管理：両ツールの保存済み記録の収支(e.yen)・稼働時間(e.hours)（本日の収支と同じ値）。削除・重複は除外、保存前は入れない =====
const pad2=n=>String(n).padStart(2,'0'),todayS=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
function allRecs(){const L=[];for(const k of['p','s'])for(const e of records(k)){const d=e.date||String(e.saved||'').slice(0,10);if(!d)continue;const yen=e.yen!=null&&isFinite(+e.yen)?+e.yen:null,st=e.st||{};let diff=null,g3=null;
  if(k==='p'){const vp=yenPer('p',sk(e.store));diff=yen!=null&&vp?yen/vp:null}// 差玉＝収支÷1玉の価値（本日の収支と同じ）
  else{diff=e.diff!=null&&isFinite(+e.diff)?+e.diff:null;const og=st.ttotal!==''&&st.ttotal!=null?Math.max(0,(+st.ttotal||0)-(+st.tstart||0)):(()=>{if(st.total===''||st.total==null)return 0;const x=(+st.total||0)-(+st.start||0);return x>0?x:0})();g3=og>0&&diff!=null?3*og:null}// 機械割の投入＝3枚×自分G（スロット版と同じ）
  L.push({k,aim:e.aim||st.aim||'設定狙い',date:d,store:sk(e.store),memo:e.memo||'',machine:e.machine||e.mid||'',yen,work:k==='p'&&e.work!=null&&isFinite(+e.work)?+e.work:null,hours:+e.hours>0?+e.hours:0,G:+e.G>0?+e.G:0,diff,g3,saved:e.saved||''})}return L}
function byDay(f){const m=new Map();for(const r of allRecs()){if(mode!=='all'&&r.k!==mode)continue;if(f&&!f(r))continue;if(cstore!=='all'&&r.store!==cstore)continue;if(!m.has(r.date))m.set(r.date,{date:r.date,yen:0,yn:0,hours:0,G:0,list:[]});const o=m.get(r.date);if(r.yen!=null){o.yen+=r.yen;o.yn++}o.hours+=r.hours;o.G+=r.G;o.list.push(r)}return m}
const shY=x=>{if(x==null)return'-';const a=Math.abs(x),sgn=x>0?'+':x<0?'−':'';let t;if(a>=10000){const v=a/10000;t=(v>=100?Math.round(v):Math.round(v*10)/10)+'万'}else if(a>=1000)t=Math.round(a/1000)+'千';else t=String(Math.round(a));return sgn+t};
const yenTxt=x=>x==null?'-':sg(x)+'円',hTxt=h=>h>0?h.toFixed(1)+'時間':'-';
function calendar(){const D=byDay();if(!calM)calM=todayS().slice(0,7);const [y,mo]=calM.split('-').map(Number),first=new Date(y,mo-1,1),days=new Date(y,mo,0).getDate(),off=first.getDay();
 let ty=0,tn=0,th=0,cnt=0,nd=0,tg=0,td=0,tdn=0,pin=0,pout=0;for(const [d,o] of D)if(d.slice(0,7)===calM){nd++;ty+=o.yen;tn+=o.yn;th+=o.hours;tg+=o.G;cnt+=o.list.length;for(const r of o.list){if(r.diff!=null){td+=r.diff;tdn++}if(r.g3){pin+=r.g3;pout+=r.g3+r.diff}}}
 let cells='';for(let i=0;i<off;i++)cells+='<td></td>';for(let d=1;d<=days;d++){const k=calM+'-'+pad2(d),o=D.get(k),c=(off+d-1)%7,col=o&&o.yn?(o.yen>0?'#1e5bd6':o.yen<0?'#d62828':'#555'):'',bg=o&&o.yn?(o.yen>0?'#e8f0ff':o.yen<0?'#ffecec':'#f4f4f4'):'';
  cells+=`<td id="cal_${k}" style="vertical-align:top;height:54px;${bg?'background:'+bg+';':''}${o?'cursor:pointer;':''}${k===todayS()?'outline:2px solid #2b6fe8;outline-offset:-2px;':''}"${o?` onclick="goDay('${k}')"`:''}><div style="text-align:left;font-size:.9em;color:${c===0?'#d62828':c===6?'#1e5bd6':'#333'}">${d}</div>${o?`<div class="cy" style="color:${col}">${o.yn?shY(o.yen):'-'}</div><div class="cs">${o.hours>0?o.hours.toFixed(1)+'h':''}</div>${mode!=='all'&&o.G?`<div class="cs">${shY(o.G).replace('+','')}${mode==='p'?'回':'G'}</div>`:''}`:''}</td>`;if(c===6&&d<days)cells+='</tr><tr>'}
 const wh=th>0&&tn?ty/th:null;
 return`<div class="card"><div class="row" style="margin:0 0 6px"><button class="sub sm" id="cal_prev" onclick="calMove(-1)">◀</button><b style="font-size:1.1em" id="cal_title">${y}年${mo}月</b><button class="sub sm" id="cal_next" onclick="calMove(1)">▶</button></div>
 
 ${(()=>{const it=[['金額',tn?sg(ty)+'円':'-',tn?ty:null]];if(mode!=='all')it.push([mode==='p'?'差玉':'差枚',tdn?sg(td)+(mode==='p'?'玉':'枚'):'-',tdn?td:null]);it.push(['台数',cnt+'台'],['稼働日数',nd+'日']);if(mode!=='all')it.push(['回転数',tg.toLocaleString()+(mode==='p'?'回転':'G')]);
  it.push(['稼働時間',hTxt(th)],['平均稼働時間',nd&&th>0?(th/nd).toFixed(1)+'時間':'-']);if(mode!=='all')it.push(['平均回転数',nd?Math.round(tg/nd).toLocaleString()+(mode==='p'?'回転':'G'):'-']);it.push(['時給',wh==null?'-':sg(wh)+'円',wh]);
  if(mode==='s'){const pr=pin>0?pout/pin*100:null;it.push(['機械割',pr==null?'-':pr.toFixed(1)+'%',pr==null?null:pr-100])}
  return`<div class="tw" style="margin-bottom:8px"><table id="mtot">${it.map(([l,v,c])=>`<tr><th style="text-align:left;width:45%">${l}</th><td${c==null?'':pc(c)} style="font-weight:bold;text-align:right">${v}</td></tr>`).join('')}</table></div>`})()}
 <table id="cal"><tr>${'日月火水木金土'.split('').map((w,i)=>`<th style="color:${i===0?'#d62828':i===6?'#1e5bd6':''}">${w}</th>`).join('')}</tr><tr>${cells}</tr></table><p class="note">パチンコとスロットの保存済み記録の合計（円）と稼働時間。日をタップすると下のその日の行へ。</p></div>`}
function dayList(){const D=[...byDay().values()].filter(o=>pIn(o.date)).sort((a,b)=>a.date<b.date?1:-1);if(!D.length)return'<div class="card"><p class="note">保存データがありません</p></div>';
 const W='日月火水木金土';return D.map(o=>{const [y,m,d]=o.date.split('-').map(Number),w=isFinite(y)?W[new Date(y,m-1,d).getDay()]:'';
  return`<div class="card" id="day_${o.date}"><div style="display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:6px;border-bottom:2px solid #eef2fa"><div><b style="font-size:1.2em">${m}/${d}</b> <span style="color:${w==='日'?'#d62828':w==='土'?'#1e5bd6':'#555'}">（${w}）</span><br><small class="note">${o.list.length}台・${hTxt(o.hours)}</small></div><span style="font-size:1.35em"><b${pc(o.yn?o.yen:null)}>${o.yn?yenTxt(o.yen):'-'}</b></span></div>
  ${o.list.sort((a,b)=>a.saved<b.saved?-1:1).map(r=>`<div style="display:flex;gap:8px;align-items:center;border-top:1px solid #f0f0f0;padding:8px 0 2px"><span class="tag" style="margin:0;flex:0 0 auto;${r.k==='p'?'background:#fff3d6;color:#a35a00':''}">${r.k==='p'?'パチ':'スロ'}</span><div style="flex:1;min-width:0"><b style="display:block;overflow-wrap:anywhere">${esc(r.machine)}</b><small class="note">${esc(r.store)}${r.memo?'・台'+esc(r.memo):''}</small></div><div style="text-align:right;flex:0 0 auto"><b${pc(r.yen)}>${yenTxt(r.yen)}</b><br><small class="note">${hTxt(r.hours)}</small></div></div>`).join('')}</div>`}).join('')}
window.calMove=d=>{const [y,m]=calM.split('-').map(Number),t=new Date(y,m-1+d,1);calM=t.getFullYear()+'-'+pad2(t.getMonth()+1);const Y=scrollY;render();scrollTo(0,Y)};
