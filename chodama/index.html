<style>

<style>.tob{width:auto;margin:0;padding:6px 10px;font-size:.85em}.tob.on{background:#d62828}.tob.off{background:#e4e8f0;color:#333}</style></head><body>
<div id="app"></div>
<script>
// ===== 貯玉管理（パチンコ＝貯玉 / スロット＝貯メダル）。データは各ツールの保存記録（localStorage＋同期データ）から計算 =====
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=x=>x===''||x==null?null:(isFinite(+x)?+x:null),Z=x=>N(x)??0;
const sg=x=>(x>0?'+':x<0?'−':'±')+Math.abs(Math.round(x)).toLocaleString(),pc=x=>x>0?' style="color:#1e5bd6"':x<0?' style="color:#d62828"':'';
const TOK='v2_token',TOB='cd_tob',TOB_YEN=6000,REPO='https://api.github.com/repos/pokoden/slot-data/contents/';
const KIND={p:{hist:'p1_hist',stores:'p1_stores',file:'pachinko.json',l:'パチンコ（貯玉）',u:'玉'},s:{hist:'v2_hist',stores:'v2_stores',file:'data.json',l:'スロット（貯メダル）',u:'枚'}};
let remote={p:null,s:null},tab=LS.get('cd_tab','p');
const sk=n=>String(n||'').trim()||'店舗未入力';
function storesOf(k){const a=LS.get(KIND[k].stores,[])||[],b=(remote[k]&&remote[k].stores)||[],m=new Map();
 for(const x of[...a,...b]){if(!x)continue;const o=m.get(sk(x.name));if(!o||String(x.updatedAt||'')>String(o.updatedAt||''))m.set(sk(x.name),x)}return[...m.values()].filter(x=>!x.deleted)}
// 1玉(1枚)の円価値：パチンコ＝店舗の1玉の価値（未登録3.57円）、スロット＝店舗の換金額（100円あたりの枚数から）
function yenPer(k,name){const s=storesOf(k).find(x=>sk(x.name)===name);if(k==='p')return s&&+s.val>0?+s.val:3.57;
 const ex=s&&+s.ex>0?+s.ex:(s&&+s.rate>0?Math.round(100/s.rate*1000)/1000:null);return ex?100/ex:null}
// 保存記録：ローカル＋同期データをidでマージ（新しい方）、削除済み除外、同じ記録の重複は最新のみ
function records(k){const m=new Map();for(const x of[...(LS.get(KIND[k].hist,[])||[]),...((remote[k]&&remote[k].entries)||[])]){if(!x||!x.id)continue;const o=m.get(x.id);if(!o||String(x.updatedAt||'')>String(o.updatedAt||''))m.set(x.id,x)}
 const best=new Map();for(const e of m.values()){if(e.deleted)continue;const key=(e.st&&e.st.recId)||e.id,o=best.get(key);if(!o||String(e.saved||'')>String(o.saved||''))best.set(key,e)}return[...best.values()]}
// 1台の増減＝回収−使用持ち玉(メダル)−使用貯玉(メダル)（パチンコの自動値は表の上のボックスと同じ計算）
function netOf(k,e){const s=e.st||{};
 if(k==='p'&&s.bx&&typeof s.bx==='object'&&s._p4){const st=storesOf('p').find(x=>sk(x.name)===sk(e.store))||{},per=st.mode==='ball'?1:(+st.per>0?+st.per:125);
  const top=q=>{for(const w of s.rows||[]){const v=N((w||{})[q]);if(v!=null)return v}return null},bx=s.bx,used=(t,f)=>{const a=N(bx[t+'0'])??top(t+'0');return a==null?0:(a-(N(bx[t+'1'])??0))*f};
  return Z(s.out)-(N(s.usv)??used('k',s.bxKball?1:per))-(N(s.uhb)??used('m',1))}
 return Z(s.out)-(Z(s.sv0)-Z(s.sv1))-(Z(s.hb0)-Z(s.hb1))}
// タバコ交換状態 [{id:'p|店舗|日付',on,updatedAt}]
const CASH='cd_cash',cashList=()=>LS.get(CASH,[])||[],cashOf=id=>{const x=cashList().find(t=>t.id===id);return x&&x.v!==''&&x.v!=null&&isFinite(+x.v)?+x.v:null};
const tobList=()=>LS.get(TOB,[])||[],tobOn=id=>{const x=tobList().find(t=>t.id===id);return!!(x&&x.on)};
function mergeTob(a,b){const m=new Map();for(const x of[...(a||[]),...(b||[])]){const o=m.get(x.id);if(!o||String(x.updatedAt||'')>String(o.updatedAt||''))m.set(x.id,x)}return[...m.values()]}
function calcKind(k){const rows=new Map();for(const e of records(k)){const st=sk(e.store),d=e.date||String(e.saved||'').slice(0,10),key=st+'|'+d;if(!rows.has(key))rows.set(key,{store:st,date:d,net:0,n:0});const r=rows.get(key);r.net+=netOf(k,e);r.n++}
 const out=[...rows.values()].map(r=>{const id=k+'|'+r.store+'|'+r.date,yp=yenPer(k,r.store),on=tobOn(id),tob=on&&yp?Math.round(TOB_YEN/yp):0;return{...r,id,yp,on,tob,res:r.net-tob}});
 // 同じ店舗は日付の古い順に累積：増減→タバコ→（現金換金の入力があれば）残高をその数に置き換え
 const bal=new Map();for(const r of[...out].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)){const o=bal.get(r.store)||{store:r.store,bal:0,yp:r.yp};o.bal+=r.res;r.cash=cashOf(r.id);if(r.cash!=null)o.bal=r.cash;r.after=o.bal;bal.set(r.store,o)}
 out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.store.localeCompare(b.store));
 return{rows:out,bal:[...bal.values()].sort((a,b)=>b.bal-a.bal)}}
let IDS=[],main=LS.get('cd_main','ss'),calM=null,mode=LS.get('cd_mode','all'),cstore=LS.get('cd_store','all'),pg='home';
// ===== 収支管理：両ツールの保存済み記録の収支(e.yen)・稼働時間(e.hours)（本日の収支と同じ値）。削除・重複は除外、保存前は入れない =====
const pad2=n=>String(n).padStart(2,'0'),todayS=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
function allRecs(){const L=[];for(const k of['p','s'])for(const e of records(k)){const d=e.date||String(e.saved||'').slice(0,10);if(!d)continue;const yen=e.yen!=null&&isFinite(+e.yen)?+e.yen:null,st=e.st||{};let diff=null,g3=null;
  if(k==='p'){const vp=yenPer('p',sk(e.store));diff=yen!=null&&vp?yen/vp:null}// 差玉＝収支÷1玉の価値（本日の収支と同じ）
  else{diff=e.diff!=null&&isFinite(+e.diff)?+e.diff:null;const og=st.ttotal!==''&&st.ttotal!=null?Math.max(0,(+st.ttotal||0)-(+st.tstart||0)):(()=>{if(st.total===''||st.total==null)return 0;const x=(+st.total||0)-(+st.start||0);return x>0?x:0})();g3=og>0&&diff!=null?3*og:null}// 機械割の投入＝3枚×自分G（スロット版と同じ）
  L.push({k,date:d,store:sk(e.store),memo:e.memo||'',machine:e.machine||e.mid||'',yen,hours:+e.hours>0?+e.hours:0,G:+e.G>0?+e.G:0,diff,g3,saved:e.saved||''})}return L}
function byDay(){const m=new Map();for(const r of allRecs()){if(mode!=='all'&&r.k!==mode)continue;if(cstore!=='all'&&r.store!==cstore)continue;if(!m.has(r.date))m.set(r.date,{date:r.date,yen:0,yn:0,hours:0,G:0,list:[]});const o=m.get(r.date);if(r.yen!=null){o.yen+=r.yen;o.yn++}o.hours+=r.hours;o.G+=r.G;o.list.push(r)}return m}
const yenTxt=x=>x==null?'-':sg(x)+'円',hTxt=h=>h>0?h.toFixed(1)+'時間':'-';
function calendar(){const D=byDay();if(!calM)calM=todayS().slice(0,7);const [y,mo]=calM.split('-').map(Number),first=new Date(y,mo-1,1),days=new Date(y,mo,0).getDate(),off=first.getDay();
 let ty=0,tn=0,th=0,cnt=0,tg=0,td=0,tdn=0,pin=0,pout=0;for(const [d,o] of D)if(d.slice(0,7)===calM){ty+=o.yen;tn+=o.yn;th+=o.hours;tg+=o.G;cnt+=o.list.length;for(const r of o.list){if(r.diff!=null){td+=r.diff;tdn++}if(r.g3){pin+=r.g3;pout+=r.g3+r.diff}}}
 let cells='';for(let i=0;i<off;i++)cells+='<td></td>';for(let d=1;d<=days;d++){const k=calM+'-'+pad2(d),o=D.get(k),c=(off+d-1)%7,col=o&&o.yn?(o.yen>0?'#1e5bd6':o.yen<0?'#d62828':'#555'):'',bg=o&&o.yn?(o.yen>0?'#e8f0ff':o.yen<0?'#ffecec':'#f4f4f4'):'';
  cells+=`<td id="cal_${k}" style="vertical-align:top;height:58px;padding:2px;${bg?'background:'+bg+';':''}${o?'cursor:pointer;':''}${k===todayS()?'outline:2px solid #2b6fe8;outline-offset:-2px;':''}"${o?` onclick="goDay('${k}')"`:''}><div style="text-align:left;font-size:.9em;color:${c===0?'#d62828':c===6?'#1e5bd6':'#333'}">${d}</div>${o?`<div style="font-weight:bold;color:${col};font-size:.86em">${o.yn?sg(o.yen):'-'}</div><div style="color:#777;font-size:.8em">${o.hours>0?o.hours.toFixed(1)+'h':''}</div>${mode!=='all'&&o.G?`<div style="color:#777;font-size:.75em">${o.G.toLocaleString()}${mode==='p'?'回':'G'}</div>`:''}`:''}</td>`;if(c===6&&d<days)cells+='</tr><tr>'}
 const wh=th>0&&tn?ty/th:null;
 return`<div class="card"><div class="row" style="margin:0 0 6px"><button class="sub sm" id="cal_prev" onclick="calMove(-1)">◀</button><b style="font-size:1.1em" id="cal_title">${y}年${mo}月</b><button class="sub sm" id="cal_next" onclick="calMove(1)">▶</button></div>
 
 ${(()=>{const it=[['金額',tn?sg(ty)+'円':'-',tn?ty:null]];if(mode!=='all')it.push([mode==='p'?'差玉':'差枚',tdn?sg(td)+(mode==='p'?'玉':'枚'):'-',tdn?td:null]);it.push(['台数',cnt+'台']);if(mode!=='all')it.push(['回転数',tg.toLocaleString()+(mode==='p'?'回転':'G')]);
  it.push(['稼働時間',hTxt(th)],['平均稼働時間',cnt&&th>0?(th/cnt).toFixed(1)+'時間':'-']);if(mode!=='all')it.push(['平均回転数',cnt?Math.round(tg/cnt).toLocaleString()+(mode==='p'?'回転':'G'):'-']);it.push(['時給',wh==null?'-':sg(wh)+'円',wh]);
  if(mode==='s'){const pr=pin>0?pout/pin*100:null;it.push(['機械割',pr==null?'-':pr.toFixed(1)+'%',pr==null?null:pr-100])}
  return`<div class="tw" style="margin-bottom:8px"><table id="mtot">${it.map(([l,v,c])=>`<tr><th style="text-align:left;width:45%">${l}</th><td${c==null?'':pc(c)} style="font-weight:bold;text-align:right">${v}</td></tr>`).join('')}</table></div>`})()}
 <table id="cal" style="table-layout:fixed;font-size:.8em;white-space:normal"><tr>${'日月火水木金土'.split('').map((w,i)=>`<th style="color:${i===0?'#d62828':i===6?'#1e5bd6':''}">${w}</th>`).join('')}</tr><tr>${cells}</tr></table><p class="note">パチンコとスロットの保存済み記録の合計（円）と稼働時間。日をタップするとその日の一覧へ。</p></div>`}
function dayList(){const D=[...byDay().values()].sort((a,b)=>a.date<b.date?1:-1);if(!D.length)return'<div class="card"><p class="note">保存データがありません</p></div>';
 const W='日月火水木金土';return D.map(o=>{const [y,m,d]=o.date.split('-').map(Number),w=isFinite(y)?W[new Date(y,m-1,d).getDay()]:'';
  return`<div class="card" id="day_${o.date}"><div class="row" style="margin:0 0 6px"><b>${m}/${d}（${w}）</b><span><b${pc(o.yn?o.yen:null)}>${o.yn?yenTxt(o.yen):'-'}</b> <small class="note">${hTxt(o.hours)}</small></span></div>
  ${o.list.sort((a,b)=>a.saved<b.saved?-1:1).map(r=>`<div class="row" style="border-top:1px solid #eee;padding-top:6px;margin:6px 0"><label><span class="tag" style="margin:0 4px 0 0;${r.k==='p'?'background:#fff3d6;color:#a35a00':''}">${r.k==='p'?'パチ':'スロ'}</span><b>${esc(r.machine)}</b><small>${esc(r.store)}${r.memo?' 台'+esc(r.memo):''}</small></label><span style="text-align:right"><b${pc(r.yen)}>${yenTxt(r.yen)}</b><br><small class="note">${hTxt(r.hours)}</small></span></div>`).join('')}</div>`}).join('')}
window.calMove=d=>{const [y,m]=calM.split('-').map(Number),t=new Date(y,m-1+d,1);calM=t.getFullYear()+'-'+pad2(t.getMonth()+1);const Y=scrollY;render();scrollTo(0,Y)};
function selBar(){const ss=[...new Set(allRecs().map(r=>r.store))].sort();if(cstore!=='all'&&!ss.includes(cstore))ss.push(cstore);
 return`<div class="card"><div class="seg" style="margin-bottom:8px">${[['all','合計'],['p','パチンコ'],['s','スロット']].map(([k,l])=>`<button id="mode_${k}" class="${k===mode?'':'sub'}" onclick="setMode('${k}')">${l}</button>`).join('')}</div>
 <select id="sel_store" style="width:100%;font-size:16px" onchange="setStore(this.value)"><option value="all"${cstore==='all'?' selected':''}>全店舗</option>${ss.map(x=>`<option value="${esc(x)}"${x===cstore?' selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
// 収支ページの集計：日単位（その日の収支＝選んだ種類・店舗の合計）。平均は行った1日あたり
function aggDays(days){const a={n:days.length,win:0,yen:0,yn:0,h:0,G:0,d:0,dn:0,pin:0,pout:0};for(const o of days){if(o.yn&&o.yen>0)a.win++;a.yen+=o.yen;a.yn+=o.yn;a.h+=o.hours;a.G+=o.G;for(const r of o.list){if(r.diff!=null){a.d+=r.diff;a.dn++}if(r.g3){a.pin+=r.g3;a.pout+=r.g3+r.diff}}}return a}
function statSecs(){const D=[...byDay().values()].filter(o=>/^\d{4}-\d{2}-\d{2}$/.test(o.date)),WD='日月火水木金土';
 const info=o=>{const [y,m,d]=o.date.split('-').map(Number);return{y,m,d,w:new Date(y,m-1,d).getDay()}};
 const defs=[['ym','年月',o=>{const i=info(o);return[-(i.y*100+i.m),i.y+'年'+i.m+'月']}],['y','年',o=>{const i=info(o);return[-i.y,i.y+'年']}],['m','月',o=>{const i=info(o);return[i.m,i.m+'月']}],
  ['tail','日末尾',o=>{const i=info(o);return[i.d%10,'末尾'+(i.d%10)]}],['d','日',o=>{const i=info(o);return[i.d,i.d+'日']}],['w','曜日',o=>{const i=info(o),k=(i.w+6)%7;return[k,WD[i.w]+'曜日']}]];
 const U=mode==='p'?'玉':'枚',GU=mode==='p'?'回転':'G',n0=x=>Math.round(x).toLocaleString(),it=(l,v,c)=>`<span style="display:inline-block;min-width:31%;margin:2px 0"><small class="note">${l}</small><br><b${c==null?'':pc(c)}>${v}</b></span>`;
 return defs.map(([id,t,f])=>{const g=new Map();for(const o of D){const [k,l]=f(o);if(!g.has(k))g.set(k,{k,l,days:[]});g.get(k).days.push(o)}
  const rows=[...g.values()].sort((a,b)=>a.k-b.k).map(x=>({...x,a:aggDays(x.days)})).filter(x=>x.a.n>0);
  let bi=-1,wi=-1;rows.forEach((x,i)=>{if(!x.a.yn)return;if(bi<0||x.a.yen>rows[bi].a.yen)bi=i;if(wi<0||x.a.yen<rows[wi].a.yen)wi=i});if(rows.length<2)bi=wi=-1;
  return`<details class="card" id="sec_${id}"><summary><b>${t}別</b> <small class="note">${rows.length}行</small></summary>${rows.map((x,i)=>{const a=x.a,wh=a.h>0&&a.yn?a.yen/a.h:null,bg=i===bi?'background:#e3efff;border-left:4px solid #2b6fe8':i===wi?'background:#ffe5e5;border-left:4px solid #d62828':'';
   return`<div id="r_${id}_${x.k}" style="border-top:1px solid #eee;padding:6px;${bg}"><b>${x.l}</b>
   <div>${it('稼働回数',a.n+'日')}${it('勝ち日数',a.win+'日')}${it('勝率',(a.win/a.n*100).toFixed(1)+'%')}</div>
   <div>${it('収支',a.yn?sg(a.yen)+'円':'-',a.yen)}${it('平均収支',a.yn?sg(Math.round(a.yen/a.n))+'円':'-',a.yen)}${it('時給',wh==null?'-':sg(Math.round(wh))+'円',wh)}</div>
   <div>${it('稼働時間',hTxt(a.h))}${it('平均稼働時間',a.h>0?(a.h/a.n).toFixed(1)+'時間':'-')}</div>
   ${mode==='all'?'':`<div>${it('回転数',n0(a.G)+GU)}${it('平均回転数',n0(a.G/a.n)+GU)}${it(mode==='p'?'差玉':'差枚',a.dn?sg(Math.round(a.d))+U:'-',a.d)}${it(mode==='p'?'平均差玉':'平均差枚',a.dn?sg(Math.round(a.d/a.n))+U:'-',a.d)}${mode==='s'?it('機械割',a.pin>0?(a.pout/a.pin*100).toFixed(1)+'%':'-',a.pin>0?a.pout-a.pin:null):''}</div>`}</div>`}).join('')}</details>`}).join('')}
window.setStore=v=>{cstore=v;LS.set('cd_store',v);const Y=scrollY;render();scrollTo(0,Y)};
window.goPg=k=>{pg=k;render();scrollTo(0,0)};
window.setMode=k=>{mode=k;LS.set('cd_mode',k);const Y=scrollY;render();scrollTo(0,Y)};
window.setMain=k=>{main=k;LS.set('cd_main',k);const Y=scrollY;render();scrollTo(0,Y)};
window.goDay=k=>{if(pg!=='ss'){pg='ss';render()}const e=$('day_'+k);if(e){e.scrollIntoView({block:'start',behavior:'smooth'});e.style.outline='2px solid #2b6fe8';setTimeout(()=>e.style.outline='',1500)}};
// 店舗ごとのまとめ（パチンコとスロットで同じ店舗名は1行に）
function summary(){const P=calcKind('p'),S=calcKind('s'),m=new Map();for(const b of P.bal)m.set(b.store,{p:b});for(const b of S.bal){const o=m.get(b.store)||{};o.s=b;m.set(b.store,o)}
 if(!m.size)return'<div class="card"><h2>店舗ごとの残高</h2><p class="note">保存データがありません</p></div>';
 let tp=0,ts=0,ty=0,noY=false;const cell=(b,u)=>{if(!b)return'<td>−</td>';if(b.yp)ty+=b.bal*b.yp;else noY=true;return`<td${pc(b.bal)}><b>${sg(b.bal)}${u}</b><br><small>${b.yp?sg(b.bal*b.yp)+'円':'レート未設定'}</small></td>`};
 const rows=[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([k,o])=>{if(o.p)tp+=o.p.bal;if(o.s)ts+=o.s.bal;return`<tr><td style="text-align:left">${esc(k)}</td>${cell(o.p,'玉')}${cell(o.s,'枚')}</tr>`}).join('');
 return`<div class="card"><h2>店舗ごとの残高</h2><div class="tw"><table id="sum"><tr><th style="text-align:left">店舗</th><th>貯玉</th><th>貯メダル</th></tr>${rows}</table></div>
 <div class="tw" style="margin-top:8px"><table id="tot"><tr><th>全店合計</th><th>貯玉</th><th>貯メダル</th><th>金額</th></tr><tr style="font-weight:bold"><td></td><td${pc(tp)}>${sg(tp)}玉</td><td${pc(ts)}>${sg(ts)}枚</td><td${pc(ty)}>${sg(ty)}円${noY?'＊':''}</td></tr></table></div>
 <p class="note">円換算：パチンコ＝店舗の1玉の価値（未登録は3.57円）、スロット＝店舗の換金額（円/枚）。${noY?'＊レート未設定の店舗は金額に含みません。':''}</p></div>`}
function render(){const K=KIND[tab],c=calcKind(tab),u=K.u,W=tab==='p'?'玉':'メダル';IDS=c.rows.map(r=>r.id);
 $('app').innerHTML=`<div style="display:flex;gap:8px"><button class="sub sm" onclick="location.href='../pachinko/'">← パチンコ</button><button class="sub sm" onclick="location.href='../'">← スロット</button></div><h1 style="margin-top:10px">📅 ${pg==='ss'?'収支管理':pg==='cd'?'貯玉管理':'収支・貯玉'}</h1>
 ${pg==='home'?'':`<button id="back" class="sub sm" style="margin-bottom:10px" onclick="goPg('home')">← 戻る</button>`}${pg==='cd'?'':selBar()}
 ${pg==='home'?`${calendar()}<div class="seg" style="margin-bottom:12px"><button id="main_ss" onclick="goPg('ss')">収支管理</button><button id="main_cd" onclick="goPg('cd')">貯玉管理</button></div>`:''}
 <div id="pane_ss" class="${pg==='ss'?'':'hidden'}">${pg==='ss'?statSecs()+'<h2 style="margin:14px 0 6px">日別</h2>'+dayList():''}</div>
 <div id="pane_cd" class="${pg==='cd'?'':'hidden'}">${summary()}
 <div class="seg" style="margin-bottom:12px">${Object.entries(KIND).map(([k,x])=>`<button id="tab_${k}" class="${k===tab?'':'sub'}" onclick="setTab('${k}')">${x.l}</button>`).join('')}</div>
 <div class="card"><h2>店舗×日付 <small class="note">${c.rows.length}件</small></h2>${c.rows.length?`<div class="tw"><table id="rows"><tr><th>日付</th><th style="text-align:left">店舗</th><th>台数</th><th>増減</th><th>現金換金<br><small>換金後の残数</small></th><th>タバコ交換</th><th>結果</th></tr>${c.rows.map((r,i)=>`<tr><td>${esc(r.date)}</td><td style="text-align:left">${esc(r.store)}</td><td>${r.n}</td><td${pc(r.net)}>${sg(r.net)}</td><td><input type="number" inputmode="numeric" id="cash_${i}" style="width:72px;font-size:16px" value="${r.cash==null?'':r.cash}" placeholder="−" onchange="setCash(${i},this.value)"></td><td><button class="tob ${r.on?'on':'off'}" onclick="toggleTob(${i})"${r.yp?'':' disabled'}>${r.on?'有り':'無し'}</button>${r.on&&r.tob?`<br><small style="color:#d62828">−${r.tob.toLocaleString()}${u}</small>`:''}</td><td${pc(r.res)}><b>${sg(r.res)}</b>${r.cash!=null?`<br><small style="color:#a35a00">換金後 ${r.cash.toLocaleString()}${u}</small>`:''}</td></tr>`).join('')}</table></div>`:'<p class="note">保存データがありません</p>'}
 <p class="note">増減＝その店・その日の保存済み記録の合計（1台＝回収−使用持ち${W}−使用貯${W}）。タバコ交換有り＝${TOB_YEN.toLocaleString()}円分（${TOB_YEN}÷${tab==='p'?'1玉の価値':'換金額'}、四捨五入）をその行から引きます。残高＝その店の全行の結果の累計。</p></div></div>
 <div class="card"><h2>同期設定</h2><p class="note">記録はスロット版・パチンコ版の同期データ（GitHub）から読みます。ホーム画面から開いた場合は保存領域が別になるので、ここにもトークンを入れてください（スロット版と同じトークン）。</p>
 <div class="row"><label>GitHubトークン</label><input id="sy_tok" type="password" autocomplete="off" style="width:170px" placeholder="${LS.get(TOK,'')?'保存済み（変更時のみ入力）':'github_pat_…'}"></div><button onclick="saveTok()">保存して同期</button><button class="sub" onclick="syncNow()">今すぐ同期</button>
 <p class="note" id="sy">${LS.get(TOK,'')?LS.get('cd_sync_msg',''):'未設定（この端末の記録だけで表示中）'}</p></div>`}
window.saveTok=()=>{const v=$('sy_tok').value.trim();if(!v){alert('トークンを入力してね');return}LS.set(TOK,v);$('sy_tok').value='';syncNow()};
window.setTab=k=>{tab=k;LS.set('cd_tab',k);const Y=scrollY;render();scrollTo(0,Y)};
window.setCash=(i,v)=>{const id=IDS[i];if(!id)return;v=String(v).trim();const l=cashList().filter(x=>x.id!==id);l.push({id,v:v===''?'':String(Math.round(+v)),updatedAt:new Date().toISOString()});LS.set(CASH,l);const Y=scrollY;render();scrollTo(0,Y);syncSoon()};
window.toggleTob=i=>{const id=IDS[i];if(!id)return;const on=!tobOn(id),l=tobList().filter(x=>x.id!==id);l.push({id,on,updatedAt:new Date().toISOString()});LS.set(TOB,l);const Y=scrollY;render();scrollTo(0,Y);syncSoon()};
// ===== 同期：記録は読むだけ（pachinko.json / data.json）、タバコ交換は chodama.json に保存 =====
const b64e=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)},b64d=s=>{const x=atob(String(s).replace(/\s/g,''));const b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return new TextDecoder().decode(b)};
async function ghGet(tok,f){const r=await fetch(REPO+f+'?t='+Date.now(),{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},cache:'no-store'});if(r.status===404)return{sha:null,data:null};if(!r.ok)throw new Error('取得失敗 '+r.status);const j=await r.json();return{sha:j.sha,data:JSON.parse(b64d(j.content||''))}}
let syT=null,busy=false,again=false;const syncSoon=()=>{clearTimeout(syT);syT=setTimeout(syncNow,600)};
const srt=a=>JSON.stringify([...a].sort((x,y)=>x.id<y.id?-1:1));
window.syncNow=async()=>{const tok=LS.get(TOK,'');if(!tok)return;if(busy){again=true;return}busy=true;const msg=t=>{LS.set('cd_sync_msg',t);if($('sy'))$('sy').textContent=t};msg('同期中…');
 try{if(navigator.onLine===false)throw new Error('オフライン');for(const k of['p','s']){try{remote[k]=(await ghGet(tok,KIND[k].file)).data}catch(e){}}
  for(let i=0;i<4;i++){const g=await ghGet(tok,'chodama.json'),rt=(g.data&&g.data.tobacco)||[],mg=mergeTob(tobList(),rt),rc=(g.data&&g.data.cash)||[],mc=mergeTob(cashList(),rc);LS.set(TOB,mg);LS.set(CASH,mc);
   if(srt(mg)!==srt(rt)||srt(mc)!==srt(rc)){const body={message:'chodama sync '+new Date().toISOString(),content:b64e(JSON.stringify({version:1,tobacco:mg,cash:mc,updatedAt:new Date().toISOString()}))};if(g.sha)body.sha=g.sha;
    const r=await fetch(REPO+'chodama.json',{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});if(r.status===409||r.status===422){if(i<3)continue;throw new Error('競合')}if(!r.ok)throw new Error('保存失敗 '+r.status)}break}
  const d=new Date(),p=n=>String(n).padStart(2,'0');msg(`最終同期：${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`);render()}catch(e){msg('エラー：'+(e.message||e))}finally{busy=false;if(again){again=false;syncSoon()}}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
render();syncNow();

</script></body></html>
